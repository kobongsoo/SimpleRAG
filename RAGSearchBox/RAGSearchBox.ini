; RAGSearchBox 설정 — 없는 항목은 기본값으로 동작한다.
; 범위 밖 값은 기본값으로 되돌리고 트레이·로그로 알린다.

[SimpleRAG]
; 비우면 자동 탐색: RAGSearchBox.exe 옆 simplerag.exe -> ..\dist\simplerag -> 개발용 소스
; 워커로 쓰는 simplerag.exe 는 --python-option u 로 빌드된 것이어야 한다(설계서 D8).
SimpleRagExe     =
NoStream         = 0

[Worker]
; boot = 프로그램 시작 때 모델 예열 / lazy = 첫 ? 질문 때
StartMode        = boot
; 이 시간(분) 동안 질문이 없으면 모델을 내려 메모리와 인덱스 잠금을 돌려준다 (0 = 계속 유지)
IdleUnloadMin    = 60
StartTimeoutSec  = 180
AnswerTimeoutSec = 60
RestartMax       = 3

[Monitor]
; 0 = WinEvent(기본) / 1 = UIA 포커스 핸들러
Mode             = 0
; 누름 비트와 "눌렸음" 비트를 함께 보므로 100ms 로 충분하다 (P0-2 실측)
PollMs           = 100
InputRecentMs    = 1500

[Panel]
; 지정 폴더(또는 그 하위)를 탐색기에서 열면 오른쪽에 대화 패널이 뜬다.
Enabled          = 1
; 패널과 겹치지 않도록 그 탐색기 창을 왼쪽으로 물린다. 패널이 사라지면 되돌려 준다.
ShrinkExplorer   = 1
; 지금 보고 있는 폴더를 확인하는 주기(ms)
FolderPollMs     = 500
; 패널 질문의 근거 범위: folder = 지금 보고 있는 폴더(하위 포함) / root = 그 폴더가 속한 [Scope] 폴더 전체
; 패널 머리의 "범위" 에서 바꾸면 이 값이 저장된다
SearchScope      = folder

[Trigger]
; 옛 방식: 탐색기 검색창에 ? 로 시작하는 질문을 치면 답변 창이 뜬다.
; 0 이면 검색창을 찾는 일 자체를 하지 않는다. 기본은 끔(패널을 쓴다).
SearchBox        = 0
; 이 접두어로 시작하는 검색어만 질문으로 본다. 기본값일 때는 전각 ？ 도 인정한다.
Prefix           = ?
MinChars         = 2
DedupSec         = 3

[Scope]
; 이 폴더(하위 폴더 포함)가 곧 인덱싱 폴더이자 패널이 뜨는 폴더다. 비우면 아무 데서도 동작하지 않는다.
; 여기 문서는 자동으로 인덱싱되고, 여기 밖 문서는 인덱스에서 빠진다.
; 예: Folders = D:\분류함;\\fileserver\공유\규정
Folders          =
RecheckMin       = 5

[AutoIndex]
; 1 = 지켜보는 폴더의 문서가 추가·수정·삭제되면 자동으로 인덱스에 반영한다
Enabled          = 1
; 마지막 변경 알림 뒤 이만큼(초) 조용해야 처리한다 — 저장 한 번에 알림이 여러 개 온다
QuietSec         = 5
; 알림을 놓쳤을 때를 대비해 폴더 전체를 대조하는 주기(분). 0 = 시작할 때만
RescanMin        = 10
; 새 문서가 이보다 많으면 바로 넣지 않고 묻는다(트레이 → 지금 인덱싱). 처음 켠 폴더 대비
AskAboveDocs     = 50
; 키워드 색인은 질문이 이만큼(초) 없을 때 다시 만든다
Bm25IdleSec      = 10

[Window]
; off = 검색창 아래 뜨는 창 / right = 탐색기 창 오른쪽에 붙어 따라다니는 패널
; right 일 때는 높이를 탐색기 창에 맞추므로 MaxHeight 를 쓰지 않는다.
Dock             = right
Width            = 460
MaxHeight        = 560
FontSize         = 10

[Log]
; INFO 또는 DIAG (DIAG 는 검색창 판정까지 자세히 남긴다)
Level            = INFO
