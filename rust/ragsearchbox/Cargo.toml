[package]
name = "ragsearchbox"
version = "0.1.0"
edition = "2021"
description = "RAGSearchBox 의 Rust 판 — 트레이 상주, 탐색기 옆 WebView2 패널, simplerag-rs chat 워커"
build = "build.rs"

[[bin]]
name = "RAGSearchBox-rs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tao = "0.30"
wry = "0.47"
rfd = "0.15"
base64 = "0.22"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
percent-encoding = "2"
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole",
  "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_JobObjects",
  "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_IO",
  "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation", "Win32_Security", "Win32_UI_HiDpi",
  "Win32_System_Diagnostics_Debug", "Win32_System_Console",
] }

[build-dependencies]
embed-resource = "2"
