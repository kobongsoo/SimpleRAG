[package]
name = "ragsearchbox"
version = "0.1.6"
edition = "2021"
license = "MIT"
description = "RAGSearchBox 의 Rust 판 — 트레이 상주, 탐색기 옆 WebView2 패널, simplerag-rs chat 워커"
build = "build.rs"

[[bin]]
name = "MoAISearch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tao = "0.30"
wry = "0.47"
rfd = "0.15"
base64 = "0.22"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
percent-encoding = "2"
sha2 = "0.10"
# 설정 > 인덱싱의 쪽 수 — 워커가 쓰는 meta.sqlite 를 읽기만 한다(simplerag 와 같은 판이라 다시 빌드하지 않는다)
rusqlite = { version = "0.32", features = ["bundled"] }
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole",
  "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_JobObjects",
  "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_IO",
  "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation", "Win32_Security", "Win32_UI_HiDpi",
  "Win32_System_Diagnostics_Debug", "Win32_System_Console", "Win32_System_WindowsProgramming",
  "Win32_Graphics_Dxgi", "Win32_Networking_WinHttp",
] }

[build-dependencies]
embed-resource = "2"
