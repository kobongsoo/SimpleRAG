// 인덱싱에서 뺀 폴더인가 — "self" = 이 폴더를 뺐다, "under" = 뺀 폴더의 안쪽, false = 아니다
function isExcluded(path) {
  const low = (p) => p.toLowerCase().replace(/[\\/]+$/, "");
  const lp = low(path);
  if (excluded.some((e) => low(e) === lp)) return "self";
  return excluded.some((e) => lp.startsWith(low(e) + "\\")) ? "under" : false;
}
// 하위 폴더 빼기 — 파일은 그대로 두고 그 폴더의 문서만 인덱스에서 뺀다. 잘못 누르지 않게 폴더 이름을 치게 한다
function excludeSub(path) {
  confirmByName(path, "파일은 지우지 않고, 이 폴더(하위 포함)의 문서만 검색에서 빠집니다.\n오른쪽 클릭 '폴더 다시 넣기' 로 되돌릴 수 있습니다.",
    () => send({ type: "exclude_folder", path, on: true }));
}
// 폴더 이름을 똑같이 쳐야 실행하는 확인 창 — 대소문자는 가리지 않고, 맞을 때만 [폴더 빼기] 가 켜진다
let nameBoxOpen = false;
function confirmByName(path, note, onOk) {
  const need = path.replace(/[\\/]+$/, "").split(/[\\/]/).pop();
  const box = document.createElement("div"); box.className = "namebox";
  box.innerHTML = `<div class="nb"><b></b><div class="nb-path"></div><div class="nb-note"></div><label><span></span><input type="text" spellcheck="false"></label>
    <div class="nb-btns"><button class="nb-no">취소</button><button class="nb-ok" disabled>폴더 빼기</button></div></div>`;
  box.querySelector("b").textContent = `"${need}" 폴더를 뺄까요?`;
  box.querySelector(".nb-path").textContent = path;
  box.querySelector(".nb-note").textContent = note;
  box.querySelector("label span").textContent = `확인을 위해 폴더 이름 "${need}" 을(를) 입력하세요`;
  const inp = box.querySelector("input"), ok = box.querySelector(".nb-ok");
  const close = () => { box.remove(); nameBoxOpen = false; sendRect(); };
  const go = () => { if (!ok.disabled) { close(); onOk(); } };
  inp.oninput = () => { ok.disabled = inp.value.trim().toLowerCase() !== need.toLowerCase(); };
  ok.onclick = go;
  box.querySelector(".nb-no").onclick = close;
  box.addEventListener("keydown", (e) => {
    // 창 전체 단축키가 뒤에서 돌지 않게 막는다. 한글 조합 중 Enter 는 글자 확정이다
    e.stopPropagation();
    if (e.key === "Escape") close();
    else if (e.key === "Enter" && !e.isComposing) go();
  });
  document.body.appendChild(box);
  nameBoxOpen = true;
  sendRect();
  inp.focus();
}
// 인덱싱 폴더 빼기 — 파일은 그대로 두고 인덱스에서만 뺀다. 잘못 누르지 않게 폴더 이름을 치게 한다
function removeRoot(r) {
  confirmByName(r.path, "파일은 지우지 않고, 이 폴더의 문서만 검색에서 빠집니다.", () => {
    scope = null;
    send({ type: "remove_folder", folder: r.path });
  });
}
// 브라우저 기본 메뉴(뒤로 · 새로 고침 · 인쇄 …)는 앱에 맞지 않아 끈다.
//   입력칸과 글을 고른 때만 남긴다 — 복사 · 붙여넣기가 필요하다
document.addEventListener("contextmenu", (e) => {
  if (e.defaultPrevented || e.target.closest("input, textarea")) return;
  if (String(window.getSelection() || "")) return;
  e.preventDefault();
  hideMenu();
});

// ── AI 답변창 ────────────────────────────────────────────
//   미리 보기 창처럼 켜고 끈다. 찾은 문서를 다시 검색하지 않고 문서별로 정리한다(설계서 §4 · §5).
//   워커는 한 번에 한 일만 하므로, 쓰는 중에 새 일이 오면 /cancel 로 멈추고 끝남 사건을 기다린 뒤 다음 일을 한다.
const BRIEF_CANDS = 8;      // 겹치는 문서를 빼도 3건이 남도록 넉넉히 보낸다
const BRIEF_DELAY = 1000;   // 찾기가 끝난 뒤 이만큼 있다가 정리한다 — 연달아 찾을 때 시작하지 않게
const BRIEF_CACHE = 20;

// 지금 목록을 가리키는 표식 — 같은 검색어 · 범위 · 조건이면 같은 정리다
function briefKey() { return JSON.stringify([lastQ, scope, cond.off, cond.widen]); }

//------------------------------------------------------------------
// 정리할 후보 — 화면 정렬과 상관없이 관련도 순(찾기 결과 순서)
//=> 관련도 낮은 문서 · 글이 없는 문서는 뺀다. 쪽 줄이 없는 문서는 경로만 보내면 워커가 앞쪽 글을 읽는다.
//------------------------------------------------------------------
function briefItems() {
  const out = [];
  // 모두 찾기는 묶음 순서라 관련도 순이 아니다 — 리랭킹 점수가 있는 문서만 점수 순으로(설계서 §5)
  const list = done && done.all
    ? docs.filter((d) => d.meta.score != null && d.meta.score > -50).sort((a, b) => b.meta.score - a.meta.score) : docs;
  for (const d of list) {
    if (out.length >= BRIEF_CANDS) break;
    if (d.meta.low || d.meta.no_text) continue;
    const p = d.pages.find((x) => !x.low && (x.text || x.ids));
    if (d.pages.length && !p) continue;
    out.push({ doc: d.meta.doc_name, path: d.meta.doc_path, page: p ? p.page : null, text: p && p.text ? p.text : "",
      ids: p && p.ids ? p.ids : [], snippet: p ? p.snippet : "" });
  }
  return out;
}
// 찾은 문서가 있는데 정리할 후보가 없을 때의 안내
function briefEmptyText() {
  if (docs.some((d) => !d.meta.low && d.meta.no_text)) return "글을 읽을 수 없는 문서라 정리하지 못했습니다.";
  return "관련도가 낮은 문서만 찾았습니다 — 정리하지 않았습니다.";
}

//------------------------------------------------------------------
// 쓰는 중인 정리 멈추기 — 끝남 사건이 올 때까지 그 정리의 글은 버린다
//------------------------------------------------------------------
function stopBrief() {
  clearTimeout(briefTimer);
  briefNext = false;
  // 멈춘 정리는 다 쓴 것이 아니다 — 같은 목록을 다시 찾으면 새로 정리한다
  if (ai && !ai.done) ai.stopped = true;
  if (briefBusy && !briefDrop) {
    briefDrop = true;
    send({ type: "brief_cancel" });
  }
}

//------------------------------------------------------------------
// 지금 목록을 정리하기 시작 — 창이 꺼져 있으면 아무것도 하지 않는다
//=> 1) 같은 목록의 끝난 정리가 있으면 그대로 보여 준다
//   2) 앞선 정리가 도는 중이면 멈추고, 끝남 사건에서 다시 시작한다
//------------------------------------------------------------------
function startBrief() {
  clearTimeout(briefTimer);
  if (!aiOn) return;
  if (!lastQ || !docs.length) { ai = null; redrawAi(); return; }
  // 비슷한 문서 찾기 결과 — 목록 정리 대신 넣은(기준) 문서를 간략히 요약한다. 글은 찾기 결과에 실려 온 고른 조각
  if (simSrc) { startSummary(); return; }
  const key = briefKey();
  if (ai && ai.key === key && !ai.stopped && !briefDrop) return;
  if (briefCache.has(key)) { ai = briefCache.get(key); redrawAi(); return; }
  const items = briefItems();
  if (!items.length) { ai = { key, q: lastQ, text: "", empty: briefEmptyText(), done: true }; redrawAi(); return; }
  if (briefBusy) stopBrief();
  ai = { key, q: lastQ, text: "", items: null, info: null, err: null, done: false };
  if (briefBusy) {
    briefNext = true;
    redrawAi();
    return;
  }
  briefBusy = true;
  send({ type: "brief", q: lastQ, items });
  redrawAi();
}
//------------------------------------------------------------------
// 기준 문서 요약 (비슷한 문서 찾기) — AI 답변창이 켜져 있을 때
//=> 워커 /brief 의 요약 모드로 기준 문서 하나를 2~4문장 요약한다. 같은 문서의 끝난 요약은 다시 만들지 않는다.
//------------------------------------------------------------------
function startSummary() {
  const s = (done && done.source) || {};
  const key = "sim:" + (s.doc_path || simSrc.path);
  if (ai && ai.key === key && !ai.stopped && !briefDrop) return;
  if (briefCache.has(key)) { ai = briefCache.get(key); redrawAi(); return; }
  if (!s.text) { ai = { key, q: lastQ, text: "", empty: "기준 문서에서 요약할 글을 찾지 못했습니다.", done: true, summary: true }; redrawAi(); return; }
  if (briefBusy) stopBrief();
  ai = { key, q: lastQ, text: "", items: null, info: null, err: null, done: false, summary: true };
  if (briefBusy) { briefNext = true; redrawAi(); return; }
  briefBusy = true;
  // 바깥 문서면 경로가 인덱스 문서가 아니다 — [1] 을 누르면 넣은 파일을 그대로 연다
  send({ type: "brief", q: lastQ, mode: "summary", items: [{ doc: s.name || simSrc.name, path: s.doc_path || simSrc.path, page: null, text: s.text, snippet: "" }] });
  redrawAi();
}
// 찾기가 끝났다 — 창이 열려 있으면 잠시 뒤 정리한다
function scheduleBrief() {
  clearTimeout(briefTimer);
  if (aiOn) briefTimer = setTimeout(startBrief, BRIEF_DELAY);
}
// 쓰던 정리가 끝났다 — 끝난 정리는 기억하고, 기다리던 일이 있으면 이어서 한다
function briefEnded() {
  briefBusy = false;
  if (briefDrop) {
    briefDrop = false;
    // 기다리던 자리표시를 비워야 startBrief 가 진행 중으로 착각하지 않는다
    if (briefNext) { briefNext = false; ai = null; startBrief(); }
  }
}

// 켜고 끄기 — 켜면 지금 목록을 정리하고, 끄면 쓰던 정리를 멈춘다
function toggleAi() {
  aiOn = !aiOn;
  if (LAYOUT === "window") {
    $("aip").classList.toggle("hidden", !aiOn);
    $("split3").classList.toggle("hidden", !aiOn);
    $("aitoggle").classList.toggle("on", aiOn);
    applyLayout();
  } else {
    $("paip").classList.toggle("hidden", !aiOn);
    $("pask").classList.toggle("on", aiOn);
  }
  saveUi();
  if (aiOn) { redrawAi(); startBrief(); return; }
  stopBrief();
}

//------------------------------------------------------------------
// 쌓인 글을 줄로 나누기
//=> "[n] 글" 은 문서 줄, "[n!] 글" 은 그 줄을 원문 발췌로 바꿈, "[겹침] n" · "[오류] 글".
//------------------------------------------------------------------
function briefParts(text) {
  const r = { lines: {}, dropped: 0, err: "" };
  for (const ln of String(text || "").split("\n")) {
    const m = ln.match(/^\[(겹침|오류|\d+!?)\]\s?(.*)$/);
    if (!m) continue;
    const k = m[1];
    if (k === "겹침") r.dropped = +m[2] || 0;
    else if (k === "오류") r.err = m[2];
    else if (k.endsWith("!")) r.lines[parseInt(k, 10)] = { text: m[2], ex: true };
    else r.lines[+k] = { text: m[2], ex: false };
  }
  return r;
}
// 문서 열기 아이콘(바깥으로 나가는 화살표)
const OPEN_SVG = `<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M9 2h5v5M14 2 7.5 8.5M12 9.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function evItem(n) { return ai && ai.items ? ai.items.find((e) => +e.no === n) : null; }

// 창 안의 글 — 머리 · 문서별 줄 · 맨 아래 안내
function aiPaneHtml() {
  const head = (sub, stop) => `<div class="hd"><span class="tt">✦ AI 참고 답변</span>${sub ? `<small>${esc(sub)}</small>` : ""}<span class="sp"></span>
    ${stop ? `<button id="aistop" title="정리 멈추기">■ 중지</button>` : ""}<button id="aix" title="닫기">✕</button></div>`;
  if (!ai) return head("", false) + `<div class="ph2">찾은 문서가 있으면 여기에 정리해 드립니다.</div>`;
  if (ai.empty) return head("", false) + `<div class="ph2">${esc(ai.empty)}</div>`;
  const p = briefParts(ai.text);
  const items = ai.items || [];
  const sub = ai.summary ? "넣은 문서 요약" : !ai.items ? "문서를 고르는 중…" :
    `찾은 문서 ${docs.length}건 중 상위 ${items.length}건` + (p.dropped ? ` · 겹침 ${p.dropped}건 제외` : "");
  let body = "";
  // "쓰는 중…" 은 앞 줄이 끝난 뒤에만 — 줄이 끝나면 글 끝이 줄바꿈이다
  const next = !ai.text || ai.text.endsWith("\n") ? items.findIndex((e) => !(p.lines[+e.no] && p.lines[+e.no].text)) : -1;
  items.forEach((e, i) => {
    const l = p.lines[+e.no];
    const writing = !ai.done && !ai.stopped && i === next;
    if (!(l && l.text) && !writing) return;
    body += `<div class="ln"><button class="cite ${ai.pick === +e.no ? "on" : ""}" data-ev="${e.no}" title="${esc(e.path || e.doc)} — 미리 보기">${e.no}</button>`
      + `<span>${l && l.ex ? `<i class="ex">원문 발췌</i> ` : ""}${l && l.text ? esc(l.text) : `<span class="wr">쓰는 중…</span>`}</span>`
      + `<em>${esc(e.doc)}${e.page != null ? ` · p.${e.page}` : ""}`
      // 문서 이름 옆 작은 열기 아이콘 — 미리 보기를 거치지 않고 바로 연다
      + (e.path ? `<button class="dopen" data-open="${e.no}" title="${esc(e.doc)} 열기" aria-label="${esc(e.doc)} 열기">${OPEN_SVG}</button>` : "")
      + `</em></div>`;
  });
  if (ai.err || p.err) body += `<div class="er">${esc(ai.err || p.err)}</div>`;
  if (!body) body = `<div class="ph2">${ai.items && !items.length ? esc(briefEmptyText()) : ai.summary ? "요약하는 중…" : "정리하는 중…"}</div>`;
  const cost = ai.info && ai.info.total_s != null ? ` · 첫 글자 ${ai.info.ttft_s}초 · 완료 ${ai.info.total_s}초` : "";
  return head(sub, briefBusy && !briefDrop) + body +
    `<div class="ft">${ai.stopped ? "중지했습니다 · " : ""}${ai.summary ? "문서에서 고르게 뽑은 부분을 바탕으로 만든 참고 요약입니다." : "검색된 부분을 바탕으로 만든 참고 답변입니다."} 원문 확인을 권장합니다.${cost}
      · <button id="aichat" title="채팅 모드에서 문서를 근거로 묻습니다">💬 채팅에서 이어 묻기</button></div>`;
}
function redrawAi() {
  const box = $(LAYOUT === "window" ? "aip" : "paip");
  if (!aiOn) return;
  const top = box.scrollTop;
  box.innerHTML = aiPaneHtml();
  box.scrollTop = top;
  const x = $("aix");
  if (x) x.onclick = toggleAi;
  const st = $("aistop");
  if (st) st.onclick = () => { stopBrief(); redrawAi(); };
  const c = $("aichat");
  if (c) c.onclick = () => send(LAYOUT === "window" ? { type: "switch_mode", mode: "rag", folder: scope } : { type: "mode", mode: "rag" });
  box.querySelectorAll("[data-ev]").forEach((b) => { b.onclick = () => showEvidence(+b.dataset.ev); });
  box.querySelectorAll("[data-open]").forEach((b) => {
    b.onclick = () => {
      const e = evItem(+b.dataset.open);
      // 쪽을 알면 그 쪽에서 연다
      if (e && e.path) send({ type: "open_page", path: e.path, page: e.page != null ? e.page : null });
    };
  });
}
//------------------------------------------------------------------
// [n] 누름 — 미리 보기 창이 꺼져 있어도 켜서 그 문서 · 쪽을 보여 준다
//   PDF 이고 쪽을 알면 그 쪽(PDF 뷰어), 아니면 정리에 쓴 글(글 미리 보기). 좁은 패널이면 문서를 그 쪽에서 연다
//------------------------------------------------------------------
function showEvidence(n) {
  const e = evItem(n);
  if (!e) return;
  ai.pick = n;
  redrawAi();
  const path = e.path || "";
  if (LAYOUT !== "window") { if (path) send({ type: "open_page", path, page: e.page != null ? e.page : null }); return; }
  if (!pvShown) togglePv();
  // 눌린 문서를 미리 보기 창에 — 목록 선택과 따로 움직인다
  pvTarget = path ? { path, page: e.page != null ? e.page : null } : null;
  $("pvtitle").textContent = `[${n}] ${e.doc}`;
  $("pvtitle").title = path;
  $("pvpage").textContent = e.page != null ? `${e.page}쪽` : "";
  $("pvopen").disabled = !path;
  $("pvopen").textContent = openLabel(path, e.page) + " ↗";
  $("pvreveal").disabled = !path;
  $("pvempty").classList.add("hidden");
  if (isPdf(path) && e.page != null) {
    $("pvtext").classList.add("hidden");
    send({ type: "preview", path, page: e.page });
    sendRect();
  } else {
    send({ type: "preview_hide" });
    const t = $("pvtext");
    t.classList.remove("hidden");
    t.innerHTML = `<div class="sec">AI 참고 답변 [${n}]</div>${hl(e.full || e.snippet || "")}
      <div class="note">AI 가 정리에 쓴 글입니다 — 원본 모양(표 서식 · 그림)은 "문서 열기"로 보세요.</div>`;
    t.scrollTop = 0;
  }
}

// ── 탐색 창 · 주소줄 ─────────────────────────────────────
function rootOf(p) {
  if (!p) return null;
  const lp = p.toLowerCase().replace(/[\\/]+$/, "");
  return roots.find((r) => { const lr = r.path.toLowerCase().replace(/[\\/]+$/, ""); return lp === lr || lp.startsWith(lr + "\\"); }) || null;
}
function setScope(p) {
  scope = p;
  saveUi();
  drawNav();
  if (lastQ) runFind(lastQ); else drawCrumb();
}
function drawCrumb() {
  if (LAYOUT !== "window") return;
  const c = $("crumb");
  let h = `<button data-p="">MoAI 탐색기</button>`;
  const r = rootOf(scope);
  if (scope && r) {
    h += `<span class="sep">›</span><button data-p="${esc(r.path)}">${esc(r.name)}</button>`;
    const rest = scope.slice(r.path.replace(/[\\/]+$/, "").length).split(/[\\/]/).filter(Boolean);
    let acc = r.path.replace(/[\\/]+$/, "");
    for (const part of rest) { acc += "\\" + part; h += `<span class="sep">›</span><button data-p="${esc(acc)}">${esc(part)}</button>`; }
  } else {
    h += `<span class="sep">›</span><button data-p="">검색 폴더 전체</button>`;
  }
  c.innerHTML = h;
  c.querySelectorAll("button").forEach((b) => { b.onclick = () => setScope(b.dataset.p || null); });
  c.scrollLeft = c.scrollWidth;
  $("back").disabled = histPos <= 0;
  $("fwd").disabled = histPos >= hist.length - 1;
  $("up").disabled = !scope;
}
// 폴더 옆 숫자 — 인덱싱 중이면 (끝낸 수/전체), 허락을 기다리면 (문서 수 · 대기 N), 그 밖에는 (문서 수)
const fmtN = (n) => Number(n).toLocaleString("ko-KR");
function cntText(r) {
  if (r.progress) return `(${fmtN(r.progress[0])}/${fmtN(r.progress[1])})`;
  if (r.count == null) return "";
  return r.waiting ? `(${fmtN(r.count)} · 대기 ${fmtN(r.waiting)})` : `(${fmtN(r.count)})`;
}
// 숫자 표시 종류 — 인덱싱 중(깜박임) · 허락 대기(진한 색)
function cntState(r) {
  return r.progress ? "busy" : (r.waiting || r.waiting_del) ? "wait" : "";
}
function cntTip(r) {
  if (r.progress) return "인덱싱 중 — 끝낸 문서 / 이번에 처리할 문서";
  if (r.waiting_del && !r.waiting) return "사라진 문서가 많아 기다립니다 — 오른쪽 클릭 '지금 인덱싱' 을 누르면 뺍니다";
  return r.waiting ? `새 문서 ${fmtN(r.waiting)}건이 기다립니다 — 오른쪽 클릭 '지금 인덱싱' 을 누르면 넣습니다` : "인덱스에 있는 문서 수";
}
function totalText() {
  return roots.some((r) => r.count != null) ? `(${fmtN(roots.reduce((a, r) => a + (r.count || 0), 0))})` : "";
}
function drawNav() {
  drawCrumb();
  if (LAYOUT !== "window") return;
  const s = $("side");
  let h = `<div class="h">최근 검색</div>`;
  const rc = recent();
  h += rc.length ? rc.map((q) => `<button class="i" data-q="${esc(q)}"><svg width="14" height="14" style="color:var(--muted)"><use href="#i-clock"/></svg><span class="n">${esc(q)}</span></button>`).join("")
    : `<div class="empty">아직 없습니다</div>`;
  h += `<div class="h">검색 폴더</div>`;
  // 문서 수 — 인덱싱 폴더마다 Rust 가 상태 파일로 센 값(count). 모든 인덱싱 폴더는 그 합
  h += `<button class="i ${scope ? "" : "on"}" data-p=""><span class="tw"></span><span class="n">모든 검색 폴더</span><span class="cnt" id="cntall">${esc(totalText())}</span></button>`;
  const node = (path, name, depth, icon, root) => {
    const on = scope && scope.toLowerCase() === path.toLowerCase();
    const open = openDirs.has(path);
    const kids = dirs[path];
    const tw = kids && !kids.length ? "" : open ? "▾" : "▸";
    const ex = !root && isExcluded(path);
    let out = `<button class="i ${on ? "on" : ""} ${ex ? "off" : ""}" data-p="${esc(path)}" style="padding-left:${6 + depth * 14}px" title="${esc(path)}">
      <span class="tw" data-dir="${esc(path)}">${tw}</span><svg width="16" height="16"><use href="#${icon}"/></svg><span class="n">${esc(name)}</span>${ex === "self" ? `<span class="offtag">(뺌)</span>` : ""}${root ? `<span class="cnt ${cntState(root)}" data-cnt="${esc(path)}" title="${esc(cntTip(root))}">${esc(cntText(root))}</span>` : ""}</button>`;
    if (open && kids) for (const k of kids) out += node(path.replace(/[\\/]+$/, "") + "\\" + k, k, depth + 1, "i-fold");
    return out;
  };
  for (const r of roots) h += node(r.path, r.name, 0, r.drive ? "i-drive" : "i-moai", r);
  if (!roots.length) h += `<div class="empty">아래 [＋ 폴더 추가] 로 검색할 폴더를 넣으세요</div>`;
  // 폴더 빼기는 인덱싱 폴더(맨 위 폴더)를 골랐을 때만 — 그 아래 하위 폴더는 뺄 수 없다
  const picked = scope && roots.find((r) => r.path.toLowerCase().replace(/[\\/]+$/, "") === scope.toLowerCase().replace(/[\\/]+$/, ""));
  h += `<div class="fbar"><button id="fadd" title="검색할 폴더를 고르기 창으로 넣습니다">＋ 폴더 추가</button>
    <button id="frem" ${picked ? "" : "disabled"} title="${picked ? esc(picked.path) + " 을(를) 검색 폴더에서 뺍니다" : "뺄 검색 폴더를 위 목록에서 고르세요"}">－ 폴더 빼기</button></div>`;
  s.innerHTML = h;
  $("fadd").onclick = () => send({ type: "add_folder" });
  $("frem").onclick = () => { if (picked) removeRoot(picked); };
  s.querySelectorAll("[data-q]").forEach((b) => { b.onclick = () => runFind(b.dataset.q); });
  s.querySelectorAll("[data-p]").forEach((b) => {
    b.onclick = () => setScope(b.dataset.p || null);
    // "모든 인덱싱 폴더" 는 한 폴더가 아니라서 메뉴가 없다
    if (b.dataset.p) b.oncontextmenu = (e) => { e.preventDefault(); showFolderMenu(e.clientX, e.clientY, b.dataset.p); };
  });
  s.querySelectorAll("[data-dir]").forEach((t) => {
    t.onclick = (e) => {
      e.stopPropagation();
      const p = t.dataset.dir;
      if (openDirs.has(p)) { openDirs.delete(p); drawNav(); return; }
      openDirs.add(p);
      if (dirs[p]) drawNav(); else send({ type: "list_dirs", path: p });
    };
  });
}

// 내용 전체 보기 팝업 — 이 문서에서 찾은 곳들의 청크 본문을 모두 보여 주고, 고른 쪽으로 스크롤한다
function showChunks(d, pick) {
  const box = document.createElement("div"); box.className = "chunkbox"; box.tabIndex = -1;
  const parts = d.pages.map((p, k) => `<section class="${k === pick ? "on" : ""}"><h4>${p.page != null ? `${p.page}쪽` : "위치 " + (k + 1)}${p.section ? ` · ${esc(p.section)}` : ""}</h4>
    <div class="cb-text">${hl(p.text || p.snippet)}</div></section>`).join("");
  box.innerHTML = `<div class="cb"><div class="cb-hd"><b></b><span></span><button title="닫기 (Esc)">✕</button></div><div class="cb-body">${parts}</div></div>`;
  box.querySelector("b").textContent = d.meta.doc_name;
  box.querySelector(".cb-hd span").textContent = `찾은 곳 ${d.pages.length}개`;
  const close = () => box.remove();
  box.querySelector(".cb-hd button").onclick = close;
  // 바깥(어두운 곳)을 누르면 닫는다
  box.onclick = (e) => { if (e.target === box) close(); };
  box.addEventListener("keydown", (e) => {
    // Esc 가 패널까지 닫지 않게 막는다
    e.stopPropagation();
    if (e.key === "Escape") close();
  });
  document.body.appendChild(box);
  box.focus();
  const on = box.querySelector("section.on");
  if (on) box.querySelector(".cb-body").scrollTop = on.offsetTop - 8;
}

// ── 그리기: 좁은 패널 카드 ───────────────────────────────
let cardPick = {};   // 문서 경로 → 고른 쪽 줄 번호
function renderCards() {
  rows = [];
  const C = $("cards");
  if (!docs.length) {
    showMessage(lastQ ? noResultMsg(lastQ, "") :
      `<img src="data:image/png;base64,__MOAI__" alt=""><br><b>${esc(scope ? `'${pickName()}' 폴더에서 찾기` : "모든 검색 폴더에서 찾기")}</b><br>문장으로 쓰면 그 내용이 있는<br>문서 · 쪽 · 해당 부분을 찾아 줍니다.`);
    return;
  }
  let h = "";
  for (const d of docs) {
    const m = d.meta;
    const di = rows.push({ kind: "doc", doc: d }) - 1;
    const pick = cardPick[m.doc_path] != null ? cardPick[m.doc_path] : 0;
    const chips = d.pages.slice(0, 8).map((p, k) =>
      `<button class="${k === pick ? "on" : ""}" data-chip="${di}:${k}" title="${esc(p.section || "")}">${p.page != null ? "p." + p.page : "·"}</button>`).join("")
      + (d.pages.length > 8 ? `<button data-big="1">+${d.pages.length - 8}</button>` : "");
    const p = d.pages[pick];
    h += `<div class="card ${m.low ? "low" : ""}" data-row="${di}"><div class="t">${docIcon(m.doc_path)}<span title="${esc(tipOf(m))}">${esc(m.doc_name)}</span></div>
      <div class="m">${m.group === "copy" || m.group === "version" ? verLabel(m) : m.group === "similar" ? `비슷한 곳 ${d.pages.length} · ${simBars(m.pct)}`
        : (m.meta_hit && !d.pages.length ? "조건 일치" : m.name_hit && !d.pages.length ? "이름에 검색어" : d.pages.length + "곳") + " · " + bars(m.score, m.low)}${whoOf(m) ? " · " + esc(whoOf(m)) : ""}</div>
      ${d.pages.length ? `<div class="pgs">${chips}</div>` : ""}
      ${p ? `<div class="sn">${p.section ? `<b>${esc(p.section)}</b>` : ""}${marked(p.snippet, p.marks)}
        <div class="acts"><button data-open="${di}:${pick}">${openLabel(m.doc_path, p.page)} ↗</button><button data-reveal="${di}">폴더 열기</button><button data-full="${di}:${pick}">내용 전체 보기</button></div></div>` : ""}
      ${!d.pages.length ? `<div class="sn"><div class="acts"><button data-open="${di}:-1">문서 열기 ↗</button><button data-reveal="${di}">폴더 열기</button></div></div>` : ""}
    </div>`;
  }
  C.innerHTML = h;
  C.querySelectorAll("[data-chip]").forEach((b) => {
    b.onclick = () => {
      const [di, k] = b.dataset.chip.split(":").map(Number);
      const d = rows[di].doc;
      cardPick[d.meta.doc_path] = k;
      // 쪽 칩 — 설정이 "기본 앱" 이면 바로 열고, 아니면 이 카드의 발췌만 그 쪽으로 바꾼다(창을 띄우지 않는다)
      if (pageClick === "app") send({ type: "open_page", path: d.meta.doc_path, page: d.pages[k].page });
      renderCards();
    };
  });
  C.querySelectorAll("[data-full]").forEach((b) => {
    b.onclick = () => {
      const [di, k] = b.dataset.full.split(":").map(Number);
      showChunks(rows[di].doc, k);
    };
  });
  C.querySelectorAll("[data-open]").forEach((b) => {
    b.onclick = () => {
      const [di, k] = b.dataset.open.split(":").map(Number);
      const d = rows[di].doc;
      send({ type: "open_page", path: d.meta.doc_path, page: k >= 0 && d.pages[k] ? d.pages[k].page : null });
    };
  });
  C.querySelectorAll("[data-reveal]").forEach((b) => { b.onclick = () => send({ type: "reveal", path: rows[+b.dataset.reveal].doc.meta.doc_path }); });
  C.querySelectorAll("[data-big]").forEach((b) => { b.onclick = () => send({ type: "big", q: lastQ, folder: scope }); });
}

// ── 창 나눔 · 열 너비 — 끌어서 바꾸고 이 PC 에 기억 ────────
//   탐색 창(--side) · 미리 보기 창(--pv) · 목록의 쪽 · 관련도 · 수정한 날짜 열(--c-*). 두 번 누르면 처음대로.
//   pv 가 null 이면 처음 비율(36%)을 그대로 쓴다.
const LAYOUT_DEF = { side: 200, pv: null, page: 64, rel: 70, date: 92, ai: null };
let lay = Object.assign({}, LAYOUT_DEF, UI_SAVED.lay && typeof UI_SAVED.lay === "object" ? UI_SAVED.lay : {});
function saveLayout() { saveUi(); }
function applyLayout() {
  const m = $("main").style;
  // 창이 기억한 너비보다 작아졌으면 목록이 300px 은 남게 그 자리에서만 줄인다(기억한 값은 그대로)
  const W = $("main").getBoundingClientRect().width || innerWidth;
  const side = Math.max(120, Math.min(lay.side, W - 310 - (pvShown ? 220 : 0)));
  m.setProperty("--side", side + "px");
  if (lay.pv) m.setProperty("--pv", Math.max(220, Math.min(lay.pv, W - side - 310)) + "px"); else m.removeProperty("--pv");
  // AI 답변창 높이 — 목록이 120px 은 남게. 처음에는 34%
  if (lay.ai) $("mid").style.setProperty("--ai", clamp(lay.ai, 140, Math.max(140, $("mid").getBoundingClientRect().height - 125)) + "px");
  else $("mid").style.removeProperty("--ai");
  // 열 너비는 목록 상자에 걸어 머리글과 모든 줄이 같은 너비를 쓴다
  const l = $("list").style;
  l.setProperty("--c-page", lay.page + "px");
  l.setProperty("--c-rel", lay.rel + "px");
  l.setProperty("--c-date", lay.date + "px");
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
// 끌기 공통 — 누른 곳에서 움직인 거리(dx)를 넘긴다. 포인터를 붙잡아 미리 보기(PDF) 위를 지나도 놓치지 않게
function dragX(el, onStart, onMove) {
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const x0 = e.clientX, st = onStart();
    el.setPointerCapture(e.pointerId);
    el.classList.add("drag"); document.body.classList.add("dragging");
    const move = (ev) => { onMove(st, ev.clientX - x0); applyLayout(); };
    const up = () => {
      el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
      el.classList.remove("drag"); document.body.classList.remove("dragging");
      saveLayout(); sendRect();
    };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  });
  el.addEventListener("click", (e) => e.stopPropagation());
}
function bindSplits() {
  const W = () => $("main").getBoundingClientRect().width;
  // 탐색 창 — 120px ~ (목록이 300px 은 남게)
  dragX($("split1"), () => lay.side, (s, dx) => {
    const pv = pvShown ? $("pv").getBoundingClientRect().width : 0;
    lay.side = Math.round(clamp(s + dx, 120, Math.min(480, W() - pv - 310)));
  });
  $("split1").ondblclick = () => { lay.side = LAYOUT_DEF.side; applyLayout(); saveLayout(); };
  // 미리 보기 창 — 오른쪽 끝이 고정이므로 왼쪽으로 끌면 넓어진다
  dragX($("split2"), () => $("pv").getBoundingClientRect().width, (s, dx) => {
    lay.pv = Math.round(clamp(s - dx, 220, W() - lay.side - 310));
  });
  $("split2").ondblclick = () => { lay.pv = null; applyLayout(); saveLayout(); };
  // AI 답변창 — 아래 끝이 고정이므로 위로 끌면 높아진다. 미리 보기 자리는 바뀌지 않는다
  const s3 = $("split3");
  s3.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const y0 = e.clientY, h0 = $("aip").getBoundingClientRect().height;
    s3.setPointerCapture(e.pointerId);
    s3.classList.add("drag");
    const move = (ev) => { lay.ai = Math.round(h0 - (ev.clientY - y0)); applyLayout(); };
    const up = () => {
      s3.removeEventListener("pointermove", move); s3.removeEventListener("pointerup", up); s3.removeEventListener("pointercancel", up);
      s3.classList.remove("drag");
      saveLayout();
    };
    s3.addEventListener("pointermove", move); s3.addEventListener("pointerup", up); s3.addEventListener("pointercancel", up);
  });
  s3.ondblclick = () => { lay.ai = null; applyLayout(); saveLayout(); };
}
// 목록 머리글의 열 경계 — 열의 왼쪽 경계라 왼쪽으로 끌면 그 열이 넓어진다(이름 열이 그만큼 준다)
function bindColGrip(g) {
  const k = g.dataset.col;
  dragX(g, () => g.parentElement.getBoundingClientRect().width, (s, dx) => { lay[k] = Math.round(clamp(s - dx, 36, 360)); });
  g.ondblclick = (e) => { e.stopPropagation(); lay[k] = LAYOUT_DEF[k]; applyLayout(); saveLayout(); };
}

// ── 사용 안내(첫 실행 안내 설계서 §5) ───────────────────
//   실제 화면 위에 막을 깔고 한 곳만 비춘다. 막은 비춘 곳 둘레의 네 조각이라 비춘 곳은 눌러 볼 수 있다.
//   맨 아래 상태줄은 늘 밝게 둔다(인덱싱 진행이 보이게). 비출 요소가 안 보이면 그 단계를 건너뛴다.
const TOUR_STEPS = [
  { sel: "#side button:has([data-cnt])", title: "문서를 읽는 중", text: "고른 폴더의 문서를 읽고 있습니다. 폴더 옆 숫자(<b>읽은 문서 / 전체</b>)로 진행을 볼 수 있고, <b>끝나기 전에도</b> 읽은 문서부터 찾을 수 있습니다." },
  { sel: ".search", title: "문장으로 찾기", text: "낱말뿐 아니라 <b>문장</b>으로 써도 됩니다. 예: “작년 내가 작성한 AI 제안서”, “출장비 정산 기준”." },
  { sel: "#fawrap", title: "모두 찾기", text: "검색어가 들어 있는 문서를 모두, <b>문서 › 쪽 › 발췌</b>로 보여 줍니다. 끄면 관련도 높은 문서만 봅니다." },
  { sel: "#pvtoggle", title: "미리 보기", text: "쪽을 <b>한 번</b> 누르면 미리 보기 창에 그 쪽이 보이고, <b>두 번</b> 누르면 문서가 열립니다. (Alt+P)" },
  { sel: "#aitoggle", title: "AI 정리", text: "찾은 문서 중 상위 3건을 AI 가 한 줄씩 정리합니다. 문서 이름 옆 아이콘으로 원문을 바로 엽니다. (Alt+A)" },
  { sel: "#toai", title: "AI 에게 묻기", text: "문서를 근거로 AI 에게 질문하고 답을 받는 <b>채팅 모드</b>입니다. 답 아래에 근거 문서가 함께 나옵니다." },
  { sel: "#toset", title: "설정 · 폴더", text: "검색 폴더 추가 · 빼기와 동의어 · 이름 별칭 사전은 [⚙ 설정] 과 왼쪽 아래 [＋ 폴더 추가] 에서. 창을 닫아도 <b>트레이 아이콘</b>에 남고, 두 번 누르면 다시 열립니다. 이 안내는 [?] 에서 다시 볼 수 있습니다." },
];
let tourAt = -1;         // 지금 단계(-1 = 안내 중 아님)
function tourEl(i) {
  const el = document.querySelector(TOUR_STEPS[i].sel);
  if (!el || el.closest(".hidden")) return null;
  const r = el.getBoundingClientRect();
  return r.width > 0 && r.height > 0 ? el : null;
}
//------------------------------------------------------------------
// 안내 시작 — 막 · 테두리 · 말풍선을 만들고 1단계로. PDF 미리 보기는 막이 덮지 못해 잠시 숨긴다
//------------------------------------------------------------------
function startTour() {
  hideMenu();
  $("keys").classList.add("hidden");
  if (!document.querySelector(".tm")) {
    for (const k of ["t", "b", "l", "r"]) { const d = document.createElement("div"); d.className = "tm"; d.dataset.tm = k; document.body.appendChild(d); }
    const ring = document.createElement("div"); ring.id = "tourring"; document.body.appendChild(ring);
    const bub = document.createElement("div"); bub.id = "tourbub"; document.body.appendChild(bub);
  }
  send({ type: "preview_hide" });
  tourAt = -1;
  tourGo(1);
}
// 다음 · 앞 단계로 — 비출 요소가 없는 단계는 건너뛴다
function tourGo(dir) {
  let i = tourAt + dir;
  while (i >= 0 && i < TOUR_STEPS.length && !tourEl(i)) i += dir;
  if (i < 0) return;
  if (i >= TOUR_STEPS.length) { endTour(); return; }
  tourAt = i;
  tourDraw();
}
//------------------------------------------------------------------
// 지금 단계 그리기 — 요소 자리에 테두리, 둘레에 막, 아래(넘치면 위)에 말풍선
//------------------------------------------------------------------
function tourDraw() {
  if (tourAt < 0) return;
  const el = tourEl(tourAt);
  if (!el) { tourGo(1); return; }
  const pad = 4, r = el.getBoundingClientRect();
  const x = Math.max(0, r.left - pad), y = Math.max(0, r.top - pad), w = r.width + pad * 2, h = r.height + pad * 2;
  const st = document.querySelector(".st");
  // 막의 아래 끝 — 상태줄 위까지(상태줄은 늘 밝게)
  const bottom = st ? st.getBoundingClientRect().top : innerHeight;
  const set = (k, l, t, ww, hh) => Object.assign(document.querySelector(`[data-tm="${k}"]`).style,
    { left: l + "px", top: t + "px", width: Math.max(0, ww) + "px", height: Math.max(0, hh) + "px" });
  set("t", 0, 0, innerWidth, y);
  set("b", 0, Math.min(y + h, bottom), innerWidth, bottom - Math.min(y + h, bottom));
  set("l", 0, y, x, Math.min(h, bottom - y));
  set("r", x + w, y, innerWidth - x - w, Math.min(h, bottom - y));
  Object.assign($("tourring").style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });

  if (e.key === "Escape") {

  if (e.key === "F5") { e.preventDefault(); if (lastQ) runFind(lastQ, false); return; }

  $("again").onclick = () => { if (simSrc) runSimilar(simSrc.path, false); else if (lastQ) runFind(lastQ, false); };
  $("back").onclick = () => goHist(-1);
  $("fwd").onclick = () => goHist(1);
  $("up").onclick = goUp;
  $("group").onchange = () => { render(); saveUi(); };
  // 모두 찾기 체크 — 바꾸면 이 PC 에 기억하고 지금 검색어로 다시 찾는다
  $("findall").onchange = () => setFindAllOn($("findall").checked);  // 정렬 상자로 기준을 바꾸면 그 기준의 기본 방향으로
  $("sort").onchange = () => { sortAsc = SORT_ASC_DEF[$("sort").value]; render(); saveUi(); };
  $("pvtoggle").onclick = togglePv;
  // 미리 보기에 지금 보이는 것(목록 줄 · AI 답변창 번호)을 연다
  $("pvopen").onclick = () => { if (pvTarget) send({ type: "open_page", path: pvTarget.path, page: pvTarget.page }); };
  $("pvreveal").onclick = () => { if (pvTarget) send({ type: "reveal", path: pvTarget.path }); };
  // ✕ — 명령줄의 [미리 보기 창] 버튼을 끈 것과 같다
  $("pvx").onclick = () => { if (pvShown) togglePv(); };
  applyLayout();
  bindSplits();
  new ResizeObserver(sendRect).observe($("pvframe"));
  window.addEventListener("resize", () => { applyLayout(); sendRect(); });
  $("list").innerHTML = `<div class="msg">${welcome()}</div>`;
  // 지난 화면 상태 되살리기 — 처음 실행이면 미리 보기 창 · AI 답변창 모두 켠다
  if ([...$("group").options].some((o) => o.value === UI_SAVED.group)) $("group").value = UI_SAVED.group;
  if ([...$("sort").options].some((o) => o.value === UI_SAVED.sort)) {
    $("sort").value = UI_SAVED.sort;
    sortAsc = typeof UI_SAVED.asc === "boolean" ? UI_SAVED.asc : SORT_ASC_DEF[UI_SAVED.sort];
  }
  if (typeof UI_SAVED.scope === "string" && UI_SAVED.scope) scopeWant = UI_SAVED.scope;
  if (UI_SAVED.pv === false) togglePv();
  if (UI_SAVED.ai !== false) toggleAi();
  drawNav();
  setTimeout(() => $("q").focus(), 50);
} else {
  document.body.classList.add("panel");
  $("pnl").classList.remove("hidden");
  $("pgo").onclick = () => runFind($("pq").value);
  $("padd").onclick = pickSimilar;
  $("pclr").onclick = resetFind;
  $("pq").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); runFind($("pq").value); }
  });
  $("pask").onclick = toggleAi;
  // 검색 폴더 고르기 — 머리의 📁 단추
  $("pfolder").onclick = (e) => { e.stopPropagation(); const r = $("pfolder").getBoundingClientRect(); showPickMenu(r.left, r.bottom + 4); };
  $("torag").onclick = () => send({ type: "mode", mode: "rag" });
  $("pclose").onclick = () => send({ type: "close" });
  renderCards();
}
send({ type: "ready" });
</script>
</body>
</html>
