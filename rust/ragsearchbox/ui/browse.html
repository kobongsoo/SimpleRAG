<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoAI 탐색기</title>
<!--
  MoAI 탐색기 — 탐색기 모드 화면 (폴더 아이콘 · 탐색기 모드 설계서 §10 · §11)
  - 자연어로 찾으면 답을 짓지 않고 "문서 ▸ 쪽 ▸ 발췌" 를 탐색기 같은 목록으로 보여 준다
  - __LAYOUT__ = window : 독립 창(주소줄 · 검색 상자 · 명령 모음 · 탐색 창 · 자세히 보기 · 미리 보기 창 · 상태 표시줄)
               panel  : 탐색기 옆 좁은 패널(한 단 — 문서 카드 · 쪽 칩 · 발췌)
  - 미리 보기 창의 PDF 는 Rust 가 이 화면 위에 따로 띄운 WebView 가 그린다(#pvframe 자리를 알려 준다).
    PDF 가 아니면 이 화면이 청크 글을 직접 보여 준다(글 미리 보기).
  Rust 와는 window.ipc.postMessage(JSON) / window.rsb.* 함수로 주고받는다.
-->
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --sunken: #f1f2f4; --ink: #16181d; --ink2: #3c4049; --muted: #7a808c; --rule: #e6e8ec;
    --brand: #e5163f; --brand-soft: #fdecef; --sel: #e8eefb; --sel-bar: #2c5aa0; --hover: #f2f4f7; --link: #1f5fbf;
    --mark: #ffe58a; --fs: __FONT_PX__px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Malgun Gothic", "맑은 고딕", "Segoe UI", sans-serif; font-size: var(--fs); -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; flex: none; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .hidden { display: none !important; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d3d6dc; border-radius: 10px; border: 3px solid var(--surface); }

  /* ── 주소줄 ── */
  .addr { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--rule); }
  .brand { display: flex; align-items: center; gap: 6px; flex: none; }
  .brand img { width: 22px; height: 22px; object-fit: contain; }
  .brand b { font-size: calc(var(--fs) * 1.0); }
  .brand b span { color: var(--brand); }
  .navbtn { width: 28px; height: 28px; border-radius: 6px; color: var(--muted); display: grid; place-items: center; }
  .navbtn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .navbtn:disabled { opacity: .35; cursor: default; }
  .crumb { flex: 0 1 34%; min-width: 120px; display: flex; align-items: center; gap: 2px; border: 1px solid var(--rule); border-radius: 6px;
    padding: 4px 8px; white-space: nowrap; overflow: hidden; color: var(--ink2); }
  .crumb button { padding: 1px 4px; border-radius: 4px; white-space: nowrap; }
  .crumb button:hover { background: var(--hover); }
  .crumb .sep { color: var(--muted); }
  .search { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px; border: 2px solid var(--brand); border-radius: 8px;
    padding: 3px 6px 3px 10px; background: var(--surface); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-weight: bold; color: var(--ink); background: none; padding: 3px 0; }
  /* 예시 문구(placeholder)는 입력한 글과 구분되게 회색 · 보통 굵기로 */
  .search input::placeholder { color: var(--muted); font-weight: normal; opacity: 1; }
  .search .hint { color: var(--muted); font-size: calc(var(--fs) * .82); white-space: nowrap; }
  .search .go { background: var(--brand); color: #fff; border-radius: 6px; padding: 3px 10px; font-weight: bold; }

  /* ── 명령 모음 ── */
  .cmd { display: flex; align-items: center; gap: 4px; padding: 5px 10px; background: var(--surface); border-bottom: 1px solid var(--rule); color: var(--ink2); }
  .cmd .b { padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
  .cmd .b:hover { background: var(--hover); }
  .cmd .b.on { background: var(--sunken); }
  .cmd select { font: inherit; color: var(--ink2); border: 1px solid var(--rule); border-radius: 6px; padding: 2px 4px; background: var(--surface); }
  .cmd .sp { flex: 1; }
  .cmd .ai { border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; white-space: nowrap; }
  .cmd .ai:hover { border-color: var(--brand); color: var(--brand); }

  /* ── 본문: 탐색 창 | 목록 | 미리 보기 ── */
  /* 창 나눔 — 탐색 창 · 미리 보기 창 너비는 사이 막대(.split)를 끌어 바꾼다(--side · --pv, 이 PC 에 기억) */
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--side, 200px) 5px minmax(0, 1fr) 5px var(--pv, 36%); }
  .main.nopv { grid-template-columns: var(--side, 200px) 5px minmax(0, 1fr); }
  .main.nopv .pv, .main.nopv #split2 { display: none; }
  .split { cursor: col-resize; background: var(--surface); position: relative; z-index: 3; }
  .split::after { content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--rule); }
  .split:hover::after, .split.drag::after { left: 1px; width: 3px; background: var(--sel-bar); }
  body.dragging, body.dragging * { cursor: col-resize !important; user-select: none !important; }
  .side { border-right: 1px solid var(--rule); background: var(--surface); overflow-y: auto; overflow-x: hidden; padding: 6px 4px 0; color: var(--ink2);
    display: flex; flex-direction: column; }
  /* 탐색 창 아래 — 인덱싱 폴더 추가 · 빼기(목록이 짧아도 맨 아래에 붙는다) */
  .side .fbar { margin-top: auto; position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--rule);
    display: flex; gap: 4px; padding: 6px 2px 8px; }
  .side .fbar button { flex: 1; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 0; font-size: calc(var(--fs) * .85); white-space: nowrap; }
  .side .fbar button:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
  .side .fbar button:disabled { opacity: .4; cursor: default; }
  .side .h { font-size: calc(var(--fs) * .8); color: var(--muted); padding: 10px 8px 3px; }
  .side .i { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden;
    cursor: pointer; width: 100%; text-align: left; }
  .side .i:hover { background: var(--hover); }
  .side .i.on { background: var(--sel); color: var(--ink); }
  .side .i .tw { width: 14px; color: var(--muted); flex: none; text-align: center; font-size: 10px; }
  .side .i span.n { overflow: hidden; text-overflow: ellipsis; }
  .side .i .cnt { color: var(--muted); font-size: calc(var(--fs) * .82); flex: none; margin-left: -2px; }
  .side .empty { color: var(--muted); padding: 3px 10px; font-size: calc(var(--fs) * .85); }

  .list { overflow: auto; background: var(--surface); position: relative; }
  /* 목록 열 — 이름·위치·내용 열은 남는 너비를 채우고, 쪽 · 관련도 · 수정한 날짜 열은 머리글 경계(.cg)를 끌어 바꾼다 */
  .cols, .r { display: grid; grid-template-columns: minmax(0, 1fr) var(--c-page, 64px) var(--c-rel, 70px) var(--c-date, 92px);
    gap: 8px; align-items: center; padding: 0 12px; }
  .r > span { min-width: 0; overflow: hidden; }
  .cols { position: sticky; top: 0; z-index: 2; background: var(--surface); color: var(--muted); font-size: calc(var(--fs) * .82);
    padding-top: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
  .cols > span { position: relative; white-space: nowrap; overflow: visible; }
  .cg { position: absolute; top: -6px; bottom: -6px; left: -9px; width: 9px; cursor: col-resize; }
  .cg::after { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: 1px; background: var(--rule); }
  .cg:hover::after, .cg.drag::after { background: var(--sel-bar); width: 2px; }
  /* 정렬 머리글 — 글자가 아니라 칸 전체를 누른다(머리글 줄 위아래 여백까지 칸으로) */
  .cols > .hc { cursor: pointer; align-self: stretch; display: flex; align-items: center; margin: -6px 0; padding: 6px 0; }
  .cols > .hc:hover { background: var(--hover); color: var(--ink); }
  .cols > .hc.on { color: var(--ink); font-weight: bold; }
  .grp { color: var(--muted); font-size: calc(var(--fs) * .82); padding: 10px 12px 3px; }
  .r { padding-top: 4px; padding-bottom: 4px; cursor: default; user-select: none; }
  .r:hover { background: var(--hover); }
  .r.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--sel-bar); }
  .r.low { opacity: .5; }
  .r.doc .n { display: flex; align-items: center; gap: 6px; font-weight: bold; min-width: 0; }
  .r.doc .n .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r.doc .tw { width: 12px; color: var(--muted); flex: none; font-size: 10px; text-align: center; }
  .r.doc .cnt { font-weight: normal; color: var(--muted); font-size: calc(var(--fs) * .85); white-space: nowrap; }
  .r.pg { padding-left: 42px; }
  .r.pg .n { min-width: 0; }
  .r .sec { color: var(--ink2); font-size: calc(var(--fs) * .85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .snip { color: var(--muted); font-size: calc(var(--fs) * .85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .dn { color: var(--ink2); font-size: calc(var(--fs) * .8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .date { color: var(--muted); font-size: calc(var(--fs) * .85); white-space: nowrap; }
  .pgchip { display: inline-block; border: 1px solid var(--rule); border-radius: 5px; padding: 0 6px; font-family: Consolas, monospace;
    font-size: calc(var(--fs) * .82); background: var(--surface); white-space: nowrap; }
  .pgchip.approx { border-style: dashed; }
  .rel { display: inline-flex; gap: 2px; }
  .rel i { width: 8px; height: 8px; border-radius: 2px; background: var(--rule); }
  .rel i.f { background: var(--brand); }
  .more { padding: 2px 12px 6px 42px; }
  .more button { color: var(--link); font-size: calc(var(--fs) * .85); }
  .msg { color: var(--muted); padding: 40px 20px; text-align: center; line-height: 1.7; }
  .msg b { color: var(--ink); }
  .msg img { width: 72px; height: 72px; object-fit: contain; background: #fff; border-radius: 20px; padding: 6px;
    box-shadow: 0 6px 18px rgba(20,24,33,.10), 0 0 0 1px var(--rule); margin-bottom: 10px; }

  /* AI 답 카드 */
  .ai-card { margin: 10px 12px; border: 1px solid var(--rule); border-left: 3px solid var(--brand); border-radius: 8px; padding: 8px 12px; background: var(--surface); }
  .ai-card .hd { display: flex; gap: 8px; align-items: center; font-weight: bold; }
  .ai-card .hd .x { margin-left: auto; color: var(--muted); }
  .ai-card .body { white-space: pre-wrap; line-height: 1.6; margin-top: 4px; }
  .ai-card .ft { color: var(--muted); font-size: calc(var(--fs) * .8); margin-top: 4px; }

  /* 미리 보기 창 */
  .pv { border-left: 1px solid var(--rule); background: var(--sunken); display: flex; flex-direction: column; min-width: 0; }
  .pv .ph { display: flex; gap: 8px; align-items: center; padding: 8px 10px 6px; color: var(--ink2); font-size: calc(var(--fs) * .85); }
  .pv .ph .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }
  #pvframe { flex: 1; margin: 0 10px; background: var(--surface); border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.12); overflow: auto; min-height: 0; }
  #pvtext { padding: 12px 14px; white-space: pre-wrap; line-height: 1.7; font-size: calc(var(--fs) * .92); }
  #pvtext .sec { font-weight: bold; margin-bottom: 6px; color: var(--ink2); }
  #pvtext .note { color: var(--muted); font-size: calc(var(--fs) * .8); margin-top: 10px; }
  .pv .empty { color: var(--muted); padding: 30px 14px; text-align: center; }
  .pv .acts { display: flex; gap: 6px; padding: 8px 10px 10px; }
  .pv .acts button { flex: 1; border: 1px solid var(--rule); border-radius: 6px; padding: 5px 0; background: var(--surface); color: var(--ink2); }
  .pv .acts button.p { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: bold; }
  .pv .acts button:disabled { opacity: .45; cursor: default; }

  /* 상태 표시줄 */
  .st { display: flex; gap: 14px; padding: 4px 12px; border-top: 1px solid var(--rule); background: var(--surface); color: var(--muted);
    font-size: calc(var(--fs) * .82); white-space: nowrap; overflow: hidden; }
  .st .sp { flex: 1; }
  .st .err { color: #b4462f; }

  /* 오른쪽 클릭 메뉴 */
  #menu { position: fixed; z-index: 30; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 4px;
    box-shadow: 0 8px 24px rgba(20,24,33,.14); min-width: 170px; }
  #menu button { display: block; width: 100%; text-align: left; padding: 5px 10px; border-radius: 5px; }
  #menu button:hover { background: var(--hover); }

  /* ── 조건 칩 (메타데이터 검색 설계서 §14) — 실선 = 필터, 점선 = 가산, 흐린 줄 = 끈 조건 ── */
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 5px 10px; background: var(--surface);
    border-bottom: 1px solid var(--rule); font-size: calc(var(--fs) * .85); }
  .chips .lbl { color: var(--muted); margin-right: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--brand); color: var(--ink); border-radius: 999px;
    padding: 1px 4px 1px 9px; background: var(--surface); white-space: nowrap; }
  .chip.soft { border-style: dashed; border-color: var(--muted); color: var(--ink2); }
  .chip.off { border-color: var(--rule); color: var(--muted); }
  .chip.off .lb { text-decoration: line-through; }
  .chip button { border-radius: 999px; min-width: 18px; height: 18px; line-height: 18px; color: var(--muted); font-size: 11px; }
  .chip button:hover { background: var(--hover); color: var(--ink); }
  .chip button.w { padding: 0 6px; font-size: calc(var(--fs) * .78); border: 1px solid var(--rule); }
  .chips .note { color: var(--muted); }
  .chips .relax { color: #b26a00; }
  .who { font-weight: normal; color: var(--muted); font-size: calc(var(--fs) * .82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 0 3 auto; min-width: 0; max-width: 30%; }

  /* ── 좁은 패널 배치 ── */
  body.panel .addr { flex-wrap: wrap; }
  body.panel .phead { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--rule); }
  body.panel .phead .f { flex: 1; min-width: 0; color: var(--muted); font-size: calc(var(--fs) * .82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.panel .psearch { padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--rule); }
  body.panel .cards { flex: 1; overflow-y: auto; background: var(--surface); }
  .card { border-bottom: 1px solid var(--rule); padding: 8px 12px; }
  .card.low { opacity: .55; }
  .card .t { font-weight: bold; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .card .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .m { color: var(--muted); font-size: calc(var(--fs) * .82); margin-top: 1px; }
  .card .pgs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .card .pgs button { border: 1px solid var(--rule); border-radius: 5px; padding: 0 7px; font-family: Consolas, monospace; font-size: calc(var(--fs) * .82); }
  .card .pgs button.on { border-color: var(--brand); color: var(--brand); }
  .card .sn { background: var(--sunken); border-radius: 6px; padding: 6px 8px; margin-top: 6px; font-size: calc(var(--fs) * .85); color: var(--ink2); line-height: 1.55; }
  .card .sn b { display: block; color: var(--ink); margin-bottom: 2px; }
  .card .sn .acts { display: flex; gap: 10px; margin-top: 5px; }
  .card .sn .acts button { color: var(--link); font-size: calc(var(--fs) * .82); }
  .ibtn { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--ink2); flex: none; }
  .ibtn:hover { background: var(--hover); color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; flex: none; font-size: calc(var(--fs) * .82); }
  .seg button { padding: 2px 8px; }
  .seg button.on { background: var(--brand); color: #fff; font-weight: bold; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-fold" viewBox="0 0 16 16">
      <path d="M1 3.5a1 1 0 0 1 1-1h4l1.5 1.5H14a1 1 0 0 1 1 1V13a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1z" fill="#E3A231"/>
      <rect x="1" y="5.5" width="14" height="8.5" rx="1" fill="#FFC93F"/>
    </symbol>
    <symbol id="i-moai" viewBox="0 0 16 16">
      <path d="M1 3.5a1 1 0 0 1 1-1h4l1.5 1.5H14a1 1 0 0 1 1 1V13a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1z" fill="#E3A231"/>
      <rect x="1" y="5.5" width="14" height="8.5" rx="1" fill="#FFC93F"/>
      <rect x="6.5" y="6" width="9.5" height="9.5" rx="2" fill="#fff"/>
      <rect x="7.3" y="6.8" width="8" height="8" rx="1.5" fill="#e5163f"/>
      <path d="M9 13.2V8.6l2.3 2.6 2.3-2.6v4.6" fill="none" stroke="#fff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-drive" viewBox="0 0 16 16">
      <rect x="0.5" y="4" width="15" height="7.5" rx="1.5" fill="#B9C0CA"/>
      <rect x="0.5" y="4" width="15" height="3.5" rx="1.5" fill="#D5DAE1"/>
      <rect x="6.5" y="6" width="9.5" height="9.5" rx="2" fill="#fff"/>
      <rect x="7.3" y="6.8" width="8" height="8" rx="1.5" fill="#e5163f"/>
      <path d="M9 13.2V8.6l2.3 2.6 2.3-2.6v4.6" fill="none" stroke="#fff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-pdf" viewBox="0 0 16 16">
      <path d="M3 1.5h6.5L13 5v9.5H3z" fill="#fff" stroke="#c9ced6"/>
      <path d="M9.5 1.5V5H13" fill="none" stroke="#c9ced6"/>
      <rect x="2" y="8" width="9" height="5" rx="1" fill="#d93025"/>
      <text x="6.5" y="12" font-size="4" font-family="Arial" font-weight="bold" fill="#fff" text-anchor="middle">PDF</text>
    </symbol>
    <symbol id="i-doc" viewBox="0 0 16 16">
      <path d="M3 1.5h6.5L13 5v9.5H3z" fill="#fff" stroke="#c9ced6"/>
      <path d="M9.5 1.5V5H13" fill="none" stroke="#c9ced6"/>
      <path d="M5 8h6M5 10h6M5 12h4" stroke="#8d96a3"/>
    </symbol>
    <!-- 확장자별 아이콘 — 종이 모양 + 앱 색 딱지(글자 하나) -->
    <symbol id="i-word" viewBox="0 0 16 16">
      <path d="M3 1.5h6.5L13 5v9.5H3z" fill="#fff" stroke="#c9ced6"/><path d="M9.5 1.5V5H13" fill="none" stroke="#c9ced6"/>
      <rect x="1" y="7" width="9" height="7" rx="1.2" fill="#2b579a"/>
      <text x="5.5" y="12.6" font-size="5.6" font-family="Arial" font-weight="bold" fill="#fff" text-anchor="middle">W</text>
    </symbol>
    <symbol id="i-excel" viewBox="0 0 16 16">
      <path d="M3 1.5h6.5L13 5v9.5H3z" fill="#fff" stroke="#c9ced6"/><path d="M9.5 1.5V5H13" fill="none" stroke="#c9ced6"/>
      <rect x="1" y="7" width="9" height="7" rx="1.2" fill="#217346"/>
      <text x="5.5" y="12.6" font-size="5.6" font-family="Arial" font-weight="bold" fill="#fff" text-anchor="middle">X</text>

<script>
"use strict";
const LAYOUT = "__LAYOUT__";
const $ = (id) => document.getElementById(id);
const send = (o) => window.ipc.postMessage(JSON.stringify(o));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const base = (p) => String(p || "").replace(/[\\/]+$/, "").split(/[\\/]/).pop() || p;
const isPdf = (p) => /\.pdf$/i.test(p || "");

// ── 상태 ─────────────────────────────────────────────────
let roots = [];          // 인덱싱 폴더 [{path, name, drive}]
let scope = null;        // 찾는 범위 폴더(null = 인덱싱 폴더 전체)
let lastQ = "";          // 마지막으로 찾은 검색어
let docs = [];           // 결과 문서 [{meta, pages:[…]}]
let done = null;         // @find_done
let rows = [];           // 지금 화면의 고를 수 있는 줄 [{kind, doc, page}]
let selIdx = -1;
let openDocs = new Set();  // 펼친 문서 경로
let moreDocs = new Set();  // "더 보기" 누른 문서
let dirs = {};           // 폴더 → 하위 폴더 이름(탐색 창, 펼친 것만)
let openDirs = new Set();
let hist = [], histPos = -1;   // 뒤로 · 앞으로 (검색어 · 범위)
let pageClick = "preview";
let pendingSelect = null;      // 크게 보기로 넘어온 쪽(결과가 오면 고른다)
let pvShown = true;
let ai = null;                 // AI 답 카드 {q, text, ev, info, err}
let busy = false;
// 조건 칩 상태 — 같은 검색어 안에서만 유지(새 검색어면 지운다)
//   off = 끈 조건 종류 · widen = 기간을 넓힌 햇수 · labels = 끈 칩을 다시 보이려고 기억한 글
let cond = { q: "", off: [], widen: 0, labels: {} };
const CHIP_ICON = { person: "👤", date: "📅", format: "📄", recv: "📨", scanned: "🖨", type: "🗂", form: "🧾" };

// 최근 검색 — 이 PC 의 이 화면에만 남긴다(지워져도 동작에는 영향 없음)
//   HTML 글로 띄운 화면은 localStorage 가 막혀 있을 수 있어(실측) 메모리 목록을 함께 둔다
let recentMem = [];
function recent() {
  try { const v = JSON.parse(localStorage.getItem("moai.recent") || "null"); if (Array.isArray(v)) return v; } catch (e) { /* 막힘 */ }
  return recentMem;
}
function remember(q) {
  recentMem = [q].concat(recent().filter((x) => x !== q)).slice(0, 8);
  try { localStorage.setItem("moai.recent", JSON.stringify(recentMem)); } catch (e) { /* 저장 못 해도 그만 */ }
}

// ── 찾기 ─────────────────────────────────────────────────
function runFind(q, push) {
  q = (q || "").trim();
  if (!q || busy) return;
  // 다른 검색어면 조건 칩에서 고친 것을 버린다
  if (q !== cond.q) cond = { q, off: [], widen: 0, labels: {} };
  lastQ = q;
  busy = true;
  if (LAYOUT === "window") { $("q").value = q; } else { $("pq").value = q; }
  if (push !== false) {
    hist = hist.slice(0, histPos + 1);
    hist.push({ q, scope });
    histPos = hist.length - 1;
  }
  remember(q);
  setStatus("찾는 중…");
  send({ type: "find", q, folder: scope, off: cond.off, widen: cond.widen });
  drawNav();
}

// Rust 가 /find 결과를 넘긴다
function onResults(r) {
  busy = false;
  if (!r || r.q !== lastQ) { /* 지난 검색의 늦은 결과는 버린다 */ if (r && r.q) return; }
  if (!r.ok) {
    docs = []; done = null;
    drawChips();
    showMessage("<b>찾지 못했습니다</b><br>" + esc((r.done && r.done.error) || r.why || "워커가 응답하지 않았습니다"));
    setStatus((r.done && r.done.error) || r.why || "찾지 못함", true);
    return;
  }
  docs = [];
  const byNo = {};
  for (const l of r.lines) {
    if (l.page === undefined) {
      const d = { meta: l, pages: [] };
      byNo[l.doc] = d;
      docs.push(d);
    } else if (byNo[l.doc]) {
      byNo[l.doc].pages.push(l);
    }
  }
  done = r.done || {};
  drawChips();
  openDocs = new Set();
  moreDocs = new Set();
  const first = docs.find((d) => d.pages.length);
  if (first) openDocs.add(first.meta.doc_path);
  selIdx = -1;
  render();
  // 크게 보기로 넘어온 쪽이 있으면 그 줄을, 아니면 첫 쪽 줄을 고른다
  let target = -1;
  if (pendingSelect) {
    target = rows.findIndex((x) => x.kind === "page" && x.doc.meta.doc_path === pendingSelect.path && x.page.page === pendingSelect.page);
    pendingSelect = null;
  }
  if (target < 0) target = rows.findIndex((x) => x.kind === "page");
  if (target >= 0) select(target, true);
  status();
}

function status() {
  if (!done) return;
  const places = docs.reduce((n, d) => n + d.pages.length, 0);
  const sec = done.ms != null ? (done.ms / 1000).toFixed(2) + "초" : "";
  const sc = scope ? base(scope) : "인덱싱 폴더 전체";
  const sd = done.scope_docs != null ? `(문서 ${done.scope_docs}개)` : "";
  if (LAYOUT === "window") {
    $("st1").textContent = `문서 ${docs.length}개 · 위치 ${places}곳`;
    $("st1").classList.remove("err");
    $("st2").textContent = sec ? "검색 " + sec : "";
    $("st3").textContent = `범위: ${sc}${sd}`;
    $("st4").textContent = done.synonyms ? "검색어 넓힘: " + done.synonyms.join(", ") : "";
  } else {
    $("pst1").textContent = `문서 ${docs.length}개 · 위치 ${places}곳 · ${sec}`;
  }
}

// ── 조건 칩 ─────────────────────────────────────────────
//   ✕ = 그 조건 끄고 다시 찾기 · ↺ = 다시 켜기 · ±1년 = 기간 넓히기(연도가 파일 날짜가 아니라 내용일 때)
function drawChips() {
  const box = LAYOUT === "window" ? $("chips") : $("pchips");
  const m = done && done.meta;
  if (!m && !cond.off.length) { box.classList.add("hidden"); box.innerHTML = ""; return; }
  let h = `<span class="lbl">조건</span>`;
  const seen = {};
  for (const c of (m ? m.chips : [])) {
    // 같은 종류 칩이 여럿(사람 둘)이면 끈 칩 글은 이어 붙여 기억한다
    cond.labels[c.kind] = seen[c.kind] ? cond.labels[c.kind] + " · " + c.label : c.label;
    seen[c.kind] = true;
    const tip = c.mode === "filter" ? "이 조건에 맞는 문서만 찾습니다" : "이 조건에 맞는 문서를 위로 올립니다";
    const wide = c.kind === "date" && cond.widen < 3 ? `<button class="w" data-widen="1" title="기간을 앞뒤 1년 더 넓혀 다시 찾기">±1년</button>` : "";
    h += `<span class="chip ${c.mode === "filter" ? "" : "soft"}" title="${tip}"><span class="lb">${CHIP_ICON[c.kind] || ""} ${esc(c.label)}</span>${wide}<button data-off="${esc(c.kind)}" title="이 조건을 끄고 다시 찾기">✕</button></span>`;
  }
  for (const k of cond.off) {
    h += `<span class="chip off" title="끈 조건 — ↺ 로 다시 켭니다"><span class="lb">${CHIP_ICON[k] || ""} ${esc(cond.labels[k] || k)}</span><button data-on="${esc(k)}" title="다시 켜기">↺</button></span>`;
  }
  if (m && m.docs != null) h += `<span class="note">· 문서 ${m.docs}개에서</span>`;
  if (m && m.relaxed && m.relaxed.length) h += `<span class="relax">· 맞는 문서가 없어 조건을 풀어 찾음: ${esc(m.relaxed.join(", "))}</span>`;
  box.innerHTML = h;
  box.classList.remove("hidden");
  const again = () => { if (lastQ) runFind(lastQ, false); };
  box.querySelectorAll("[data-off]").forEach((b) => { b.onclick = () => { cond.off.push(b.dataset.off); again(); }; });
  box.querySelectorAll("[data-on]").forEach((b) => { b.onclick = () => { cond.off = cond.off.filter((k) => k !== b.dataset.on); again(); }; });
  box.querySelectorAll("[data-widen]").forEach((b) => { b.onclick = () => { cond.widen += 1; again(); }; });
}
// 문서 줄 관련인 — "👤 고봉수 · 조강래" (작성 → 수정 순, 최대 3명)
function whoOf(m) { return m.people && m.people.length ? "👤 " + m.people.join(" · ") : ""; }
// 문서 줄 풍선 도움말 — 경로 + (파일 이름과 다르면) 문서 제목
function tipOf(m) { return m.doc_path + (m.title && !m.doc_name.includes(m.title) ? "\n제목: " + m.title : ""); }

function setStatus(t, err) {
  const el = LAYOUT === "window" ? $("st1") : $("pst1");
  el.textContent = t;
  el.classList.toggle("err", !!err);
  if (LAYOUT === "window") { $("st2").textContent = ""; }
}

// ── 그리기 공통 ──────────────────────────────────────────
function marked(text, marks) {
  const ch = Array.from(text || "");
  if (!marks || !marks.length) return esc(text);
  let out = "", at = 0;
  for (const [a, b] of marks) {
    if (a < at) continue;
    out += esc(ch.slice(at, a).join("")) + "<mark>" + esc(ch.slice(a, b).join("")) + "</mark>";
    at = b;
  }
  return out + esc(ch.slice(at).join(""));
}
function bars(score, low) {
  // 리랭커 점수 숫자는 뜻이 없으므로 1등 문서 기준 5칸 막대로(점수 2 차이마다 한 칸)
  const top = docs.reduce((m, d) => (d.meta.score != null && d.meta.score > m ? d.meta.score : m), -1e9);
  let n = score == null ? 1 : Math.max(1, Math.min(5, Math.round(5 - (top - score) / 2)));
  if (low) n = 1;
  let h = '<span class="rel">';
  for (let i = 0; i < 5; i++) h += `<i class="${i < n ? "f" : ""}"></i>`;
  return h + "</span>";
}
function pageLabel(p) {
  if (p.page == null) return "";
  const to = p.page_to != null && p.page_to > p.page && !p.exact ? "–" + p.page_to : "";
  return `<span class="pgchip ${p.exact ? "" : "approx"}" title="${p.exact ? "" : "근사 쪽"}">p.${p.page}${to}</span>`;
}
function dateOf(m) {
  if (!m.mtime) return "";
  const d = new Date(m.mtime * 1000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
// 문서 아이콘 — 확장자별(PDF · Word · Excel · PowerPoint · 한글 · 웹 · 파이썬 · 마크다운, 그 밖은 일반 문서)
const EXT_ICON = { pdf: "i-pdf", doc: "i-word", docx: "i-word", xls: "i-excel", xlsx: "i-excel", ppt: "i-ppt", pptx: "i-ppt",
  hwp: "i-hwp", hwpx: "i-hwp", html: "i-web", htm: "i-web", py: "i-code", ipynb: "i-code", md: "i-md" };
function docIcon(path) {
  const ext = (String(path || "").match(/\.([a-z0-9]+)$/i) || [])[1] || "";
  return `<svg width="16" height="16"><use href="#${EXT_ICON[ext.toLowerCase()] || "i-doc"}"/></svg>`;
}
// 정렬 — 기준(sort 상자 · 열 머리글)과 방향(asc). 기준을 바꾸면 그 기준의 기본 방향으로
//   이름은 가나다(오름), 관련도 · 수정한 날짜는 높은 것 · 최근 것(내림)이 먼저
const SORT_ASC_DEF = { name: true, score: false, date: false };
let sortAsc = false;
function sortKey() { return LAYOUT === "window" ? $("sort").value : "score"; }
// 파일 이름 비교 — Windows 탐색기와 같은 순서: 기호 → 숫자 → 영문 → 한글, 숫자는 값으로(2 < 10), 대소문자 무시
//   ko 비교만 쓰면 한글이 영문보다 앞에 와서 탐색기와 순서가 달랐다
const NAME_COLL = new Intl.Collator("ko", { numeric: true, sensitivity: "base" });
function nameClass(ch) {
  if (ch == null) return -1;
  if (/[0-9]/.test(ch)) return 1;
  if (/[a-z]/i.test(ch)) return 2;
  if (/[가-힣ㄱ-ㆎ]/.test(ch)) return 3;
  return 0;
}
function fileNameCmp(a, b) {
  // 처음 다른 글자의 종류가 다르면 종류 순으로, 같으면 Collator(숫자 덩어리는 값으로)
  let i = 0;
  while (i < a.length && i < b.length && a[i].toLowerCase() === b[i].toLowerCase()) i++;
  const ca = nameClass(a[i]), cb = nameClass(b[i]);
  if (ca !== cb && ca >= 0 && cb >= 0) return ca - cb;
  return NAME_COLL.compare(a, b);
}
// 두 값 비교 — 값이 없는 것(점수 · 날짜 모름)은 방향과 상관없이 맨 뒤
function cmpBy(a, b, asc) {
  if (a == null && b == null) return 0;
  if (a == null) return 1;
  if (b == null) return -1;
  const c = typeof a === "string" ? fileNameCmp(a, b) : a - b;
  return asc ? c : -c;
}
function sortedDocs(list) {
  const s = sortKey(), v = list.slice();
  // 같은 값이면 원래(관련도) 순서를 지킨다 — Array.sort 는 안정 정렬
  const val = (d) => s === "name" ? d.meta.doc_name : s === "date" ? d.meta.mtime || null : d.meta.score;
  if (s !== "score" || sortAsc) v.sort((a, b) => cmpBy(val(a), val(b), sortAsc));
  return v;
}
// 한 문서 안 쪽 줄 — 관련도로 정렬할 때만 방향을 따른다(그 밖에는 관련도 높은 쪽부터)
function sortedPages(d) {
  return sortKey() === "score" && sortAsc ? d.pages.slice().sort((a, b) => cmpBy(a.score, b.score, true)) : d.pages;
}
// 열 머리글 누르기 — 같은 열이면 방향만 뒤집고, 다른 열이면 그 열의 기본 방향으로
function sortBy(k) {
  if ($("sort").value === k) sortAsc = !sortAsc;
  else { $("sort").value = k; sortAsc = SORT_ASC_DEF[k]; }
  render();
}
function showMessage(html) {
  const box = LAYOUT === "window" ? $("list") : $("cards");
  box.innerHTML = aiCard() + `<div class="msg">${html}</div>`;
  rows = [];
  bindAi();
}

// ── 그리기: 독립 창 목록 ─────────────────────────────────
function render() {
  if (LAYOUT !== "window") return renderCards();
  rows = [];
  const L = $("list");
  if (!docs.length) {
    showMessage(lastQ ? `<b>"${esc(lastQ)}"</b> 와 맞는 문서를 찾지 못했습니다.<br>다른 말로 바꾸거나 범위를 넓혀 보세요.` : welcome());
    return;
  }
  // 머리글 경계(.cg)를 끌면 오른쪽 열 너비가 바뀐다 — 이름 · 위치 · 내용 열은 남는 너비를 채운다
  const cg = (k) => `<i class="cg" data-col="${k}" title="끌어서 열 너비 바꾸기 (두 번 누르면 처음대로)"></i>`;
  // 이름 · 관련도 · 수정한 날짜 머리글은 눌러 정렬(▲ 오름 · ▼ 내림)
  const sk = sortKey();
  // 정렬 칸 — 칸(span) 전체에 data-sort 를 건다. 경계 손잡이(.cg)는 누름을 칸으로 넘기지 않는다
  const hc = (k, label, grip) => `<span class="hc ${sk === k ? "on" : ""}" data-sort="${k}" title="눌러서 ${label} 순으로 정렬 (다시 누르면 반대로)">${grip || ""}${label}${sk === k ? (sortAsc ? " ▲" : " ▼") : ""}</span>`;
  let h = aiCard() + `<div class="cols">${hc("name", "이름 · 위치 · 내용")}<span>${cg("page")}쪽</span>${hc("score", "관련도", cg("rel"))}${hc("date", "수정한 날짜", cg("date"))}</div>`;
  const byName = docs.filter((d) => d.meta.name_hit);
  const content = docs.filter((d) => d.pages.length);
  // 조건만 있는 질의(본문 검색어 없음) — 조건에 맞는 문서 줄만 온다
  const byMeta = docs.filter((d) => d.meta.meta_hit && !d.pages.length && !d.meta.name_hit);
  const places = content.reduce((n, d) => n + d.pages.length, 0);
  if ($("group").value === "page") {
    // 쪽 목록 — 모든 쪽 줄을 관련도 순으로 한 줄씩(문서 이름을 함께)
    const all = [];
    for (const d of content) for (const p of d.pages) all.push({ d, p });
    // 정렬 기준을 따른다 — 관련도는 쪽 점수, 이름 · 날짜는 그 쪽의 문서(같으면 쪽 점수 높은 것부터)
    const pv = ({ d, p }) => sk === "name" ? d.meta.doc_name : sk === "date" ? d.meta.mtime || null : p.score;
    all.sort((a, b) => cmpBy(pv(a), pv(b), sortAsc) || cmpBy(a.p.score, b.p.score, false));
    h += `<div class="grp">내용 일치 — 위치 ${all.length}곳</div>`;
    for (const { d, p } of all) h += pageRow(d, p, true);
  } else {
    if (byMeta.length) {
      h += `<div class="grp">조건 일치 (${byMeta.length})</div>`;
      for (const d of sortedDocs(byMeta)) h += docRow(d, true, "조건 일치");
    }
    if (byName.length) {
      h += `<div class="grp">파일 이름 일치 (${byName.length})</div>`;
      for (const d of sortedDocs(byName)) h += docRow(d, true);
    }
    if (content.length) {
      h += `<div class="grp">내용 일치 — 문서 ${content.length}개 · 위치 ${places}곳</div>`;
      for (const d of sortedDocs(content)) {
        h += docRow(d, false);
        if (!openDocs.has(d.meta.doc_path)) continue;
        const pgs = sortedPages(d);
        const show = moreDocs.has(d.meta.doc_path) ? pgs : pgs.slice(0, 3);
        for (const p of show) h += pageRow(d, p, false);
        if (d.pages.length > show.length) {
          h += `<div class="more"><button data-more="${esc(d.meta.doc_path)}">＋ ${d.pages.length - show.length}곳 더 보기</button></div>`;
        }
      }
    }
  }
  L.innerHTML = h;
  bindAi();
  L.querySelectorAll("[data-col]").forEach(bindColGrip);
  L.querySelectorAll("[data-sort]").forEach((el) => { el.onclick = () => sortBy(el.dataset.sort); });
  L.querySelectorAll("[data-row]").forEach((el) => {
    const i = +el.dataset.row;
    el.onclick = () => select(i, true);
    el.ondblclick = () => activate(i);
    el.oncontextmenu = (e) => { e.preventDefault(); select(i, false); showMenu(e.clientX, e.clientY, rows[i]); };
  });
  L.querySelectorAll("[data-tw]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); toggleDoc(rows[+el.dataset.tw].doc); };
  });
  L.querySelectorAll("[data-more]").forEach((el) => {
    el.onclick = () => { moreDocs.add(el.dataset.more); render(); };
  });
  if (selIdx >= 0 && selIdx < rows.length) markSel();
}
function docRow(d, nameGroup, why) {
  const i = rows.push({ kind: "doc", doc: d }) - 1;
  const m = d.meta;
  const open = openDocs.has(m.doc_path);
  const tw = d.pages.length && !nameGroup ? `<span class="tw" data-tw="${i}">${open ? "▾" : "▸"}</span>` : `<span class="tw"></span>`;
  const cnt = why ? `· ${why}` : nameGroup ? `· 이름에 검색어` : m.low ? `· 관련 낮음` : `· ${d.pages.length}곳`;
  const who = whoOf(m);
  return `<div class="r doc ${m.low ? "low" : ""}" data-row="${i}" title="${esc(tipOf(m))}">
    <span class="n">${tw}${docIcon(m.doc_path)}<span class="t">${esc(m.doc_name)}</span><span class="cnt">${cnt}</span>${who ? `<span class="who">${esc(who)}</span>` : ""}</span>
    <span></span><span>${bars(m.score, m.low)}</span><span class="date">${dateOf(m)}</span></div>`;
}
function pageRow(d, p, withDoc) {
  const i = rows.push({ kind: "page", doc: d, page: p }) - 1;
  const sec = p.section ? esc(p.section) : "";
  const more = p.more ? ` <span class="cnt">· 이 쪽 ${p.more + 1}곳</span>` : "";
  return `<div class="r pg ${p.low ? "low" : ""}" data-row="${i}" ${withDoc ? 'style="padding-left:12px"' : ""}>
    <span class="n">${withDoc ? `<div class="dn">${docIcon(d.meta.doc_path)}</div><div class="dn">${esc(d.meta.doc_name)}</div>` : ""}
      ${sec ? `<div class="sec">${sec}${more}</div>` : ""}<div class="snip">${marked(p.snippet, p.marks)}</div></span>
    <span>${pageLabel(p)}</span><span>${bars(p.score, p.low)}</span><span></span></div>`;
}
function welcome() {
  return `<img src="data:image/png;base64,__MOAI__" alt=""><br><b>무엇을 찾을까요?</b><br>
    문장으로 쓰면 그 내용이 있는 <b>문서 · 쪽 · 대목</b>을 찾아 줍니다.<br>쪽을 고르면 오른쪽에 그 쪽이 보이고, 두 번 누르면 그 쪽에서 문서가 열립니다.`;
}
function toggleDoc(d) {
  const k = d.meta.doc_path;
  if (openDocs.has(k)) openDocs.delete(k); else openDocs.add(k);
  const cur = rows[selIdx];
  render();
  if (cur) { const j = rows.findIndex((x) => x.doc === cur.doc && x.page === cur.page); if (j >= 0) select(j, false); }
}

// ── 고르기 · 미리 보기 · 열기 ────────────────────────────
function markSel() {
  const box = LAYOUT === "window" ? $("list") : $("cards");
  box.querySelectorAll(".sel").forEach((e) => e.classList.remove("sel"));
  const el = box.querySelector(`[data-row="${selIdx}"]`);
  if (el) { el.classList.add("sel"); el.scrollIntoView({ block: "nearest" }); }
}
function select(i, preview) {
  if (i < 0 || i >= rows.length) return;
  selIdx = i;
  markSel();
  if (preview) showPreview(rows[i]);
}
// 문서 줄이면 그 문서의 가장 관련 높은 쪽을 쓴다
function pageOf(row) {
  if (!row) return null;
  if (row.kind === "page") return row.page;
  return row.doc.pages[0] || null;
}
function showPreview(row) {
  if (LAYOUT !== "window" || !row) return;
  const d = row.doc, p = pageOf(row);
  $("pvtitle").textContent = d.meta.doc_name;
  $("pvtitle").title = d.meta.doc_path;
  $("pvpage").textContent = p && p.page != null ? `${p.exact ? "" : "약 "}${p.page}쪽` : "";
  $("pvopen").disabled = false;
  $("pvopen").textContent = p && p.page != null ? `${p.page}쪽 열기 ↗` : "열기 ↗";
  $("pvreveal").disabled = false;
  if (!pvShown) return;
  if (isPdf(d.meta.doc_path) && p && p.page != null) {
    // PDF 는 Rust 가 이 자리에 PDF 뷰어를 띄운다
    $("pvempty").classList.add("hidden");
    $("pvtext").classList.add("hidden");
    send({ type: "preview", path: d.meta.doc_path, page: p.page });
    sendRect();
  } else {
    // 글 미리 보기 — 청크 글을 그대로(PDF 아닌 문서 · 쪽 모르는 청크)
    send({ type: "preview_hide" });
    $("pvempty").classList.add("hidden");
    const t = $("pvtext");
    t.classList.remove("hidden");
    t.innerHTML = p ? `${p.section ? `<div class="sec">${esc(p.section)}</div>` : ""}${hl(p.text || p.snippet)}
      <div class="note">글 미리 보기 — 원본 모양(표 서식 · 그림)은 "열기"로 보세요.</div>`
      : `<div class="note">이 문서는 이름만 맞았습니다. "열기"로 보세요.</div>`;
  }
}
// 글 미리 보기 강조 — 검색어 낱말(두 글자 이상)을 표시
function hl(text) {
  const words = lastQ.split(/\s+/).map((w) => w.replace(/[은는이가을를에의로과와도만]$/, "")).filter((w) => w.length >= 2);
  let h = esc(text);
  for (const w of words) h = h.split(esc(w)).join(`<mark>${esc(w)}</mark>`);
  return h;
}
function activate(i) {
  const row = rows[i];
  if (!row) return;
  if (row.kind === "doc" && row.doc.pages.length && !openDocs.has(row.doc.meta.doc_path) && LAYOUT === "window") { toggleDoc(row.doc); }
  openPage(row);
}
function openPage(row) {
  const p = pageOf(row);
  send({ type: "open_page", path: row.doc.meta.doc_path, page: p ? p.page : null });
}
function sendRect() {
  if (LAYOUT !== "window") return;
  const f = $("pvframe");
  const r = f.getBoundingClientRect();
  send({ type: "pv_rect", x: r.left, y: r.top, w: r.width, h: r.height, show: pvShown && !$("main").classList.contains("nopv") });
}

// ── 오른쪽 클릭 메뉴 ─────────────────────────────────────
function showMenu(x, y, row) {
  const p = pageOf(row);
  const items = [
    [p && p.page != null ? `${p.page}쪽 열기` : "열기", () => openPage(row)],
    ["폴더 열기", () => send({ type: "reveal", path: row.doc.meta.doc_path })],
    ["경로 복사", () => copy(row.doc.meta.doc_path)],
    ["이 폴더에서만 찾기", () => { scope = row.doc.meta.doc_path.replace(/[\\/][^\\/]+$/, ""); runFind(lastQ); }],
  ];
  const m = $("menu");
  m.innerHTML = items.map((it, k) => `<button data-k="${k}">${esc(it[0])}</button>`).join("");
  m.querySelectorAll("button").forEach((b) => { b.onclick = () => { hideMenu(); items[+b.dataset.k][1](); }; });
  m.classList.remove("hidden");
  m.style.left = Math.min(x, innerWidth - 190) + "px";
  m.style.top = Math.min(y, innerHeight - 150) + "px";
}
function hideMenu() { $("menu").classList.add("hidden"); }
function copy(t) {
  const a = document.createElement("textarea");
  a.value = t; document.body.appendChild(a); a.select();
  try { document.execCommand("copy"); setStatus("경로를 복사했습니다"); } catch (e) { /* 복사 못 함 */ }
  a.remove();
}
document.addEventListener("click", (e) => { if (!$("menu").contains(e.target)) hideMenu(); });

// ── AI 답 카드 ───────────────────────────────────────────
function askAi() {
  const q = (LAYOUT === "window" ? $("q").value : $("pq").value).trim() || lastQ;
  if (!q) return;
  ai = { q, text: "", ev: null, info: null, err: null };
  send({ type: "ask_ai", q, folder: scope });
  redrawAi();
}
function aiCard() {
  if (!ai) return "";
  const ev = ai.ev != null ? `근거 ${ai.ev}건` : "찾는 중…";
  const body = ai.err ? `<span style="color:#b4462f">${esc(ai.err)}</span>` : esc(ai.text) || (ai.ev != null ? "답을 쓰는 중…" : "");
  const ft = ai.info ? (ai.info.timing_text || "") : "";
  return `<div class="ai-card"><div class="hd">✦ AI 답 — ${esc(ai.q)}<span class="cnt" style="font-weight:normal;color:var(--muted)">· ${ev}</span>
    <button class="x" id="aix" title="닫기">✕</button></div><div class="body">${body}</div>${ft ? `<div class="ft">${esc(ft)}</div>` : ""}
    <div class="ft">AI 요약 — 근거 문서로 확인하세요.</div></div>`;
}
function bindAi() { const x = $("aix"); if (x) x.onclick = () => { ai = null; render(); }; }
function redrawAi() {
  const box = LAYOUT === "window" ? $("list") : $("cards");
  const old = box.querySelector(".ai-card");
  const tmp = document.createElement("div");
  tmp.innerHTML = aiCard();
  if (old && tmp.firstElementChild) old.replaceWith(tmp.firstElementChild);
  else if (old) old.remove();
  else if (tmp.firstElementChild) box.prepend(tmp.firstElementChild);
  bindAi();
}

// ── 탐색 창 · 주소줄 ─────────────────────────────────────
function rootOf(p) {
  if (!p) return null;
  const lp = p.toLowerCase().replace(/[\\/]+$/, "");
  return roots.find((r) => { const lr = r.path.toLowerCase().replace(/[\\/]+$/, ""); return lp === lr || lp.startsWith(lr + "\\"); }) || null;
}
function setScope(p) {
  scope = p;
  drawNav();
  if (lastQ) runFind(lastQ); else drawCrumb();
}
function drawCrumb() {
  if (LAYOUT !== "window") return;
  const c = $("crumb");
  let h = `<button data-p="">MoAI 탐색기</button>`;
  const r = rootOf(scope);
  if (scope && r) {
    h += `<span class="sep">›</span><button data-p="${esc(r.path)}">${esc(r.name)}</button>`;
    const rest = scope.slice(r.path.replace(/[\\/]+$/, "").length).split(/[\\/]/).filter(Boolean);
    let acc = r.path.replace(/[\\/]+$/, "");
    for (const part of rest) { acc += "\\" + part; h += `<span class="sep">›</span><button data-p="${esc(acc)}">${esc(part)}</button>`; }
  } else {
    h += `<span class="sep">›</span><button data-p="">인덱싱 폴더 전체</button>`;
  }
  c.innerHTML = h;
  c.querySelectorAll("button").forEach((b) => { b.onclick = () => setScope(b.dataset.p || null); });
  c.scrollLeft = c.scrollWidth;
  $("back").disabled = histPos <= 0;
  $("fwd").disabled = histPos >= hist.length - 1;
  $("up").disabled = !scope;
}
function drawNav() {
  drawCrumb();
  if (LAYOUT !== "window") return;
  const s = $("side");
  let h = `<div class="h">최근 검색</div>`;
  const rc = recent();
  h += rc.length ? rc.map((q) => `<button class="i" data-q="${esc(q)}"><svg width="14" height="14" style="color:var(--muted)"><use href="#i-clock"/></svg><span class="n">${esc(q)}</span></button>`).join("")
    : `<div class="empty">아직 없습니다</div>`;
  h += `<div class="h">인덱싱 폴더</div>`;
  // 문서 수 — 인덱싱 폴더마다 Rust 가 상태 파일로 센 값(count). 모든 인덱싱 폴더는 그 합
  const cntOf = (n) => n == null ? "" : `<span class="cnt">(${Number(n).toLocaleString("ko-KR")})</span>`;
  const total = roots.some((r) => r.count != null) ? roots.reduce((a, r) => a + (r.count || 0), 0) : null;
  h += `<button class="i ${scope ? "" : "on"}" data-p=""><span class="tw"></span><span class="n">모든 인덱싱 폴더</span>${cntOf(total)}</button>`;
  const node = (path, name, depth, icon, count) => {
    const on = scope && scope.toLowerCase() === path.toLowerCase();
    const open = openDirs.has(path);
    const kids = dirs[path];
    const tw = kids && !kids.length ? "" : open ? "▾" : "▸";
    let out = `<button class="i ${on ? "on" : ""}" data-p="${esc(path)}" style="padding-left:${6 + depth * 14}px" title="${esc(path)}">
      <span class="tw" data-dir="${esc(path)}">${tw}</span><svg width="16" height="16"><use href="#${icon}"/></svg><span class="n">${esc(name)}</span>${cntOf(count)}</button>`;
    if (open && kids) for (const k of kids) out += node(path.replace(/[\\/]+$/, "") + "\\" + k, k, depth + 1, "i-fold");
    return out;
  };
  for (const r of roots) h += node(r.path, r.name, 0, r.drive ? "i-drive" : "i-moai", r.count);
  if (!roots.length) h += `<div class="empty">아래 [＋ 폴더 추가] 로 인덱싱할 폴더를 넣으세요</div>`;
  // 폴더 빼기는 인덱싱 폴더(맨 위 폴더)를 골랐을 때만 — 그 아래 하위 폴더는 뺄 수 없다
  const picked = scope && roots.find((r) => r.path.toLowerCase().replace(/[\\/]+$/, "") === scope.toLowerCase().replace(/[\\/]+$/, ""));
  h += `<div class="fbar"><button id="fadd" title="인덱싱할 폴더를 고르기 창으로 넣습니다">＋ 폴더 추가</button>
    <button id="frem" ${picked ? "" : "disabled"} title="${picked ? esc(picked.path) + " 을(를) 인덱싱 폴더에서 뺍니다" : "뺄 인덱싱 폴더를 위 목록에서 고르세요"}">－ 폴더 빼기</button></div>`;
  s.innerHTML = h;
  $("fadd").onclick = () => send({ type: "add_folder" });
  $("frem").onclick = () => {
    if (!picked) return;
    // 파일은 그대로 두고 인덱스에서만 뺀다 — 실수로 누르지 않게 한 번 묻는다
    if (!confirm(`"${picked.name}" 폴더를 인덱싱 폴더에서 뺄까요?\n${picked.path}\n\n파일은 지우지 않고, 이 폴더의 문서만 검색에서 빠집니다.`)) return;
    scope = null;
    send({ type: "remove_folder", folder: picked.path });
  };
  s.querySelectorAll("[data-q]").forEach((b) => { b.onclick = () => runFind(b.dataset.q); });
  s.querySelectorAll("[data-p]").forEach((b) => { b.onclick = () => setScope(b.dataset.p || null); });
  s.querySelectorAll("[data-dir]").forEach((t) => {
    t.onclick = (e) => {
      e.stopPropagation();
      const p = t.dataset.dir;
      if (openDirs.has(p)) { openDirs.delete(p); drawNav(); return; }
      openDirs.add(p);
      if (dirs[p]) drawNav(); else send({ type: "list_dirs", path: p });
    };
  });
}

// ── 그리기: 좁은 패널 카드 ───────────────────────────────
let cardPick = {};   // 문서 경로 → 고른 쪽 줄 번호
function renderCards() {
  rows = [];
  const C = $("cards");
  if (!docs.length) {
    showMessage(lastQ ? `<b>"${esc(lastQ)}"</b> 와 맞는 문서를 찾지 못했습니다.` :
      `<img src="data:image/png;base64,__MOAI__" alt=""><br><b>이 폴더에서 찾기</b><br>문장으로 쓰면 그 내용이 있는<br>문서 · 쪽 · 대목을 찾아 줍니다.`);
    return;
  }
  let h = aiCard();
  for (const d of docs) {
    const m = d.meta;
    const di = rows.push({ kind: "doc", doc: d }) - 1;
    const pick = cardPick[m.doc_path] != null ? cardPick[m.doc_path] : 0;
    const chips = d.pages.slice(0, 8).map((p, k) =>
      `<button class="${k === pick ? "on" : ""}" data-chip="${di}:${k}" title="${esc(p.section || "")}">${p.page != null ? "p." + p.page : "·"}</button>`).join("")
      + (d.pages.length > 8 ? `<button data-big="1">+${d.pages.length - 8}</button>` : "");
    const p = d.pages[pick];
    h += `<div class="card ${m.low ? "low" : ""}" data-row="${di}"><div class="t">${docIcon(m.doc_path)}<span title="${esc(tipOf(m))}">${esc(m.doc_name)}</span></div>
      <div class="m">${m.meta_hit && !d.pages.length ? "조건 일치" : m.name_hit && !d.pages.length ? "이름에 검색어" : d.pages.length + "곳"} · ${bars(m.score, m.low)}${whoOf(m) ? " · " + esc(whoOf(m)) : ""}</div>
      ${d.pages.length ? `<div class="pgs">${chips}</div>` : ""}
      ${p ? `<div class="sn">${p.section ? `<b>${esc(p.section)}</b>` : ""}${marked(p.snippet, p.marks)}
        <div class="acts"><button data-open="${di}:${pick}">${p.page != null ? p.page + "쪽 " : ""}열기 ↗</button><button data-reveal="${di}">폴더 열기</button></div></div>` : ""}
      ${!d.pages.length ? `<div class="sn"><div class="acts"><button data-open="${di}:-1">열기 ↗</button><button data-reveal="${di}">폴더 열기</button></div></div>` : ""}
    </div>`;
  }
  C.innerHTML = h;
  bindAi();
  C.querySelectorAll("[data-chip]").forEach((b) => {
    b.onclick = () => {
      const [di, k] = b.dataset.chip.split(":").map(Number);
      const d = rows[di].doc;
      cardPick[d.meta.doc_path] = k;
      // 쪽 칩 — 설정이 "기본 앱" 이면 바로 열고, 아니면 크게 보기 창의 미리 보기로
      if (pageClick === "app") { send({ type: "open_page", path: d.meta.doc_path, page: d.pages[k].page }); renderCards(); }
      else { renderCards(); send({ type: "big", q: lastQ, folder: scope, select: { path: d.meta.doc_path, page: d.pages[k].page } }); }
    };
  });
  C.querySelectorAll("[data-open]").forEach((b) => {
    b.onclick = () => {
      const [di, k] = b.dataset.open.split(":").map(Number);
      const d = rows[di].doc;
      send({ type: "open_page", path: d.meta.doc_path, page: k >= 0 && d.pages[k] ? d.pages[k].page : null });
    };
  });
  C.querySelectorAll("[data-reveal]").forEach((b) => { b.onclick = () => send({ type: "reveal", path: rows[+b.dataset.reveal].doc.meta.doc_path }); });
  C.querySelectorAll("[data-big]").forEach((b) => { b.onclick = () => send({ type: "big", q: lastQ, folder: scope }); });
}

// ── 창 나눔 · 열 너비 — 끌어서 바꾸고 이 PC 에 기억 ────────
//   탐색 창(--side) · 미리 보기 창(--pv) · 목록의 쪽 · 관련도 · 수정한 날짜 열(--c-*). 두 번 누르면 처음대로.
//   pv 가 null 이면 처음 비율(36%)을 그대로 쓴다.
const LAYOUT_DEF = { side: 200, pv: null, page: 64, rel: 70, date: 92 };
let lay = Object.assign({}, LAYOUT_DEF, (() => {
  try { return JSON.parse(localStorage.getItem("moai.layout") || "{}") || {}; } catch (e) { return {}; }
})());
function saveLayout() { try { localStorage.setItem("moai.layout", JSON.stringify(lay)); } catch (e) { /* 저장 못 해도 그만 */ } }
function applyLayout() {
  const m = $("main").style;
  // 창이 기억한 너비보다 작아졌으면 목록이 300px 은 남게 그 자리에서만 줄인다(기억한 값은 그대로)
  const W = $("main").getBoundingClientRect().width || innerWidth;
  const side = Math.max(120, Math.min(lay.side, W - 310 - (pvShown ? 220 : 0)));
  m.setProperty("--side", side + "px");
  if (lay.pv) m.setProperty("--pv", Math.max(220, Math.min(lay.pv, W - side - 310)) + "px"); else m.removeProperty("--pv");
  // 열 너비는 목록 상자에 걸어 머리글과 모든 줄이 같은 너비를 쓴다
  const l = $("list").style;
  l.setProperty("--c-page", lay.page + "px");
  l.setProperty("--c-rel", lay.rel + "px");
  l.setProperty("--c-date", lay.date + "px");
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
// 끌기 공통 — 누른 곳에서 움직인 거리(dx)를 넘긴다. 포인터를 붙잡아 미리 보기(PDF) 위를 지나도 놓치지 않게
function dragX(el, onStart, onMove) {
  el.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    const x0 = e.clientX, st = onStart();
    el.setPointerCapture(e.pointerId);
    el.classList.add("drag"); document.body.classList.add("dragging");
    const move = (ev) => { onMove(st, ev.clientX - x0); applyLayout(); };
    const up = () => {
      el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
      el.classList.remove("drag"); document.body.classList.remove("dragging");
      saveLayout(); sendRect();
    };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  });
  el.addEventListener("click", (e) => e.stopPropagation());
}
function bindSplits() {
  const W = () => $("main").getBoundingClientRect().width;
  // 탐색 창 — 120px ~ (목록이 300px 은 남게)
  dragX($("split1"), () => lay.side, (s, dx) => {
    const pv = pvShown ? $("pv").getBoundingClientRect().width : 0;
    lay.side = Math.round(clamp(s + dx, 120, Math.min(480, W() - pv - 310)));
  });
  $("split1").ondblclick = () => { lay.side = LAYOUT_DEF.side; applyLayout(); saveLayout(); };
  // 미리 보기 창 — 오른쪽 끝이 고정이므로 왼쪽으로 끌면 넓어진다
  dragX($("split2"), () => $("pv").getBoundingClientRect().width, (s, dx) => {
    lay.pv = Math.round(clamp(s - dx, 220, W() - lay.side - 310));
  });
  $("split2").ondblclick = () => { lay.pv = null; applyLayout(); saveLayout(); };
}
// 목록 머리글의 열 경계 — 열의 왼쪽 경계라 왼쪽으로 끌면 그 열이 넓어진다(이름 열이 그만큼 준다)
function bindColGrip(g) {
  const k = g.dataset.col;
  dragX(g, () => g.parentElement.getBoundingClientRect().width, (s, dx) => { lay[k] = Math.round(clamp(s - dx, 36, 360)); });
  g.ondblclick = (e) => { e.stopPropagation(); lay[k] = LAYOUT_DEF[k]; applyLayout(); saveLayout(); };
}

// ── 키보드 ───────────────────────────────────────────────
document.addEventListener("keydown", (e) => {
  const inInput = e.target.tagName === "INPUT";
  if ((e.ctrlKey && (e.key === "f" || e.key === "e")) || e.key === "F3") {
    e.preventDefault(); (LAYOUT === "window" ? $("q") : $("pq")).focus(); (LAYOUT === "window" ? $("q") : $("pq")).select(); return;
  }
  if (e.key === "Escape") {
    hideMenu();
    if (inInput && e.target.value) { e.target.value = ""; return; }
    if (LAYOUT === "panel") send({ type: "close" });
    return;
  }
  if (e.key === "F5") { e.preventDefault(); if (lastQ) runFind(lastQ, false); return; }
  if (LAYOUT !== "window") return;
  if (e.altKey && (e.key === "p" || e.key === "P")) { e.preventDefault(); togglePv(); return; }
  if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); goHist(-1); return; }
  if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); goHist(1); return; }
  if (e.altKey && e.key === "ArrowUp") { e.preventDefault(); goUp(); return; }
  if (inInput) {
    if (e.key === "ArrowDown" && rows.length) { e.preventDefault(); e.target.blur(); select(Math.max(0, selIdx), true); }
    return;
  }
  const row = rows[selIdx];
  if (e.key === "ArrowDown") { e.preventDefault(); select(Math.min(rows.length - 1, selIdx + 1), true); }
  else if (e.key === "ArrowUp") { e.preventDefault(); if (selIdx <= 0) $("q").focus(); else select(selIdx - 1, true); }
  else if (e.key === "ArrowRight" && row && row.kind === "doc" && !openDocs.has(row.doc.meta.doc_path)) { e.preventDefault(); toggleDoc(row.doc); }
  else if (e.key === "ArrowLeft" && row) {
    e.preventDefault();
    if (row.kind === "doc" && openDocs.has(row.doc.meta.doc_path)) toggleDoc(row.doc);
    else if (row.kind === "page") { const j = rows.findIndex((x) => x.kind === "doc" && x.doc === row.doc); if (j >= 0) select(j, true); }
  }
  else if (e.key === "Enter" && row) { e.preventDefault(); activate(selIdx); }
  else if (e.key === " " && row) { e.preventDefault(); showPreview(row); }
  else if (e.ctrlKey && e.shiftKey && (e.key === "C" || e.key === "c") && row) { e.preventDefault(); copy(row.doc.meta.doc_path); }
});
function goHist(d) {
  const k = histPos + d;
  if (k < 0 || k >= hist.length) return;
  histPos = k;
  scope = hist[k].scope;
  runFind(hist[k].q, false);
}
function goUp() {
  if (!scope) return;
  const r = rootOf(scope);
  if (r && scope.toLowerCase().replace(/[\\/]+$/, "") === r.path.toLowerCase().replace(/[\\/]+$/, "")) { setScope(null); return; }
  setScope(scope.replace(/[\\/]+$/, "").replace(/[\\/][^\\/]+$/, ""));
}
function togglePv() {
  pvShown = !pvShown;
  $("main").classList.toggle("nopv", !pvShown);
  $("pvtoggle").classList.toggle("on", pvShown);
  applyLayout();
  sendRect();
  if (pvShown && rows[selIdx]) showPreview(rows[selIdx]);
}

// ── Rust 가 부르는 함수들 ────────────────────────────────
const api = {
  setRoots(v) { roots = v || []; drawNav(); },
  setDirs(path, names) { dirs[path] = names || []; drawNav(); },
  setPageClick(v) { pageClick = v || "preview"; },
  // 탐색기 옆 패널 — 지금 탐색기가 보는 폴더가 찾는 범위
  setFolder(f) {
    if (LAYOUT !== "panel") return;
    const changed = (f || null) !== scope;
    scope = f || null;
    $("pfolder").textContent = scope ? "📁 " + scope : "";
    $("pfolder").title = scope || "";
    if (changed && lastQ) runFind(lastQ, false);
  },
  results(r) { onResults(r); },
  // 크게 보기 — 다른 화면에서 넘어온 검색
  runQuery(q, folder, select) {
    if (folder !== undefined) scope = folder || null;
    pendingSelect = select || null;
    busy = false;
    if (q) runFind(q); else drawNav();
  },
  setState(t) { if (t) setStatus(t); },
  notice(t) { setStatus(t); },
  error(t) {
    busy = false;
    if (ai && ai.text === "" && ai.info == null) { ai.err = t; redrawAi(); }
    setStatus(t, true);
  },
  // AI 답(RAG) — 같은 검색어로 묻고 흘러나오는 답을 카드에
  evidence(items) { if (ai) { ai.ev = (items || []).length; redrawAi(); } },
  token(t) { if (ai) { ai.text += t; redrawAi(); } },
  raw(t) { if (ai) { ai.text += t; redrawAi(); } },
  finish(info) {
    if (!ai) return;
    ai.info = info || {};
    if (info && info.answer && !ai.text) ai.text = info.answer;
    redrawAi();
  },
};
// 이 화면이 모르는 함수(대화 패널 전용 — setHistory · uploadDone …)는 조용히 넘긴다
window.rsb = new Proxy(api, { get: (t, k) => (k in t ? t[k] : () => {}) });

// ── 시작 ─────────────────────────────────────────────────
if (LAYOUT === "window") {
  $("win").classList.remove("hidden");
  $("go").onclick = () => runFind($("q").value);
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); if (e.shiftKey) askAi(); else runFind($("q").value); }
  });
  $("askai").onclick = askAi;
  $("toai").onclick = () => send({ type: "switch_mode", mode: "rag" });
  $("again").onclick = () => { if (lastQ) runFind(lastQ, false); };
  $("back").onclick = () => goHist(-1);
  $("fwd").onclick = () => goHist(1);
  $("up").onclick = goUp;
  $("group").onchange = render;
  // 정렬 상자로 기준을 바꾸면 그 기준의 기본 방향으로
  $("sort").onchange = () => { sortAsc = SORT_ASC_DEF[$("sort").value]; render(); };
  $("pvtoggle").onclick = togglePv;
  $("pvopen").onclick = () => { if (rows[selIdx]) openPage(rows[selIdx]); };
  $("pvreveal").onclick = () => { if (rows[selIdx]) send({ type: "reveal", path: rows[selIdx].doc.meta.doc_path }); };
  applyLayout();
  bindSplits();
  new ResizeObserver(sendRect).observe($("pvframe"));
  window.addEventListener("resize", () => { applyLayout(); sendRect(); });
  $("list").innerHTML = `<div class="msg">${welcome()}</div>`;
  drawNav();
  setTimeout(() => $("q").focus(), 50);
} else {
  document.body.classList.add("panel");
  $("pnl").classList.remove("hidden");
  $("pgo").onclick = () => runFind($("pq").value);
  $("pq").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); if (e.shiftKey) askAi(); else runFind($("pq").value); }
  });
  $("pask").onclick = askAi;
  $("big").onclick = () => send({ type: "big", q: lastQ, folder: scope });
  $("torag").onclick = () => send({ type: "mode", mode: "rag" });
  $("pclose").onclick = () => send({ type: "close" });
  renderCards();
}
send({ type: "ready" });
</script>
</body>
</html>
