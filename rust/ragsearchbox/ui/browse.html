<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoAI 탐색기</title>
<!--
  MoAI 탐색기 — 탐색기 모드 화면 (폴더 아이콘 · 탐색기 모드 설계서 §10 · §11)
  - 자연어로 찾으면 답을 짓지 않고 "문서 ▸ 쪽 ▸ 발췌" 를 탐색기 같은 목록으로 보여 준다
  - __LAYOUT__ = window : 독립 창(주소줄 · 검색 상자 · 명령 모음 · 탐색 창 · 자세히 보기 · 미리 보기 창 · 상태 표시줄)
               panel  : 탐색기 옆 좁은 패널(한 단 — 문서 카드 · 쪽 칩 · 발췌)
  - 미리 보기 창의 PDF 는 Rust 가 이 화면 위에 따로 띄운 WebView 가 그린다(#pvframe 자리를 알려 준다).
    PDF 가 아니면 이 화면이 청크 글을 직접 보여 준다(글 미리 보기).
  Rust 와는 window.ipc.postMessage(JSON) / window.rsb.* 함수로 주고받는다.
-->
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --sunken: #f1f2f4; --ink: #16181d; --ink2: #3c4049; --muted: #7a808c; --rule: #e6e8ec;
    --brand: #e5163f; --brand-soft: #fdecef; --sel: #e8eefb; --sel-bar: #2c5aa0; --hover: #f2f4f7; --link: #1f5fbf;
    --ai-bg: #eaf0fc; --ai-line: #d3dff5;
    --mark: #ffe58a; --fs: __FONT_PX__px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Malgun Gothic", "맑은 고딕", "Segoe UI", sans-serif; font-size: var(--fs); -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; flex: none; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .hidden { display: none !important; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d3d6dc; border-radius: 10px; border: 3px solid var(--surface); }

  /* ── 주소줄 ── */
  .addr { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--rule); }
  .brand { display: flex; align-items: center; gap: 6px; flex: none; }
  .brand img { width: 22px; height: 22px; object-fit: contain; }
  .brand b { font-size: calc(var(--fs) * 1.0); }
  .brand b span { color: var(--brand); }
  .navbtn { width: 28px; height: 28px; border-radius: 6px; color: var(--muted); display: grid; place-items: center; }
  .navbtn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .navbtn:disabled { opacity: .35; cursor: default; }
  .crumb { flex: 0 1 34%; min-width: 120px; display: flex; align-items: center; gap: 2px; border: 1px solid var(--rule); border-radius: 6px;
    padding: 4px 8px; white-space: nowrap; overflow: hidden; color: var(--ink2); }
  .crumb button { padding: 1px 4px; border-radius: 4px; white-space: nowrap; }
  .crumb button:hover { background: var(--hover); }
  .crumb .sep { color: var(--muted); }
  .search { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px; border: 2px solid var(--brand); border-radius: 8px;
    padding: 3px 6px 3px 10px; background: var(--surface); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-weight: bold; color: var(--ink); background: none; padding: 3px 0; }
  /* 예시 문구(placeholder)는 입력한 글과 구분되게 회색 · 보통 굵기로 */
  .search input::placeholder { color: var(--muted); font-weight: normal; opacity: 1; }
  .search .hint { color: var(--muted); font-size: calc(var(--fs) * .82); white-space: nowrap; }
  .search .go { background: var(--brand); color: #fff; border-radius: 6px; padding: 3px 10px; font-weight: bold; }
  .search .go, .search .clr { flex: none; white-space: nowrap; }
  .search .clr { color: var(--ink2); border: 1px solid var(--rule); border-radius: 6px; padding: 2px 9px; background: var(--surface); }
  .search .clr:hover { border-color: var(--brand); color: var(--brand); }
  /* 비슷한 문서 찾기 — [+] · 기준 문서 칩 · 끌어 놓기 강조 */
  .search .add { flex: none; width: 26px; height: 26px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink2); font-weight: bold; line-height: 1; }
  .search .add:hover { border-color: var(--brand); color: var(--brand); }
  .search .src { flex: none; display: inline-flex; align-items: center; gap: 4px; max-width: 45%; background: var(--sel); border: 1px solid var(--brand); border-radius: 999px; padding: 1px 4px 1px 9px; font-size: calc(var(--fs) * .9); }
  .search .src.hidden { display: none; }
  .search .src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .search .src button { border: 0; background: none; color: var(--muted); padding: 0 4px; }
  .search .src button:hover { color: var(--brand); }
  .search.dropzone { border-style: dashed; }
  .search.dropover { border-style: solid; box-shadow: 0 0 0 3px var(--sel); }
  .search .drophint { position: absolute; left: 10px; top: calc(100% + 6px); z-index: 20; background: var(--brand); color: #fff; border-radius: 6px; padding: 3px 9px; font-size: calc(var(--fs) * .85); white-space: nowrap; pointer-events: none; }
  .r .mine { color: var(--muted); font-size: calc(var(--fs) * .88); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 명령 모음 ── */
  .cmd { display: flex; align-items: center; gap: 4px; padding: 5px 10px; background: var(--surface); border-bottom: 1px solid var(--rule); color: var(--ink2); }
  .cmd .b { padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
  .cmd .b:hover { background: var(--hover); }
  .cmd .b.on { background: var(--sunken); }
  /* 창 단추(미리 보기 · AI 답변창) — 켜기 전에도 찾기 쉽고, 켜지면 창과 같은 파랑 */
  .cmd .tog { color: var(--sel-bar); font-weight: bold; box-shadow: inset 0 0 0 1px var(--ai-line); }
  .cmd .tog:hover { background: var(--sel); }
  .cmd .tog.on, .cmd .tog.on:hover { background: var(--sel-bar); color: #fff; box-shadow: none; }
  /* 모두 찾기 — 검색 조건이라 창 단추(파란 채움)와 모양을 달리한 체크박스 */
  .cmd .fa { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 6px; color: var(--sel-bar); font-weight: bold;
    box-shadow: inset 0 0 0 1px var(--ai-line); cursor: pointer; white-space: nowrap; }
  .cmd .fa input { margin: 0; accent-color: var(--sel-bar); }
  .grp .tg { color: var(--sel-bar); font-weight: bold; padding: 0 4px; }
  .grp .tg:hover { text-decoration: underline; }
  .grp.tier { color: var(--sel-bar); }
  /* 묶음 머리 — 파일 줄과 섞이지 않게 옅은 파란 띠 · 왼쪽 굵은 선 · 개수 알약 */
  .grp .gh { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 0; font: inherit; font-weight: bold; color: inherit; cursor: pointer; }
  .grp .gh:hover .ga { background: var(--sel-bar); color: #fff; }
  .grp .ga { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; font-size: .8em; color: var(--sel-bar); background: #fff; border: 1px solid var(--ai-line); }
  .grp .gc { font-weight: normal; font-size: .9em; color: #fff; background: var(--sel-bar); border-radius: 999px; padding: 1px 9px; }
  .cmd select { font: inherit; color: var(--ink2); border: 1px solid var(--rule); border-radius: 6px; padding: 2px 4px; background: var(--surface); }
  .cmd .sp { flex: 1; }
  .cmd .ai { border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; white-space: nowrap; }
  .cmd .ai:hover { border-color: var(--brand); color: var(--brand); }
  /* 첫 실행 — 환영 화면 */
  .msg .first { display: inline-block; text-align: left; margin-top: 6px; color: var(--ink2); }
  .msg .first li { margin: 3px 0; }
  .msg .pick { margin-top: 14px; padding: 8px 20px; border-radius: 8px; background: var(--sel-bar); color: #fff; font-weight: bold; font-size: 1.05em; cursor: pointer; }
  .msg .pick:hover { filter: brightness(1.1); }
  /* 화면 위 안내 — 네 조각 막으로 비춘 곳만 남기고(그곳은 눌러 볼 수 있다), 테두리 · 말풍선 */
  .tm { position: fixed; z-index: 9000; background: rgba(15, 20, 28, .55); }
  #tourring { position: fixed; z-index: 9001; border-radius: 8px; outline: 3px solid #7fb0ff; box-shadow: 0 0 0 6px rgba(127, 176, 255, .35); pointer-events: none; transition: all .18s; }
  #tourbub { position: fixed; z-index: 9002; width: 320px; background: #fff; color: #19212d; border-radius: 10px; padding: 13px 15px 11px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .35); line-height: 1.55; }
  #tourbub h4 { margin: 0 0 5px; font-size: 1.02em; }
  #tourbub h4 small { color: var(--sel-bar); font-weight: bold; margin-right: 6px; }
  #tourbub p { margin: 0 0 10px; color: #3c4656; font-size: .95em; }
  #tourbub .bt { display: flex; align-items: center; gap: 6px; }
  #tourbub .bt .sp { flex: 1; }
  #tourbub .dots { display: inline-flex; gap: 4px; }
  #tourbub .dots i { width: 7px; height: 7px; border-radius: 50%; background: #d9dee6; }
  #tourbub .dots i.on { background: var(--sel-bar); }
  #tourbub button { border: 1px solid #d9dee6; border-radius: 6px; padding: 3px 10px; background: #fff; color: #3c4656; cursor: pointer; }
  #tourbub button.go { background: var(--sel-bar); border-color: var(--sel-bar); color: #fff; font-weight: bold; }
  /* 단축키 상자 */
  #keys { position: fixed; z-index: 9003; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 360px; background: #fff; color: #19212d;
    border-radius: 10px; padding: 14px 16px; box-shadow: 0 12px 32px rgba(0, 0, 0, .35); }
  #keys h4 { margin: 0 0 8px; }
  #keys table { width: 100%; border-collapse: collapse; font-size: .95em; }
  #keys td { padding: 4px 6px; border-bottom: 1px solid #eceff4; }
  #keys td:first-child { white-space: nowrap; font-weight: bold; color: var(--sel-bar); }
  #keys .bt { text-align: right; margin-top: 10px; }
  .cmd .ai .badge { display: inline-block; min-width: 18px; margin-left: 3px; padding: 0 5px; border-radius: 999px; background: var(--brand); color: #fff;
    font-size: .8em; font-weight: bold; text-align: center; line-height: 1.5; }

  /* ── 본문: 탐색 창 | 목록 | 미리 보기 ── */
  /* 창 나눔 — 탐색 창 · 미리 보기 창 너비는 사이 막대(.split)를 끌어 바꾼다(--side · --pv, 이 PC 에 기억) */
  /* 행 높이를 창에 묶는다 — 없으면 긴 글 미리 보기가 행을 늘려 아래 버튼 · AI 답변창이 창 밖으로 밀려난다 */
  .main { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: var(--side, 200px) 5px minmax(0, 1fr) 5px var(--pv, 36%); }
  .main.nopv { grid-template-columns: var(--side, 200px) 5px minmax(0, 1fr); }
  .main.nopv .pv, .main.nopv #split2 { display: none; }
  .split { cursor: col-resize; background: var(--surface); position: relative; z-index: 3; }
  .split::after { content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--rule); }
  .split:hover::after, .split.drag::after { left: 1px; width: 3px; background: var(--sel-bar); }
  body.dragging, body.dragging * { cursor: col-resize !important; user-select: none !important; }
  .side { border-right: 1px solid var(--rule); background: var(--surface); overflow-y: auto; overflow-x: hidden; padding: 6px 4px 0; color: var(--ink2);
    display: flex; flex-direction: column; }
  /* 탐색 창 아래 — 인덱싱 폴더 추가 · 빼기(목록이 짧아도 맨 아래에 붙는다) */
  .side .fbar { margin-top: auto; position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--rule);
    display: flex; gap: 4px; padding: 6px 2px 8px; }
  .side .fbar button { flex: 1; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 0; font-size: calc(var(--fs) * .85); white-space: nowrap; }
  .side .fbar button:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
  .side .fbar button:disabled { opacity: .4; cursor: default; }
  .side .h { font-size: calc(var(--fs) * .8); color: var(--muted); padding: 10px 8px 3px; }
  .side .i { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden;
    cursor: pointer; width: 100%; text-align: left; }
  .side .i:hover { background: var(--hover); }
  .side .i.on { background: var(--sel); color: var(--ink); }
  .side .i .tw { width: 14px; color: var(--muted); flex: none; text-align: center; font-size: 10px; }
  .side .i span.n { overflow: hidden; text-overflow: ellipsis; }
  .side .i .cnt { color: var(--muted); font-size: calc(var(--fs) * .82); flex: none; margin-left: -2px; }
  /* 인덱싱 중인 폴더 — 수를 브랜드 색으로, 오른쪽에 깜박이는 점 */
  .side .i .cnt.busy { color: var(--brand); font-weight: bold; }
  .side .i .cnt.busy::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%; vertical-align: 1px;
    background: var(--brand); animation: busy-blink 1s ease-in-out infinite; }
  @keyframes busy-blink { 0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(229, 22, 63, .45); }
    50% { opacity: .2; transform: scale(.75); box-shadow: 0 0 0 4px rgba(229, 22, 63, 0); } }
  @media (prefers-reduced-motion: reduce) { .side .i .cnt.busy::after { animation: none; } }
  /* 내용 전체 보기 팝업 — 찾은 곳들의 청크 본문 */
  .chunkbox { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(22, 24, 29, .35); outline: 0; }
  .cb { width: calc(100vw - 24px); max-width: 720px; height: calc(100vh - 32px); background: var(--surface); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
    display: flex; flex-direction: column; min-height: 0; }
  .cb .cb-hd { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
  .cb .cb-hd b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cb .cb-hd span { color: var(--muted); font-size: calc(var(--fs) * .82); flex: none; }
  .cb .cb-hd button { margin-left: auto; flex: none; width: 26px; height: 26px; border-radius: 6px; color: var(--muted); }
  .cb .cb-hd button:hover { background: var(--hover); color: var(--ink); }
  .cb .cb-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px 12px; position: relative; }
  .cb section { padding: 8px 10px; margin-bottom: 8px; border-radius: 6px; background: var(--sunken); border-left: 3px solid transparent; }
  .cb section.on { border-left-color: var(--brand); }
  .cb h4 { margin: 0 0 4px; font-size: calc(var(--fs) * .92); color: var(--ink); }
  .cb .cb-text { white-space: pre-wrap; word-break: break-word; line-height: 1.6; color: var(--ink2); user-select: text; }
  /* 찾는 중 — 검색창 아래로 흐르는 막대(진행률을 알 수 없다) */
  .search { position: relative; }
  .search.finding::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -6px; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--brand), transparent) no-repeat; background-size: 40% 100%; animation: find-flow 1.1s linear infinite; }
  @keyframes find-flow { from { background-position: -70% 0; } to { background-position: 170% 0; } }
  @media (prefers-reduced-motion: reduce) { .search.finding::after { animation: none; background: var(--brand); opacity: .5; } }
  /* 폴더 이름을 쳐서 확인하는 창 */
  .namebox { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(22, 24, 29, .35); }
  .nb { width: min(440px, calc(100vw - 32px)); background: var(--surface); border-radius: 10px; padding: 16px 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
    display: flex; flex-direction: column; gap: 8px; }
  .nb .nb-path { color: var(--muted); font-size: calc(var(--fs) * .85); word-break: break-all; }
  .nb .nb-note { color: var(--ink2); white-space: pre-line; }
  .nb label { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .nb input { font: inherit; color: var(--ink); padding: 5px 8px; border: 1px solid var(--muted); border-radius: 6px; outline: 0; background: var(--surface); }
  .nb input:focus { border-color: var(--brand); }
  .nb .nb-btns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px; }
  .nb .nb-btns button { padding: 5px 14px; border: 1px solid var(--rule); border-radius: 6px; }
  .nb .nb-ok { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: bold; }
  .nb .nb-ok:disabled { opacity: .4; cursor: default; }
  /* 허락을 기다리는 폴더 — 진한 주황으로 눈에 띄게 */
  .side .i .cnt.wait { color: #b45309; font-weight: bold; }
  /* 인덱싱에서 뺀 하위 폴더 — 흐리게, 이름 뒤에 (뺌) */
  .side .i.off { color: var(--muted); }
  .side .i.off svg { opacity: .45; }
  .side .i .offtag { color: var(--muted); font-size: calc(var(--fs) * .82); flex: none; }
  .side .empty { color: var(--muted); padding: 3px 10px; font-size: calc(var(--fs) * .85); }

  .mid { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .list { flex: 1; min-height: 0; overflow: auto; background: var(--surface); position: relative; }
  /* 목록 열 — 이름·위치·내용 열은 남는 너비를 채우고, 쪽 · 관련도 · 수정한 날짜 열은 머리글 경계(.cg)를 끌어 바꾼다 */
  .cols, .r { display: grid; grid-template-columns: minmax(0, 1fr) var(--c-page, 64px) var(--c-rel, 70px) var(--c-date, 92px);
    gap: 8px; align-items: center; padding: 0 12px; }
  .r > span { min-width: 0; overflow: hidden; }
  .cols { position: sticky; top: 0; z-index: 2; background: var(--surface); color: var(--muted); font-size: calc(var(--fs) * .82);
    padding-top: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
  .cols > span { position: relative; white-space: nowrap; overflow: visible; }
  .cg { position: absolute; top: -6px; bottom: -6px; left: -9px; width: 9px; cursor: col-resize; }
  .cg::after { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: 1px; background: var(--rule); }
  .cg:hover::after, .cg.drag::after { background: var(--sel-bar); width: 2px; }
  /* 정렬 머리글 — 글자가 아니라 칸 전체를 누른다(머리글 줄 위아래 여백까지 칸으로) */
  .cols > .hc { cursor: pointer; align-self: stretch; display: flex; align-items: center; margin: -6px 0; padding: 6px 0; }
  .cols > .hc:hover { background: var(--hover); color: var(--ink); }
  .cols > .hc.on { color: var(--ink); font-weight: bold; }
  .grp { color: var(--sel-bar); font-size: calc(var(--fs) * .9); padding: 6px 12px; margin: 10px 0 4px; background: var(--ai-bg);
    border-left: 4px solid var(--sel-bar); border-top: 1px solid var(--ai-line); border-bottom: 1px solid var(--ai-line); }
  .grp:first-child { margin-top: 0; }
  .r { padding-top: 4px; padding-bottom: 4px; cursor: default; user-select: none; }
  .r:hover { background: var(--hover); }
  .r.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--sel-bar); }
  .r.low { opacity: .5; }
  .r.doc .n { display: flex; align-items: center; gap: 6px; font-weight: bold; min-width: 0; }
  .r.doc .n .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r.doc .tw { width: 12px; color: var(--muted); flex: none; font-size: 10px; text-align: center; }
  .r.doc .cnt { font-weight: normal; color: var(--muted); font-size: calc(var(--fs) * .85); white-space: nowrap; }
  .r.pg { padding-left: 42px; }
  .r.pg .n { min-width: 0; }
  .r .sec { color: var(--ink2); font-size: calc(var(--fs) * .85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .snip { color: var(--muted); font-size: calc(var(--fs) * .85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .dn { color: var(--ink2); font-size: calc(var(--fs) * .8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .date { color: var(--muted); font-size: calc(var(--fs) * .85); white-space: nowrap; }
  .pgchip { display: inline-block; border: 1px solid var(--rule); border-radius: 5px; padding: 0 6px; font-family: Consolas, monospace;
    font-size: calc(var(--fs) * .82); background: var(--surface); white-space: nowrap; }
  .pgchip.approx { border-style: dashed; }
  .rel { display: inline-flex; gap: 2px; }
  .rel i { width: 8px; height: 8px; border-radius: 2px; background: var(--rule); }
  .rel i.f { background: var(--brand); }
  .more { padding: 2px 12px 6px 42px; }
  .more button { color: var(--link); font-size: calc(var(--fs) * .85); }
  .msg { color: var(--muted); padding: 40px 20px; text-align: center; line-height: 1.7; }
  .msg b { color: var(--ink); }
  .msg img { width: 72px; height: 72px; object-fit: contain; background: #fff; border-radius: 20px; padding: 6px;
    box-shadow: 0 6px 18px rgba(20,24,33,.10), 0 0 0 1px var(--rule); margin-bottom: 10px; }
  .msg img.big { width: 116px; height: 116px; border-radius: 30px; padding: 10px; margin-bottom: 14px; }
  .msg .cpr { display: inline-flex; align-items: center; gap: 7px; margin-top: 36px; white-space: nowrap; color: #9aa3b2; font-size: calc(var(--fs) * .82); letter-spacing: .02em; }
  .msg .cpr svg { width: 15px; height: 18px; color: #2c5aa0; opacity: .75; }

  /* 목록 아래 가로 경계 — AI 답변창 높이를 바꾼다(--ai, 이 PC 에 기억) */
  .split.rowy { flex: none; height: 5px; cursor: row-resize; }
  .split.rowy::after { top: 2px; bottom: auto; left: 0; right: 0; width: auto; height: 1px; }
  .split.rowy:hover::after, .split.rowy.drag::after { top: 1px; left: 0; width: auto; height: 3px; }
  /* AI 답변창 — 목록과 구분되게 파란 톤 + 줄마다 카드. 빨강은 오류처럼 보여 쓰지 않는다 */
  .aip { flex: none; height: var(--ai, 34%); min-height: 140px; overflow: auto; padding: 0 14px 10px; background: var(--ai-bg); border-top: 3px solid var(--sel-bar); line-height: 1.6; }
  body.panel .aip { height: auto; max-height: 45%; }
  .aip .hd { position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; align-items: center; padding: 8px 0 6px; background: var(--ai-bg); }
  .tt { flex: none; padding: 2px 11px; border-radius: 999px; background: var(--sel-bar); color: #fff; font-weight: bold; white-space: nowrap; }
  .aip .hd small { color: var(--ink2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .aip .hd .sp { flex: 1; }
  .aip .hd button { color: var(--ink2); padding: 0 6px; border-radius: 4px; white-space: nowrap; }
  .aip .hd button:hover { background: var(--ai-line); color: var(--sel-bar); }
  .aip .ph2 { color: var(--ink2); padding: 10px 2px; }
  .aip .ln { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 9px; margin: 6px 0; padding: 7px 11px; background: var(--surface);
    border: 1px solid var(--ai-line); border-left: 3px solid var(--sel-bar); border-radius: 8px; box-shadow: 0 1px 2px rgba(44,90,160,.08); }
  .aip .ln em { grid-column: 2; color: var(--muted); font-style: normal; font-size: calc(var(--fs) * .8); }
  .aip .ln .dopen { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; width: 20px; height: 20px; margin-left: 6px; padding: 0;
    border: 1px solid var(--ai-line); border-radius: 5px; background: var(--surface); color: var(--sel-bar); cursor: pointer; }
  .aip .ln .dopen:hover { background: var(--sel-bar); border-color: var(--sel-bar); color: #fff; }
  .aip .ln .ex { color: #8a5a00; background: #fff3d6; font-style: normal; font-size: calc(var(--fs) * .8); border-radius: 4px; padding: 1px 5px; }
  .aip .ln .wr { color: var(--sel-bar); animation: aiwrite 1.2s ease-in-out infinite; }
  @keyframes aiwrite { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .aip .ln .wr { animation: none; } }
  .aip .cite { min-width: 22px; height: 22px; line-height: 22px; align-self: start; margin-top: 1px; padding: 0 5px; border-radius: 6px; background: var(--sel-bar); color: #fff; font-weight: bold; text-align: center; }
  .aip .cite:hover { filter: brightness(1.15); }
  .aip .cite.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--sel-bar); }
  .aip .er { color: #b4462f; margin-top: 4px; }
  .aip .ft { color: var(--ink2); font-size: calc(var(--fs) * .8); margin-top: 8px; }
  .aip .ft button { color: var(--link); font-size: inherit; }
  /* 미리 보기 창 */
  /* AI 답변창과 같은 틀 — 파란 띠 · 알약 제목 · 흰 카드. PDF 는 #pvframe 자리에 뜬다 */
  .pv { border-left: 1px solid var(--rule); border-top: 3px solid var(--sel-bar); background: var(--ai-bg); display: flex; flex-direction: column; min-width: 0; }
  .pv .ph { display: flex; gap: 8px; align-items: center; padding: 8px 12px 6px; color: var(--ink2); }
  .pv .ph #pvx { color: var(--ink2); padding: 0 6px; border-radius: 4px; }
  .pv .ph #pvx:hover { background: var(--ai-line); color: var(--sel-bar); }
  .pv .ph .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }
  #pvframe { flex: 1; margin: 0 12px; background: var(--surface); border: 1px solid var(--ai-line); border-radius: 8px; box-shadow: 0 1px 2px rgba(44,90,160,.08); overflow: auto; min-height: 0; }
  #pvtext { padding: 12px 14px; white-space: pre-wrap; line-height: 1.7; font-size: calc(var(--fs) * .92); }
  #pvtext .sec { font-weight: bold; margin-bottom: 6px; color: var(--ink2); }
  #pvtext .note { color: var(--muted); font-size: calc(var(--fs) * .8); margin-top: 10px; }
  .pv .empty { color: var(--ink2); padding: 30px 14px; text-align: center; }
  .pv .acts { display: flex; gap: 6px; padding: 8px 12px 10px; }
  .pv .acts button { flex: 1; border: 1px solid var(--ai-line); border-radius: 6px; padding: 5px 0; background: var(--surface); color: var(--sel-bar); }
  .pv .acts button.p { background: var(--sel-bar); border-color: var(--sel-bar); color: #fff; font-weight: bold; }
  .pv .acts button:disabled { opacity: .45; cursor: default; }

  /* 상태 표시줄 */
  .st { display: flex; gap: 14px; padding: 4px 12px; border-top: 1px solid var(--rule); background: var(--surface); color: var(--muted);
    font-size: calc(var(--fs) * .82); white-space: nowrap; overflow: hidden; }
  .st .sp { flex: 1; }
  .st .err { color: #b4462f; }
  /* 벡터 채우기 진행 — 검색 결과 글과 따로 맨 아래 줄에 남는다 */
  .st #stvec { color: var(--ink2); }
  .st #stvec::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; vertical-align: 1px;
    background: var(--brand); animation: busy-blink 1s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .st #stvec::before { animation: none; } }
  /* 모델 준비 진행 — 목록 위 띠. 검색 결과를 그려도 지워지지 않고, 맨 아래 줄과 달리 놓치지 않는다 */
  #loadband { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--surface); }
  #loadband.hidden { display: none; }
  #loadband b { white-space: nowrap; }
  #loadbar { flex: 1; min-width: 80px; height: 10px; accent-color: var(--brand); }
  #loadtxt { color: var(--muted); white-space: nowrap; }

  /* 오른쪽 클릭 메뉴 */
  #menu { position: fixed; z-index: 30; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 4px;
    box-shadow: 0 8px 24px rgba(20,24,33,.14); min-width: 170px; }
  #menu button { display: block; width: 100%; text-align: left; padding: 5px 10px; border-radius: 5px; }
  #menu button:hover { background: var(--hover); }

  /* ── 조건 칩 (메타데이터 검색 설계서 §14) — 실선 = 필터, 점선 = 가산, 흐린 줄 = 끈 조건 ── */
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 5px 10px; background: var(--surface);
    border-bottom: 1px solid var(--rule); font-size: calc(var(--fs) * .85); }
  .chips .lbl { color: var(--muted); margin-right: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--brand); color: var(--ink); border-radius: 999px;
    padding: 1px 4px 1px 9px; background: var(--surface); white-space: nowrap; }
  .chip.soft { border-style: dashed; border-color: var(--muted); color: var(--ink2); }
  .chip.off { border-color: var(--rule); color: var(--muted); }
  .chip.off .lb { text-decoration: line-through; }
  .chip button { border-radius: 999px; min-width: 18px; height: 18px; line-height: 18px; color: var(--muted); font-size: 11px; }
  .chip button:hover { background: var(--hover); color: var(--ink); }
  .chip button.w { padding: 0 6px; font-size: calc(var(--fs) * .78); border: 1px solid var(--rule); }
  .chips .note { color: var(--muted); }
  .chips .relax { color: #b26a00; }
  .who { font-weight: normal; color: var(--muted); font-size: calc(var(--fs) * .82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 0 3 auto; min-width: 0; max-width: 30%; }

  /* ── 좁은 패널 배치 ── */
  body.panel .addr { flex-wrap: wrap; }
  body.panel .phead { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--rule); }
  body.panel .phead .f { text-align: left; border: 0; background: none; cursor: pointer; padding: 3px 6px; border-radius: 6px; }
  body.panel .phead .f:hover { background: var(--hover); color: var(--ink); }
  body.panel .phead .f { flex: 1; min-width: 0; color: var(--muted); font-size: calc(var(--fs) * .82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.panel .psearch { padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--rule); }
  body.panel .cards { flex: 1; overflow-y: auto; background: var(--surface); }
  .card { border-bottom: 1px solid var(--rule); padding: 8px 12px; }
  .card.low { opacity: .55; }
  .card .t { font-weight: bold; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .card .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .m { color: var(--muted); font-size: calc(var(--fs) * .82); margin-top: 1px; }
  .card .pgs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .card .pgs button { border: 1px solid var(--rule); border-radius: 5px; padding: 0 7px; font-family: Consolas, monospace; font-size: calc(var(--fs) * .82); }
  .card .pgs button.on { border-color: var(--brand); color: var(--brand); }
  .card .sn { background: var(--sunken); border-radius: 6px; padding: 6px 8px; margin-top: 6px; font-size: calc(var(--fs) * .85); color: var(--ink2); line-height: 1.55; }
  .card .sn b { display: block; color: var(--ink); margin-bottom: 2px; }
  .card .sn .acts { display: flex; gap: 10px; margin-top: 5px; }
  .card .sn .acts button { color: var(--link); font-size: calc(var(--fs) * .82); }
  .ibtn { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--ink2); flex: none; }
  .ibtn:hover { background: var(--hover); color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; flex: none; font-size: calc(var(--fs) * .82); }
  .seg button { padding: 2px 8px; }
  .seg button.on { background: var(--brand); color: #fff; font-weight: bold; }
  /* [나란히 보기] — 켜져 있으면 브랜드색 */
  .ibtn.on, .cmd .ai.on { color: var(--brand); }
  .cmd .ai.on { border-color: var(--brand); background: var(--brand-soft); }
  .ibtn svg { width: 15px; height: 15px; }
  /* 📌 항상 위 — 창은 주소줄 맨 오른쪽, 좁은 패널은 머리 ✕ 앞. 켜지면 브랜드색 */
  #wtop { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--ink2); flex: none; margin-left: 4px; }
  #wtop:hover { background: var(--hover); color: var(--ink); }
  #wtop svg { width: 16px; height: 16px; }
  #wtop.on, #ptop.on { color: var(--brand); }
  #todock { display: inline-flex; align-items: center; gap: 4px; flex: none; }
  #todock svg { width: 14px; height: 14px; flex: none; }
</style>
</head>

<script>
"use strict";
const LAYOUT = "__LAYOUT__";
const $ = (id) => document.getElementById(id);
const send = (o) => window.ipc.postMessage(JSON.stringify(o));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const base = (p) => String(p || "").replace(/[\\/]+$/, "").split(/[\\/]/).pop() || p;
const isPdf = (p) => /\.pdf$/i.test(p || "");
// 열기 단추 글 — 쪽으로 바로 갈 수 있는 것은 PDF 뿐이다(Office · 한글은 쪽 지정 인자가 없어 파일만 연다)
const openLabel = (path, page) => (isPdf(path) && page != null ? `${page}쪽 열기` : "문서 열기");

// ── 상태 ─────────────────────────────────────────────────
let roots = [];          // 인덱싱 폴더 [{path, name, drive}]
let excluded = [];       // 인덱싱에서 뺀 하위 폴더 경로들([AutoIndex] ExcludeFolders)
let scope = null;        // 찾는 범위 폴더(null = 인덱싱 폴더 전체)
let scopeWant = null;
let candN = 0;
let firstRun = false;    // 검색 폴더가 하나도 없는 첫 실행 — 처음 화면 대신 환영 화면(앱이 setFirstRun 으로 알려 준다)
let manualOk = false;    // 설치 폴더에 사용 설명서가 있나 — 없으면 [?] 메뉴의 설명서 줄을 흐린다           // 고를 사전 후보 수(동의어 + 이름 별칭) — 앱이 setCandCount 로 알려 준다    // 되살릴 지난 검색 폴더 — 폴더 목록(setRoots)이 와야 맞는지 안다
let lastQ = "";          // 마지막으로 찾은 검색어
let docs = [];           // 결과 문서 [{meta, pages:[…]}]
let done = null;         // @find_done
let rows = [];           // 지금 화면의 고를 수 있는 줄 [{kind, doc, page}]
let selIdx = -1;
let openDocs = new Set();  // 펼친 문서 경로
let moreDocs = new Set();  // "더 보기" 누른 문서
let dirs = {};           // 폴더 → 하위 폴더 이름(탐색 창, 펼친 것만)
let openDirs = new Set();
let hist = [], histPos = -1;   // 뒤로 · 앞으로 (검색어 · 범위)
let pageClick = "preview";
let pendingSelect = null;      // 크게 보기로 넘어온 쪽(결과가 오면 고른다)
// 지난 실행의 화면 상태 — 앱이 INI [UI] BrowseState 를 읽어 넣는다(처음 실행이면 비어 있다)
//   웹 화면의 localStorage 는 HTML 글로 띄운 창에서 막힐 수 있어(실측) 앱 설정 파일에 둔다
const UI_SAVED = (() => { try { const v = __UISTATE__; return v && typeof v === "object" ? v : {}; } catch (e) { return {}; } })();
let pvShown = true;
let findAll = true;            // 모두 찾기(기본 켬) — 설정 [UI] FindAll 을 앱이 setFindAll 로 알려 준다
let grpShut = new Set();       // 접은 묶음 머리 — 새 찾기마다 "검색어 일부 포함"만 접는다(①이 0개면 펼친다)
let pagesAsked = new Set();    // 나머지 쪽 줄을 이미 부탁한 문서
let aiOn = false;              // AI 답변창이 켜져 있나 — 시작할 때 지난 상태(처음이면 켬)로 맞춘다
let ai = null;                 // 지금 정리 {key, q, text, items, info, err, done, stopped, pick, empty}
let briefBusy = false;         // 워커가 정리를 쓰는 중이다
let briefDrop = false;         // 멈추라고 했다 — 끝남 사건까지 그 정리의 글은 버린다
let briefNext = false;         // 끝남 사건이 오면 지금 목록을 다시 정리한다
let briefTimer = 0;
const briefCache = new Map();  // 끝난 정리 — 표식 → ai
let idxNote = null;            // 마지막 검색 결과를 보낼 때의 인덱싱 단계 {stage, n, total}
let busy = false;
// 조건 칩 상태 — 같은 검색어 안에서만 유지(새 검색어면 지운다)
//   off = 끈 조건 종류 · widen = 기간을 넓힌 햇수 · labels = 끈 칩을 다시 보이려고 기억한 글
let cond = { q: "", off: [], widen: 0, labels: {} };
const CHIP_ICON = { person: "👤", date: "📅", format: "📄", recv: "📨", scanned: "🖨", type: "🗂", form: "🧾" };

// 최근 검색 — 이 PC 의 이 화면에만 남긴다(지워져도 동작에는 영향 없음)
//   HTML 글로 띄운 화면은 localStorage 가 막혀 있을 수 있어(실측) 메모리 목록을 함께 둔다
let recentMem = Array.isArray(UI_SAVED.recent) ? UI_SAVED.recent.filter((x) => typeof x === "string").slice(0, 8) : [];
function recent() { return recentMem; }
function remember(q) {
  recentMem = [q].concat(recent().filter((x) => x !== q)).slice(0, 8);
  saveUi();
}

//------------------------------------------------------------------
// 화면 상태 저장 — 바뀔 때마다 잠깐 모았다가 앱에 넘긴다(INI [UI] BrowseState)
//   미리 보기 창 · AI 답변창 켜짐, 묶기 · 정렬, 창 나눔 · 열 너비, 최근 검색. 탐색기 창에서만 쓴다
//------------------------------------------------------------------
let uiTimer = 0;
function saveUi() {
  if (LAYOUT !== "window") return;
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => send({ type: "ui_state", state: {
    pv: pvShown, ai: aiOn, group: $("group").value, sort: $("sort").value, asc: sortAsc, lay, recent: recentMem, scope,
  } }), 400);
}

// ── 찾기 ─────────────────────────────────────────────────
// 찾는 중 표시 — 진행률을 알 수 없어 검색창 아래로 흐르는 막대를 쓴다.
//   0.3초 안에 끝나는 검색은 막대를 띄우지 않는다(깜박이지 않게).
//   앞선 인덱싱 작업을 기다리면 1.5초 뒤에 그 까닭을 맨 아래 줄에 알린다
let findTimers = [], findWaits = false;
function setFindBusy(on) {
  busy = on;
  findTimers.forEach(clearTimeout);
  findTimers = [];
  findWaits = false;
  const box = $(LAYOUT === "window" ? "q" : "pq").closest(".search");
  box.classList.remove("finding");
  if (!on) return;
  findTimers.push(setTimeout(() => box.classList.add("finding"), 300));
  findTimers.push(setTimeout(() => { if (findWaits) setStatus("앞선 인덱싱 작업이 끝나는 대로 찾습니다…"); }, 1500));
}

function runFind(q, push) {
  q = (q || "").trim();
  // 기준 문서가 있고 입력란이 비었으면 그 문서로 다시 찾는다
  if (!q && simSrc && !busy) { runSimilar(simSrc.path, push); return; }
  if (!q || busy) return;
  // 검색어로 찾으면 비슷한 문서 찾기를 끝낸다(검색어 + 기준 문서를 함께 쓰는 검색은 하지 않는다)
  if (simSrc) { simSrc = null; drawSrc(); }
  // 워커는 한 번에 한 일만 한다 — 쓰던 정리를 멈춰야 찾기가 기다리지 않는다
  stopBrief();
  // 다른 검색어면 조건 칩에서 고친 것을 버린다
  if (q !== cond.q) cond = { q, off: [], widen: 0, labels: {} };
  lastQ = q;
  setFindBusy(true);
  if (LAYOUT === "window") { $("q").value = q; } else { $("pq").value = q; }
  if (push !== false) {
    hist = hist.slice(0, histPos + 1);
    hist.push({ q, scope });
    histPos = hist.length - 1;
  }
  remember(q);
  setStatus("찾는 중…");
  send({ type: "find", q, folder: scope, off: cond.off, widen: cond.widen, all: LAYOUT === "window" && findAll });
  drawNav();
}

// ── 비슷한 문서 찾기 (plan/비슷한문서찾기_설계서_20261112.html) ─────────────
//   기준 문서 하나 → 사본 · 다른 판 · 내용이 비슷한 문서. 결과는 찾기와 같은 줄 모양(done.kind === "similar")
let simSrc = null;       // 기준 문서 {path, name} — 없으면 일반 찾기
function fileName(p) { return String(p || "").replace(/[\\/]+$/, "").split(/[\\/]/).pop(); }
// 입력란의 기준 문서 칩 — ✕ 를 누르면 처음 화면으로
function drawSrc() {
  const el = $(LAYOUT === "window" ? "src" : "psrc");
  if (!simSrc) { el.classList.add("hidden"); el.innerHTML = ""; return; }
  el.innerHTML = `📄<span title="${esc(simSrc.path)}">${esc(simSrc.name)}</span><button title="비슷한 문서 찾기 끝내기">✕</button>`;
  el.classList.remove("hidden");
  el.querySelector("button").onclick = (e) => { e.stopPropagation(); simSrc = null; resetFind(); };
}
function runSimilar(path, push) {
  if (!path || busy) return;
  stopBrief();
  simSrc = { path, name: fileName(path) };
  // 화면의 "지금 검색" 표시 — 늦게 온 결과를 가리는 데 쓴다(Rust 가 그대로 돌려준다)
  lastQ = "📄 " + simSrc.name;
  cond = { q: lastQ, off: [], widen: 0, labels: {} };
  const inp = $(LAYOUT === "window" ? "q" : "pq");
  inp.value = "";
  drawSrc();
  if (push !== false) {
    hist = hist.slice(0, histPos + 1);
    hist.push({ q: lastQ, scope, sim: path });
    histPos = hist.length - 1;
  }
  setFindBusy(true);
  setStatus("비슷한 문서를 찾는 중…");
  send({ type: "similar", path, q: lastQ, folder: scope });
  drawNav();
}
// [+] — 파일 창은 Rust 가 연다(지원 형식만). 보던 폴더에서 연다
function pickSimilar() {
  if (busy) return;
  send({ type: "similar_pick", dir: scope || (roots[0] && roots[0].path) || "" });
}
// 끌어 놓기 — Rust 가 웹뷰 좌표를 준다. 배율에 따라 물리 · 논리 픽셀일 수 있어 둘 다 맞춰 본다
function overSearch(x, y) {
  const box = $(LAYOUT === "window" ? "q" : "pq").closest(".search");
  const r = box.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const inside = (a, b) => a >= r.left && a <= r.right && b >= r.top && b <= r.bottom;
  return inside(x / dpr, y / dpr) || inside(x, y);
}
function dropMark(a) {
  const box = $(LAYOUT === "window" ? "q" : "pq").closest(".search");
  let hint = box.querySelector(".drophint");
  if (!a) {
    box.classList.remove("dropzone", "dropover");
    if (hint) hint.remove();
    return;
  }
  const over = overSearch(a.x, a.y);
  box.classList.add("dropzone");
  box.classList.toggle("dropover", over);
  if (!hint) { hint = document.createElement("div"); hint.className = "drophint"; box.appendChild(hint); }
  hint.textContent = over ? "놓으면 이 문서와 비슷한 문서를 찾습니다" : "여기(입력란)에 놓으면 비슷한 문서를 찾습니다";
}

// [초기화] — 검색어 · 결과 · AI 정리 · 조건 칩 · 미리 보기를 지우고 처음 화면으로. 찾는 범위(폴더)는 그대로 둔다
//   찾는 중이었으면 늦게 온 결과는 검색어가 달라 onResults 가 버린다
function resetFind() {
  setFindBusy(false);
  stopBrief();
  lastQ = ""; docs = []; done = null; ai = null; selIdx = -1; pendingSelect = null;
  briefCache.clear();
  openDocs.clear(); moreDocs.clear(); cardPick = {};
  cond = { q: "", off: [], widen: 0, labels: {} };
  simSrc = null;
  drawSrc();
  const inp = $(LAYOUT === "window" ? "q" : "pq");
  inp.value = "";
  render();
  redrawAi();
  drawChips();
  if (LAYOUT === "window") {
    setStatus("찾을 내용을 쓰고 Enter");
    $("st3").textContent = ""; $("st4").textContent = "";
    pvTarget = null;
    send({ type: "preview_hide" });
    $("pvtitle").textContent = ""; $("pvtitle").title = ""; $("pvpage").textContent = "";
    $("pvopen").textContent = "문서 열기 ↗"; $("pvopen").disabled = true; $("pvreveal").disabled = true;
    $("pvtext").classList.add("hidden"); $("pvempty").classList.remove("hidden");
  } else {
    setStatus(scope ? `'${pickName()}' 폴더에서 찾습니다` : "모든 검색 폴더에서 찾습니다");
  }
  inp.focus();
}

// Rust 가 /find 결과를 넘긴다
// 결과가 비었을 때 글 — 인덱싱이 끝나지 않았으면 "없다" 가 아니라 "아직 안 들어왔다" 고 알린다
function noResultMsg(q, more) {
  if (simSrc) return `<b>"${esc(simSrc.name)}"</b> 와 비슷한 문서를 찾지 못했습니다.<br>범위를 넓혀 보세요.`;
  const n = idxNote;
  if (n && n.stage === "model") return `<b>AI 모델을 준비하고 있습니다</b><br>끝나면 인덱싱을 시작하고, 그 뒤에 찾을 수 있습니다.`;
  if (n && n.total) return `<b>아직 인덱싱 중입니다</b> (${fmtN(n.n)} / ${fmtN(n.total)})<br>끝나면 더 많은 문서를 찾을 수 있습니다.`;
  if (n) return `<b>문서를 확인하고 있습니다</b><br>끝나면 다시 찾아 보세요.`;
  return `<b>"${esc(q)}"</b> 와 맞는 문서를 찾지 못했습니다.${more}`;
}

function onResults(r) {
  setFindBusy(false);
  if (!r || r.q !== lastQ) { /* 지난 검색의 늦은 결과는 버린다 */ if (r && r.q) return; }
  idxNote = (r && r.indexing) || null;
  if (!r.ok) {
    docs = []; done = null;
    drawChips();
    ai = null; redrawAi();
    const why = String((r.done && r.done.error) || r.why || "워커가 응답하지 않았습니다").replace(/^NOT_INDEXED:\s*/, "");
    showMessage("<b>" + (simSrc ? "비슷한 문서를 찾지 못했습니다" : "찾지 못했습니다") + "</b><br>" + esc(why));
    setStatus(why, true);
    return;
  }
  docs = [];
  const byNo = {};
  for (const l of r.lines) {
    if (l.page === undefined) {
      const d = { meta: l, pages: [] };
      byNo[l.doc] = d;
      docs.push(d);
    } else if (byNo[l.doc]) {
      byNo[l.doc].pages.push(l);
    }
  }
  done = r.done || {};
  // 모두 찾기를 부탁했는데 모르는 워커(옛 빌드)면 체크박스를 숨기고 지금처럼 쓴다
  if (LAYOUT === "window" && findAll && !done.all) $("fawrap").classList.add("hidden");
  grpShut = new Set(done.tiers && done.tiers[0] > 0 ? ["t2"] : []);
  pagesAsked = new Set();
  drawChips();
  openDocs = new Set();
  moreDocs = new Set();
  const first = docs.find((d) => d.pages.length);
  if (first) openDocs.add(first.meta.doc_path);
  selIdx = -1;
  render();
  scheduleBrief();
  // 크게 보기로 넘어온 쪽이 있으면 그 줄을, 아니면 첫 쪽 줄을 고른다
  let target = -1;
  if (pendingSelect) {
    target = rows.findIndex((x) => x.kind === "page" && x.doc.meta.doc_path === pendingSelect.path && x.page.page === pendingSelect.page);
    pendingSelect = null;
  }
  if (target < 0) target = rows.findIndex((x) => x.kind === "page");
  if (target >= 0) select(target, true);
  status();
}

function status() {
  if (!done) return;
  const places = docs.reduce((n, d) => n + d.pages.length, 0);
  const sec = done.ms != null ? (done.ms / 1000).toFixed(2) + "초" : "";
  const sc = scope ? base(scope) : "검색 폴더 전체";
  const sd = done.scope_docs != null ? `(문서 ${done.scope_docs}개)` : "";
  if (done.kind === "similar") {
    const g = done.groups || {};
    const t = `비슷한 문서 ${g.similar || 0}개` + ((g.copy || 0) + (g.version || 0) ? ` · 사본 · 다른 판 ${(g.copy || 0) + (g.version || 0)}개` : "");
    if (LAYOUT === "window") {
      $("st1").textContent = t; $("st1").classList.remove("err");
      $("st2").textContent = sec ? "검색 " + sec : "";
      const s = done.source || {};
      $("st3").textContent = `범위: ${sc}${sd}`;
      $("st4").textContent = s.name ? `기준: ${s.name} (청크 ${s.used}/${s.chunks})` + (s.mode === "same_content" ? " · 같은 내용의 인덱스 문서로" : s.mode === "external" ? " · 인덱스에 없는 문서" + (s.pages_total ? ` — ${s.pages_total}쪽 중 고른 ${s.pages_read}쪽만 읽어 비교` : " — 고른 부분만 비교") : "") : "";
    } else {
      $("pst1").textContent = `${t} · ${sec}`;
    }
    return;
  }
  if (LAYOUT === "window") {
    $("st1").textContent = `문서 ${docs.length}개 · 위치 ${done.all && done.places != null ? done.places : places}곳`;
    $("st1").classList.remove("err");
    $("st2").textContent = sec ? "검색 " + sec : "";
    $("st3").textContent = `범위: ${sc}${sd}`;
    $("st4").textContent = done.synonyms ? "검색어 넓힘: " + done.synonyms.join(", ") : "";
  } else {
    $("pst1").textContent = `문서 ${docs.length}개 · 위치 ${places}곳 · ${sec}`;
  }
}

// ── 조건 칩 ─────────────────────────────────────────────
//   ✕ = 그 조건 끄고 다시 찾기 · ↺ = 다시 켜기 · ±1년 = 기간 넓히기(연도가 파일 날짜가 아니라 내용일 때)
function drawChips() {
  const box = LAYOUT === "window" ? $("chips") : $("pchips");
  const m = done && done.meta;
  if (!m && !cond.off.length) { box.classList.add("hidden"); box.innerHTML = ""; return; }
  let h = `<span class="lbl">조건</span>`;
  const seen = {};
  for (const c of (m ? m.chips : [])) {
    // 같은 종류 칩이 여럿(사람 둘)이면 끈 칩 글은 이어 붙여 기억한다
    cond.labels[c.kind] = seen[c.kind] ? cond.labels[c.kind] + " · " + c.label : c.label;
    seen[c.kind] = true;
    const tip = c.mode === "filter" ? "이 조건에 맞는 문서만 찾습니다" : "이 조건에 맞는 문서를 위로 올립니다";
    const wide = c.kind === "date" && cond.widen < 3 ? `<button class="w" data-widen="1" title="기간을 앞뒤 1년 더 넓혀 다시 찾기">±1년</button>` : "";
    h += `<span class="chip ${c.mode === "filter" ? "" : "soft"}" title="${tip}"><span class="lb">${CHIP_ICON[c.kind] || ""} ${esc(c.label)}</span>${wide}<button data-off="${esc(c.kind)}" title="이 조건을 끄고 다시 찾기">✕</button></span>`;
  }
  for (const k of cond.off) {
    h += `<span class="chip off" title="끈 조건 — ↺ 로 다시 켭니다"><span class="lb">${CHIP_ICON[k] || ""} ${esc(cond.labels[k] || k)}</span><button data-on="${esc(k)}" title="다시 켜기">↺</button></span>`;
  }
  if (m && m.docs != null) h += `<span class="note">· 문서 ${m.docs}개에서</span>`;
  if (m && m.relaxed && m.relaxed.length) h += `<span class="relax">· 맞는 문서가 없어 조건을 풀어 찾음: ${esc(m.relaxed.join(", "))}</span>`;
  box.innerHTML = h;
  box.classList.remove("hidden");
  const again = () => { if (lastQ) runFind(lastQ, false); };
  box.querySelectorAll("[data-off]").forEach((b) => { b.onclick = () => { cond.off.push(b.dataset.off); again(); }; });
  box.querySelectorAll("[data-on]").forEach((b) => { b.onclick = () => { cond.off = cond.off.filter((k) => k !== b.dataset.on); again(); }; });
  box.querySelectorAll("[data-widen]").forEach((b) => { b.onclick = () => { cond.widen += 1; again(); }; });
}
// 문서 줄 관련인 — "👤 고봉수 · 조강래" (작성 → 수정 순, 최대 3명)
function whoOf(m) { return m.people && m.people.length ? "👤 " + m.people.join(" · ") : ""; }
// 문서 줄 풍선 도움말 — 경로 + (파일 이름과 다르면) 문서 제목
function tipOf(m) { return m.doc_path + (m.title && !m.doc_name.includes(m.title) ? "\n제목: " + m.title : ""); }

function setStatus(t, err) {
  const el = LAYOUT === "window" ? $("st1") : $("pst1");
  el.textContent = t;
  el.classList.toggle("err", !!err);
  if (LAYOUT === "window") { $("st2").textContent = ""; }
}

// ── 그리기 공통 ──────────────────────────────────────────
function marked(text, marks) {
  const ch = Array.from(text || "");
  if (!marks || !marks.length) return esc(text);
  let out = "", at = 0;
  for (const [a, b] of marks) {
    if (a < at) continue;
    out += esc(ch.slice(at, a).join("")) + "<mark>" + esc(ch.slice(a, b).join("")) + "</mark>";
    at = b;
  }
  return out + esc(ch.slice(at).join(""));
}
// 관련도 막대 구간 — 5칸 · 4칸 · 3칸 · 2칸의 최저 리랭커 점수(그 아래는 1칸). 쓰면서 조정할 제안값이다
const REL_BARS = [5, 3, 1, -2];
function bars(score, low) {
  // 리랭커 점수의 절대 구간으로 5칸 막대 — 결과가 전부 나쁘면 1등도 낮게 보이도록. 수치는 마우스를 올리면 보인다
  //   -50 아래는 리랭킹하지 않은 후보다(find.rs 가 순서만 잡으려고 -100 대 값을 준다)
  const unscored = score != null && score < -50;
  const at = REL_BARS.findIndex((v) => score >= v);
  const n = score == null || unscored || low || at < 0 ? 1 : 5 - at;
  const tip = score == null ? "관련도 수치 없음 — 이름 · 조건으로 찾은 문서"
    : unscored ? "관련도 채점 안 됨 — 앞쪽 후보만 채점합니다"
    : `관련도 ${Number(score).toFixed(2)}${low ? " (낮음)" : ""}`;
  let h = `<span class="rel" title="${esc(tip)}">`;
  for (let i = 0; i < 5; i++) h += `<i class="${i < n ? "f" : ""}"></i>`;
  return h + "</span>";
}
// 비슷한 문서 유사도 막대 — 청크별 최고 유사도의 평균(%). e5 는 관계없는 글도 45~50% 가 나와 그 위를 5칸으로 나눈다(제안값)
const SIM_BARS = [70, 63, 57, 52];
function simBars(pct) {
  const at = SIM_BARS.findIndex((v) => pct >= v);
  const n = at < 0 ? 1 : 5 - at;
  let h = `<span class="rel" title="유사도 ${Math.round(pct)}% — 기준 문서의 고른 부분마다 가장 비슷한 곳의 평균">`;
  for (let i = 0; i < 5; i++) h += `<i class="${i < n ? "f" : ""}"></i>`;
  return h + "</span>";
}
// 사본 · 다른 판 줄의 설명 — 본문 비교로 판정했으면 "본문 N% 같음", 유사도로 판정했으면 "내용 N% 비슷"
function verLabel(m) {
  if (m.group === "copy") return "사본(내용 같음)";
  return m.near != null ? `다른 판 · 내용 ${Math.round(m.near)}% 비슷` : `다른 판 · 본문 ${Math.round((m.overlap || 0) * 100)}% 같음`;
}
function pageLabel(p) {
  if (p.page == null) return "";
  const to = p.page_to != null && p.page_to > p.page && !p.exact ? "–" + p.page_to : "";
  return `<span class="pgchip ${p.exact ? "" : "approx"}" title="${p.exact ? "" : "근사 쪽"}">p.${p.page}${to}</span>`;
}
function dateOf(m) {
  if (!m.mtime) return "";
  const d = new Date(m.mtime * 1000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
// 문서 아이콘 — 확장자별(PDF · Word · Excel · PowerPoint · 한글 · 웹 · 파이썬 · 마크다운, 그 밖은 일반 문서)
const EXT_ICON = { pdf: "i-pdf", doc: "i-word", docx: "i-word", xls: "i-excel", xlsx: "i-excel", ppt: "i-ppt", pptx: "i-ppt",
  hwp: "i-hwp", hwpx: "i-hwp", html: "i-web", htm: "i-web", py: "i-code", ipynb: "i-code", md: "i-md" };
function docIcon(path) {
  const ext = (String(path || "").match(/\.([a-z0-9]+)$/i) || [])[1] || "";
  return `<svg width="16" height="16"><use href="#${EXT_ICON[ext.toLowerCase()] || "i-doc"}"/></svg>`;
}
// 정렬 — 기준(sort 상자 · 열 머리글)과 방향(asc). 기준을 바꾸면 그 기준의 기본 방향으로
//   이름은 가나다(오름), 관련도 · 수정한 날짜는 높은 것 · 최근 것(내림)이 먼저
const SORT_ASC_DEF = { name: true, score: false, date: false };
let sortAsc = false;
function sortKey() { return LAYOUT === "window" ? $("sort").value : "score"; }
// 파일 이름 비교 — Windows 탐색기와 같은 순서: 기호 → 숫자 → 영문 → 한글, 숫자는 값으로(2 < 10), 대소문자 무시
//   ko 비교만 쓰면 한글이 영문보다 앞에 와서 탐색기와 순서가 달랐다
const NAME_COLL = new Intl.Collator("ko", { numeric: true, sensitivity: "base" });
function nameClass(ch) {
  if (ch == null) return -1;
  if (/[0-9]/.test(ch)) return 1;
  if (/[a-z]/i.test(ch)) return 2;
  if (/[가-힣ㄱ-ㆎ]/.test(ch)) return 3;
  return 0;
}
function fileNameCmp(a, b) {
  // 처음 다른 글자의 종류가 다르면 종류 순으로, 같으면 Collator(숫자 덩어리는 값으로)
  let i = 0;
  while (i < a.length && i < b.length && a[i].toLowerCase() === b[i].toLowerCase()) i++;
  const ca = nameClass(a[i]), cb = nameClass(b[i]);
  if (ca !== cb && ca >= 0 && cb >= 0) return ca - cb;
  return NAME_COLL.compare(a, b);
}
// 두 값 비교 — 값이 없는 것(점수 · 날짜 모름)은 방향과 상관없이 맨 뒤
function cmpBy(a, b, asc) {
  if (a == null && b == null) return 0;
  if (a == null) return 1;
  if (b == null) return -1;
  const c = typeof a === "string" ? fileNameCmp(a, b) : a - b;
  return asc ? c : -c;
}
function sortedDocs(list) {
  const s = sortKey(), v = list.slice();
  // 같은 값이면 원래(관련도) 순서를 지킨다 — Array.sort 는 안정 정렬
  const val = (d) => s === "name" ? d.meta.doc_name : s === "date" ? d.meta.mtime || null : d.meta.score;
  if (s !== "score" || sortAsc) v.sort((a, b) => cmpBy(val(a), val(b), sortAsc));
  return v;
}
// 한 문서 안 쪽 줄 — 관련도로 정렬할 때만 방향을 따른다(그 밖에는 관련도 높은 쪽부터)
function sortedPages(d) {
  return sortKey() === "score" && sortAsc ? d.pages.slice().sort((a, b) => cmpBy(a.score, b.score, true)) : d.pages;
}
// 열 머리글 누르기 — 같은 열이면 방향만 뒤집고, 다른 열이면 그 열의 기본 방향으로
function sortBy(k) {
  if ($("sort").value === k) sortAsc = !sortAsc;
  else { $("sort").value = k; sortAsc = SORT_ASC_DEF[k]; }
  render();
  saveUi();
}
// 환영 화면의 [검색 폴더 고르기] — 왼쪽 아래 [＋ 폴더 추가] 와 같은 일(목록이 다시 그려져도 듣도록 문서에 건다)
document.addEventListener("click", (e) => {

});
function showMessage(html) {
  const box = LAYOUT === "window" ? $("list") : $("cards");
  box.innerHTML = `<div class="msg">${html}</div>`;

}

// ── 그리기: 독립 창 목록 ─────────────────────────────────
function render() {
  if (LAYOUT !== "window") return renderCards();
  rows = [];
  const L = $("list");
  if (!docs.length) {
    showMessage(lastQ ? noResultMsg(lastQ, "<br>다른 말로 바꾸거나 범위를 넓혀 보세요.") : welcome());
    return;
  }
  // 머리글 경계(.cg)를 끌면 오른쪽 열 너비가 바뀐다 — 이름 · 위치 · 내용 열은 남는 너비를 채운다
  const cg = (k) => `<i class="cg" data-col="${k}" title="끌어서 열 너비 바꾸기 (두 번 누르면 처음대로)"></i>`;
  // 이름 · 관련도 · 수정한 날짜 머리글은 눌러 정렬(▲ 오름 · ▼ 내림)
  const sk = sortKey();
  // 정렬 칸 — 칸(span) 전체에 data-sort 를 건다. 경계 손잡이(.cg)는 누름을 칸으로 넘기지 않는다
  const hc = (k, label, grip) => `<span class="hc ${sk === k ? "on" : ""}" data-sort="${k}" title="눌러서 ${label} 순으로 정렬 (다시 누르면 반대로)">${grip || ""}${label}${sk === k ? (sortAsc ? " ▲" : " ▼") : ""}</span>`;
  let h = `<div class="cols">${hc("name", "이름 · 위치 · 내용")}<span>${cg("page")}쪽</span>${hc("score", "관련도", cg("rel"))}${hc("date", "수정한 날짜", cg("date"))}</div>`;
  const byName = docs.filter((d) => d.meta.name_hit);
  const content = docs.filter((d) => d.pages.length);
  // 조건만 있는 질의(본문 검색어 없음) — 조건에 맞는 문서 줄만 온다
  const byMeta = docs.filter((d) => d.meta.meta_hit && !d.pages.length && !d.meta.name_hit);
  const places = content.reduce((n, d) => n + d.pages.length, 0);
  // 묶음 머리 — 누르면 접고 펼친다. 접힌 묶음은 줄을 그리지 않는다
  const head = (key, label, n, unit, cls, extra) => `<div class="grp ${cls || ""}"><button class="gh" data-grp="${key}" title="눌러서 ${grpShut.has(key) ? "펼치기" : "접기"}">`
    + `<span class="ga">${grpShut.has(key) ? "▸" : "▾"}</span>${label}<span class="gc">${unit || `문서 ${n}개`}</span></button>${extra || ""}</div>`;
  const open = (key) => !grpShut.has(key);
  if (done && done.kind === "similar") {
    // 비슷한 문서 찾기 — ① 사본 · 다른 판 ② 내용이 비슷한 문서(펼치면 비슷한 문단 짝)
    const vers = docs.filter((d) => d.meta.group === "copy" || d.meta.group === "version");
    const sims = docs.filter((d) => d.meta.group === "similar");
    if (vers.length) {
      h += head("sv", "사본 · 같은 문서의 다른 판", vers.length);
      if (open("sv")) for (const d of sortedDocs(vers)) h += docRow(d, true, verLabel(d.meta));
    }
    if (sims.length) {
      h += head("ss", "내용이 비슷한 문서", sims.length);
      if (open("ss")) for (const d of sortedDocs(sims)) {
        h += docRow(d, false);
        if (openDocs.has(d.meta.doc_path)) for (const p of d.pages) h += pageRow(d, p, false);
      }
    }
  } else if ($("group").value === "page") {
    // 쪽 목록 — 모든 쪽 줄을 관련도 순으로 한 줄씩(문서 이름을 함께). 모두 찾기면 나머지 쪽도 가져온다
    askPages(content.filter((d) => d.meta.pages_left > 0).map((d) => d.meta.doc_path));
    const all = [];
    for (const d of content) for (const p of d.pages) all.push({ d, p });
    // 정렬 기준을 따른다 — 관련도는 쪽 점수, 이름 · 날짜는 그 쪽의 문서(같으면 쪽 점수 높은 것부터)
    const pv = ({ d, p }) => sk === "name" ? d.meta.doc_name : sk === "date" ? d.meta.mtime || null : p.score;
    all.sort((a, b) => cmpBy(pv(a), pv(b), sortAsc) || cmpBy(a.p.score, b.p.score, false));
    h += head("pg", "내용 일치", 0, `위치 ${all.length}곳`);
    if (open("pg")) for (const { d, p } of all) h += pageRow(d, p, true);
  } else {
    if (byMeta.length) {
      h += head("meta", "조건 일치", byMeta.length);
      if (open("meta")) for (const d of sortedDocs(byMeta)) h += docRow(d, true, "조건 일치");
    }
    if (byName.length) {
      h += head("name", "파일 이름 일치", byName.length);
      if (open("name")) for (const d of sortedDocs(byName)) h += docRow(d, true);
    }
    // 문서와 펼친 쪽 줄 — 남은 쪽(모두 찾기 pages_left)도 더 보기 수에 넣는다
    const docBlock = (d) => {
      let b = docRow(d, false);
      if (!openDocs.has(d.meta.doc_path)) return b;
      const pgs = sortedPages(d);
      const show = moreDocs.has(d.meta.doc_path) ? pgs : pgs.slice(0, 3);
      for (const p of show) b += pageRow(d, p, false);
      const left = d.pages.length - show.length + (d.meta.pages_left || 0);
      if (left > 0) b += `<div class="more"><button data-more="${esc(d.meta.doc_path)}">＋ ${left}곳 더 보기</button></div>`;
      return b;
    };
    if (content.length && done && done.all) {
      // 모두 찾기 — ① 모두 포함 · ② 일부 포함(접힘) · ③ 비슷한 내용
      const t = (n) => content.filter((d) => d.meta.tier === n);
      const [t1, t2, t3] = [t(1), t(2), t(3)];
      if (t1.length) {
        h += head("t1", "검색어 모두 포함", t1.length, "", "tier");
        if (open("t1")) for (const d of sortedDocs(t1)) h += docBlock(d);
      }
      if (t2.length) {
        h += head("t2", "검색어 일부 포함", t2.length, "", "tier");
        if (open("t2")) for (const d of sortedDocs(t2)) h += docBlock(d);
      }
      if (t3.length) {
        h += head("t3", "비슷한 내용", t3.length, "", "tier");
        if (open("t3")) for (const d of sortedDocs(t3)) h += docBlock(d);
      }
    } else if (content.length) {
      // 체크를 끈 경우 — 지금처럼. 잘렸을 수 있으니 모두 찾기로 바로 켜는 링크를 둔다
      const link = LAYOUT === "window" && !findAll && !$("fawrap").classList.contains("hidden")
        ? ` · <button class="tg" data-allon="1">검색어가 든 문서 모두 보기</button>` : "";
      h += head("ct", "내용 일치", 0, `문서 ${content.length}개 · 위치 ${places}곳`, "", link);
      if (open("ct")) for (const d of sortedDocs(content)) h += docBlock(d);
    }
  }
  L.innerHTML = h;
  L.querySelectorAll("[data-col]").forEach(bindColGrip);
  L.querySelectorAll("[data-sort]").forEach((el) => { el.onclick = () => sortBy(el.dataset.sort); });
  L.querySelectorAll("[data-row]").forEach((el) => {
    const i = +el.dataset.row;
    el.onclick = () => select(i, true);
    el.ondblclick = () => activate(i);
    el.oncontextmenu = (e) => { e.preventDefault(); select(i, false); showMenu(e.clientX, e.clientY, rows[i]); };
  });
  L.querySelectorAll("[data-tw]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); toggleDoc(rows[+el.dataset.tw].doc); };
  });
  L.querySelectorAll("[data-more]").forEach((el) => {
    el.onclick = () => {
      moreDocs.add(el.dataset.more);
      const d = docs.find((x) => x.meta.doc_path === el.dataset.more);
      if (d && d.meta.pages_left > 0) askPages([d.meta.doc_path]);
      render();
    };
  });
  L.querySelectorAll("[data-grp]").forEach((el) => {
    el.onclick = () => { const k = el.dataset.grp; if (grpShut.has(k)) grpShut.delete(k); else grpShut.add(k); render(); };
  });
  L.querySelectorAll("[data-allon]").forEach((el) => { el.onclick = () => setFindAllOn(true); });
  if (selIdx >= 0 && selIdx < rows.length) markSel();
}
function docRow(d, nameGroup, why) {
  const i = rows.push({ kind: "doc", doc: d }) - 1;

  const open = openDocs.has(m.doc_path);

  const cnt = why ? `· ${why}` : m.group === "similar" ? `· 비슷한 곳 ${d.pages.length}` + (m.copies ? ` · 같은 문서 ${m.copies.length}곳 더` : "")
    : nameGroup ? `· 이름에 검색어` : m.low ? `· 관련 낮음` : `· ${d.pages.length + (m.pages_left || 0)}곳`;
  const who = whoOf(m);

    <span class="n">${tw}${docIcon(m.doc_path)}<span class="t">${esc(m.doc_name)}</span><span class="cnt">${cnt}</span>${who ? `<span class="who">${esc(who)}</span>` : ""}</span>
    <span></span><span>${m.group === "similar" ? simBars(m.pct) : m.group ? "" : bars(m.score == null && m.tier ? -100 : m.score, m.low)}</span><span class="date">${dateOf(m)}</span></div>`;
}
function pageRow(d, p, withDoc) {

}

function toggleDoc(d) {

  const cur = rows[selIdx];

// 나머지 쪽 줄 부탁하기 — 이미 부탁한 문서는 빼고 한 번에
function askPages(paths) {
  const want = paths.filter((p) => !pagesAsked.has(p));
  if (!want.length || !done || !done.kws) return;
  want.forEach((p) => pagesAsked.add(p));
  send({ type: "find_doc", q: lastQ, kws: done.kws, paths: want });
}
// 모두 찾기 켜고 끄기 — 체크 · 링크 공통. 이 PC 에 기억하고 지금 검색어로 다시 찾는다
function setFindAllOn(on) {

  send({ type: "find_all", on: findAll });
  if (lastQ) runFind(lastQ, false);
}

function markSel() {

function select(i, preview) {

// 문서 줄이면 그 문서의 가장 관련 높은 쪽을 쓴다

  let h = esc(text);

// 폴더 오른쪽 클릭 메뉴 — 폴더 열기, 허락을 기다리는 인덱싱 폴더면 지금 인덱싱
function showFolderMenu(x, y, path) {

  if (r && (r.waiting || r.waiting_del)) items.push(["지금 인덱싱", () => send({ type: "index_now", path })]);
  if (r) items.push(["폴더 빼기", () => removeRoot(r)]);

  else if (isExcluded(path) === "self") items.push(["폴더 다시 넣기", () => send({ type: "exclude_folder", path, on: false })]);
  else if (!isExcluded(path)) items.push(["폴더 빼기", () => excludeSub(path)]);
