<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>RAGSearchBox-rs 설정</title>
<!--
  설정 창 (Python info_window.py)
  - 모델 정보(1초마다 새 값) · 모델 내리기/다시 올리기
  - 인덱싱 폴더 [추가…] [빼기] [다시 확인]
  - 탭 두 개: 기본(위 항목들) · 동의어(후보 [맞음] [아님] · 직접 추가 · [후보 만들기] · 승인한 목록 [빼기])
    (동의어 설계서 4단계, Python info_window 와 같은 구성)
  - 자동 시작 · 로그 폴더 [열기] · 화면 열기 · 닫기
-->
<style>
  :root { --fs: __FONT_PX__px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; font-family: "Malgun Gothic", "맑은 고딕", sans-serif; font-size: var(--fs); color: #1f1f1f; }
  body { padding: 12px 14px; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; vertical-align: top; color: #475063; padding: 3px 12px 3px 0; white-space: nowrap; }
  td { padding: 3px 0; vertical-align: top; word-break: break-all; }
  button { font: inherit; padding: 2px 10px; margin: 0 4px 4px 0; background: #fff; border: 1px solid #b9c0cc; border-radius: 3px; cursor: pointer; }
  button:disabled { color: #9aa1ad; cursor: default; }
  .note { color: #647083; white-space: pre-line; }
  select { width: 100%; font: inherit; border: 1px solid #d7dbe3; }
  .row { display: flex; gap: 8px; }
  .row .grow { flex: 1; }
  .col button { display: block; width: 100%; }
  .foot { display: flex; justify-content: space-between; margin-top: 12px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid #b9c0cc; margin-bottom: 10px; }
  .tabs button { margin: 0 0 -1px 0; border-radius: 4px 4px 0 0; border-bottom: none; padding: 3px 14px; background: #f1f3f6; }
  .tabs button.on { background: #fff; border-bottom: 1px solid #fff; font-weight: bold; }
  .hidden { display: none; }
  .lead { color: #475063; margin-bottom: 6px; }
  .syn { margin-bottom: 4px; }
  .syn .top { display: flex; align-items: center; gap: 4px; }
  .syn .top b { white-space: nowrap; }
  .syn .top select { width: auto; min-width: 9em; }
  .syn .top .sp { flex: 1; }
  .syn .top button { margin: 0 0 0 4px; }
  input[type=text] { font: inherit; border: 1px solid #b9c0cc; padding: 1px 4px; width: 8em; }
</style>
</head>
<body>
<div class="tabs"><button id="t_basic" class="on">기본</button><button id="t_syn">동의어</button></div>
<div id="tab_basic">
<table>
  <tr><th>생성 모델</th><td id="v_model"></td></tr>
  <tr><th>임베딩 모델</th><td id="v_embed"></td></tr>
  <tr><th>리랭킹 모델</th><td id="v_rerank"></td></tr>
  <tr><th>생성 백엔드</th><td id="v_gen"></td></tr>
  <tr><th></th><td><button id="b_unload">모델 내리기 (인덱싱 전에)</button><button id="b_reload">모델 다시 올리기</button>
    <div class="note" id="actnote"></div></td></tr>
  <tr><th>인덱싱 폴더</th><td>
    <div class="row"><div class="grow"><select id="folders" size="3"></select></div>
      <div class="col"><button id="b_add">추가…</button><button id="b_remove">빼기</button><button id="b_rescan">다시 확인</button></div></div>
    <div class="note" id="foldernote"></div></td></tr>
  <tr><th>자동 시작</th><td><label><input type="checkbox" id="autorun"> 로그인할 때 자동으로 시작</label></td></tr>
  <tr><th>로그 폴더</th><td><div class="row"><div class="grow" id="logdir"></div><button id="b_logs">열기</button></div></td></tr>
</table>
</div>
<div id="tab_syn" class="hidden">
  <div class="lead">답을 못 찾은 질문에서 뽑은 후보예요. 맞으면 승인하세요 — 다음 질문부터 바로 적용됩니다.</div>
  <div id="synrows"></div>
  <div class="row" style="align-items:center; margin-top:8px"><input type="text" id="syn_w" placeholder="일상어"> → <input type="text" id="syn_t" placeholder="문서 용어">
    <button id="b_syn_add">직접 추가</button><div class="grow"></div><button id="b_syn_suggest">후보 만들기</button></div>
  <div class="note" id="synnote"></div>
  <div style="margin-top:10px; color:#475063; font-weight:bold">승인한 동의어</div>
  <div class="row"><div class="grow"><select id="synlist" size="4"></select></div><div class="col"><button id="b_syn_remove">빼기</button></div></div>
</div>
<div class="foot"><button id="b_open">화면 열기</button><button id="b_close">닫기</button></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const send = (o) => window.ipc.postMessage(JSON.stringify(o));
let folders = null;
const UP = "모델이 올라가 있지 않음";

window.rsb = {
  // Rust 가 1초마다 넣어 주는 값
  update(info) {
    $("v_model").textContent = info.model || UP;
    $("v_embed").textContent = info.embed_model || UP;
    $("v_rerank").textContent = [info.rerank_model, info.rerank].filter(Boolean).join(" · ") || UP;
    $("v_gen").textContent = info.gen || UP;
    const up = info.model_up;
    $("b_unload").disabled = !(up === true);
    $("b_reload").disabled = !(up === false);
    $("actnote").textContent = info.action_msg || "";
    const fs = info.folders || [];
    if (JSON.stringify(fs) !== JSON.stringify(folders)) {
      folders = fs;
      const sel = $("folders"); sel.innerHTML = "";
      for (const f of fs) { const o = document.createElement("option"); o.textContent = f; o.value = f; sel.appendChild(o); }
    }
    let note = !fs.length ? "인덱싱할 폴더가 없습니다 — [추가…] 로 고르세요"
      : (info.docs == null ? "" : "인덱싱된 문서 " + Number(info.docs).toLocaleString() + "건");
    if (info.folder_msg) note = (note ? note + "\n" : "") + info.folder_msg;
    $("foldernote").textContent = note;
    if (typeof info.autorun === "boolean") $("autorun").checked = info.autorun;
    $("logdir").textContent = info.log_dir || "";
    if (info.syn) drawSyn(info.syn);
  },
};

// 탭 바꾸기 — 기본 · 동의어
function showTab(name) {
  for (const t of ["basic", "syn"]) {
    $("tab_" + t).classList.toggle("hidden", t !== name);
    $("t_" + t).classList.toggle("on", t === name);
  }
}
$("t_basic").onclick = () => showTab("basic");
$("t_syn").onclick = () => showTab("syn");

// 동의어 탭 — 후보 줄·승인 목록은 바뀌었을 때만 다시 그린다(고른 문서 용어·고른 줄이 매초 풀리지 않게)
let synSig = null, listSig = null, lastAdd = null, pairs = [];
function drawSyn(syn) {
  // 탭 이름에 남은 후보 수 — 기본 탭을 보고 있어도 후보가 쌓인 걸 알 수 있게
  $("t_syn").textContent = syn.n_left ? "동의어 (" + syn.n_left + ")" : "동의어";
  const ls = JSON.stringify(syn.approved || []);
  if (ls !== listSig) {
    listSig = ls; pairs = syn.approved || [];
    const sel = $("synlist"); sel.innerHTML = "";
    for (const [w, t] of pairs) { const o = document.createElement("option"); o.textContent = w + "  →  " + t; sel.appendChild(o); }
  }
  const sig = JSON.stringify(syn.rows || []);
  if (sig !== synSig) {
    synSig = sig;
    const box = $("synrows"); box.innerHTML = "";
    for (const row of syn.rows || []) {
      const d = document.createElement("div"); d.className = "syn";
      const top = document.createElement("div"); top.className = "top";
      const b = document.createElement("b"); b.textContent = row.word + "  →"; top.appendChild(b);
      const sel = document.createElement("select");
      for (const t of row.terms) { const o = document.createElement("option"); o.textContent = t; o.value = t; sel.appendChild(o); }
      top.appendChild(sel);
      const sp = document.createElement("div"); sp.className = "sp"; top.appendChild(sp);
      const ok = document.createElement("button"); ok.textContent = "✓ 맞음";
      ok.onclick = () => send({ type: "syn_approve", word: row.word, term: sel.value });
      const no = document.createElement("button"); no.textContent = "✕ 아님";
      no.onclick = () => send({ type: "syn_reject", word: row.word, term: sel.value });
      top.appendChild(ok); top.appendChild(no);
      const why = document.createElement("div"); why.className = "note";
      // 고른 문서 용어가 나오는 문서를 회색 줄에 보인다
      const showWhy = () => {
        const docs = (row.docs || {})[sel.value] || [];
        why.textContent = "놓친 질문: \"" + row.example + "\"" + (docs.length ? " · '" + sel.value + "' 이 나오는 문서: " + docs.join(", ") : "");
      };
      sel.onchange = showWhy; showWhy();
      d.appendChild(top); d.appendChild(why); box.appendChild(d);
    }
  }
  $("synnote").textContent = syn.note || "";
  // 직접 추가가 받아들여졌으면 칸을 비운다(거절되면 고칠 수 있게 그대로 둔다)
  if (lastAdd && (syn.note || "").includes(lastAdd[0] + " → " + lastAdd[1])) {
    $("syn_w").value = ""; $("syn_t").value = ""; lastAdd = null;
  }
}
$("b_syn_add").onclick = () => {
  const w = $("syn_w").value.trim(), t = $("syn_t").value.trim();
  lastAdd = [w, t];
  send({ type: "syn_approve", word: w, term: t });
};
$("b_syn_suggest").onclick = () => send({ type: "syn_suggest" });
$("b_syn_remove").onclick = () => {
  const i = $("synlist").selectedIndex;
  if (i < 0) { send({ type: "syn_msg", msg: "뺄 동의어를 목록에서 고르세요" }); return; }
  send({ type: "syn_remove", word: pairs[i][0], term: pairs[i][1] });
};
$("b_unload").onclick = () => send({ type: "unload" });
$("b_reload").onclick = () => send({ type: "reload" });
$("b_add").onclick = () => send({ type: "add_folder" });
$("b_remove").onclick = () => {
  const sel = $("folders");
  if (sel.selectedIndex < 0) { send({ type: "folder_msg", msg: "뺄 폴더를 목록에서 고르세요" }); return; }
  const f = folders[sel.selectedIndex];
  if (!confirm(f + "\n\n이 폴더를 빼면 그 안 문서가 인덱스에서 빠집니다(원본 파일은 그대로).\n계속할까요?")) return;
  send({ type: "remove_folder", folder: f });
};
$("b_rescan").onclick = () => send({ type: "rescan" });
$("autorun").onchange = () => send({ type: "autorun" });
$("b_logs").onclick = () => send({ type: "open_logs" });
$("b_open").onclick = () => send({ type: "open" });
$("b_close").onclick = () => send({ type: "hide" });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") send({ type: "hide" }); });
send({ type: "ready" });
</script>
</body>
</html>
