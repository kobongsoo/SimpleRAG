[package]
name = "simplerag"
version = "0.1.0"
edition = "2021"
description = "SimpleRAG(로컬 문서 RAG) 의 Rust 판 — Python simplerag CLI 와 같은 입출력"

[lib]
name = "simplerag"
path = "src/lib.rs"

[[bin]]
name = "simplerag-rs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9"
regex = "1"
fancy-regex = "0.14"
once_cell = "1"
# ONNX 임베딩·리랭커 — onnxruntime.dll 을 실행 시점에 적재한다(Python 판과 같은 1.29 DLL)
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# 벡터 저장 — Qdrant local 대신 sqlite 한 파일(벡터 f32 + payload JSON)
rusqlite = { version = "0.32", features = ["bundled"] }
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
flate2 = "1"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cfb = "0.10"
calamine = { version = "0.30", features = ["dates"] }
libloading = "0.8"
unicode-normalization = "0.1"
html-escape = "0.2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }
