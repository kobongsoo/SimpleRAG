# SimpleRAG 설정 — 검색·청킹 계수 (REPORT §35)
#
# 우선순위: 환경변수 > 이 파일 > 코드 기본값
# 찾는 위치: SIMPLERAG_CONFIG 로 지정한 파일 → <데이터 폴더>/config.yaml → <프로그램 폴더>/config.yaml
#            (SIMPLERAG_CONFIG=- 이면 이 파일을 무시하고 코드 기본값을 쓴다)
# 값을 비워 두거나(키: ) 줄 앞에 # 를 붙이면 코드 기본값을 쓴다.
# 오타나 범위 밖 값은 무시하지 않고, 시작할 때 무엇이 틀렸는지 알려 주고 멈춘다.
#
# 아래 값은 모두 실측으로 정한 현재 기본값이다(근거는 doc/04_구현_명세.md §11).
#
# ⚠️ chunk 항목을 바꾸면 전체 재인덱싱이 필요하다:  index --dir <폴더> --rebuild
#    청크 설정이 인덱스와 다른 채로 증분 index 를 돌리면, 옛 청크와 섞이지 않게 거부한다.
# ⚠️ bm25_k1 / bm25_b 는 다음 index 실행 때(증분이어도 BM25 는 전체를 다시 만든다) 반영된다.
#    나머지(retrieval 의 후보 수·rrf_k·dedup, rerank, generation)는 다음 실행부터 바로 반영된다.

chunk:
  tokens: 128                   # 청크 크기(토큰, e5 토크나이저 기준, [문서명 > 절] 접두 포함). 16~510
  overlap: 16                   # 긴 절을 안에서 쪼갤 때만 겹치는 토큰 수. 비우면 tokens/8(최소 8)
  mode: structured              # structured(절 경계를 지켜 자름) | fixed(고정 크기로 자름)
  min_tokens: 16                # 이보다 짧은 꼬리 조각은 버린다
  table_header_max_tokens: 64   # 표 조각에 다시 붙이는 머리글 줄의 최대 길이. 넘으면 붙이지 않는다(0 = 안 붙임)

extract:
  engine: blocks                # 추출 엔진. blocks(문서 구조를 블록으로 읽음, 2026-10-22 전환) | legacy(예전 평문 추출)
                                #   골든셋 v2: 근거 포함 93→101, 1.7B 정답 67→80 (plan/골든셋v2_추출엔진_비교.html)
                                #   ⚠️ 바꾸면 전체 재인덱싱 필요:  index --dir <폴더> --rebuild
  pdf_headings: false           # [실험 · 기본 끔] PDF 제목을 글자 크기로 추정한다(재설계서 P-2).
                                #   PDF 에는 '제목' 표시가 없어 평소에는 "제5조", "1.2" 같은 번호 규칙으로만 찾는다.
                                #   켜면 본문보다 12% 이상 큰 짧은 줄도 제목으로 보고, 번호 제목은 그 아래 수준에 둔다.
                                #   골든셋 v2: PDF 근거 포함 21→24 로 출처 경로는 정확해졌지만 정답은 1.7B 80→76.
                                #   ⚠️ 절 나누기가 바뀌므로 바꾸면 전체 재인덱싱 필요:  index --dir <폴더> --rebuild

retrieval:
  dense_top_k: 10               # 코사인(dense) 검색 후보 수
  bm25_top_k: 10                # BM25 검색 후보 수 (0 이면 BM25 를 쓰지 않고 dense 만)
  rrf_k: 60                     # RRF 순위 완충 상수 — 점수 = Σ 1 / (rrf_k + 순위)
  bm25_k1: 1.5                  # BM25 단어 빈도 포화 계수
  bm25_b: 0.75                  # BM25 문서 길이 정규화 (0~1)
  dedup: true                   # 내용이 같은 청크(공백 무시)를 근거에서 뺀다

rerank:
  mode: auto                    # auto(iGPU 로 생성할 때만 켬) | on | off
  pool: 10                      # 리랭커에 넣는 후보 수 (RRF·사본 제거 후 상위 N). 5→10: 506문항 +16, TTFT +0.36초(REPORT §35.9)

generation:
  top_k: 3                      # sLLM 에 넣는 근거 청크 수 (리랭킹 후 상위 N)
  max_tokens: 200               # 답변 토큰 상한. 16~1024
  prompt: v0                    # 시스템 지시문. v0(채택) | v4(기각 — 506문항 377→358, REPORT §40)
  model: qwen3-1.7b-q4          # 기본 생성 모델. 셋 중 하나:
                                #   qwen3-0.6b-q4    빠름 — TTFT 중앙 1.5초, 골든셋 v2 must 57/150
                                #   qwen3-1.7b-q4    정밀(기본) — TTFT 중앙 2.7초, must 80/150
                                #   midm-2.0-mini-q4 한국어(KT Mi:dm 2.0 Mini) — must 86/150 이지만 TTFT 중앙 4.5초
                                #   한 번만 다른 모델로 묻고 싶으면 명령에 --model <별칭> 을 붙인다
  flatten_tables: false         # [실험 · 기본 끔] 근거 표를 "머리글: 값" 평문으로 펴서 모델에 넣는다(계획서 3-3).
                                #   예) "| 부장 | 가 | 실비(상한액 176) |" → "구분: 부장 / 등급: 가 / 숙박비: 실비(상한액 176)"
                                #   작은 모델이 표의 칸 대응을 헷갈리는 문제를 줄여 보려는 것.
                                #   골든셋 v2: 정답 0.6B 57→57, 1.7B 80→77 (표 문항만 −3) — 효과 없음.
                                #   모델에 넣는 글만 바꾸므로 재인덱싱 불필요
  parent: off                   # [실험 · 기본 끔] Parent-Child — off | section
                                #   off     : 검색된 128토큰 청크를 그대로 모델에 넣는다
                                #   section : 검색·리랭크는 청크로 하고, 모델에는 그 청크가 속한 절(같은 문서·같은
                                #             section_id 의 청크들)을 이어 붙여 넣는다. 답이 다음 청크로 잘린 문항을 줄이려는 것
                                #   골든셋 v2: 근거 포함 101→117 로 늘었지만 정답은 1.7B 80→81 로 그대로,
                                #   입력이 길어져 TTFT 중앙 2.7→4.0초(3초 이내 72→18%).
                                #   blocks 인덱스의 section_id 로 그때그때 조립하므로 재인덱싱 불필요(legacy 문서는 청크 그대로)
  parent_max_tokens: 400        # parent: section 일 때 절 하나의 상한(64~1500 토큰). 절이 더 길면 검색된 청크를
                                #   가운데 두고 앞뒤 청크를 번갈아 붙이다 멈춘다. 줄이면 빨라지지만 근거가 짧아진다
                                #   (400 · 250 · 200 모두 정답 개선 없음). n_ctx 2048 안에 top_k × 이 값 + 답변이 들어가야 한다
