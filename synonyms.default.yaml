# ─────────────────────────────────────────────────────────────────────
# 기본 동의어 사전 — 일상어로 물어도 규정 용어를 찾게 (plan/동의어사전_설계서_20261027.html)
#
#   모양:  문서 용어: [일상어, 일상어, ...]
#   질문에 일상어가 있으면 키워드 검색(BM25)에만 문서 용어를 덧붙인다. 의미 검색·리랭커는 원래 질문 그대로.
#   예) "할아버지 돌아가시면 휴가 며칠" → BM25 질의에 "조부모 사망" 을 더한다
#
#   ⚠️ 이 파일은 배포 때 덮어쓴다. 내 사전은 같은 폴더의 synonyms.yaml 에 같은 모양으로 적는다
#      (synonyms.yaml 이 앞선다. rejected: 에 [일상어, 문서 용어] 를 적으면 그 짝은 쓰지 않는다).
#   ⚠️ 일상어는 낱말의 '앞부분'으로 맞춘다 — "할아버지" 는 "할아버지가"·"할아버지께서" 에도 맞는다.
#      그래서 한 글자 일상어("애", "형")는 다른 낱말("애플", "형태")에도 걸려 넣지 않는다.
#   ⚠️ 너무 넓은 짝(휴가→휴직 등)은 엉뚱한 문서를 끌어온다 — 좁게 시작한다.
#   켜고 끄기: config.yaml retrieval.synonyms (기본 true) · 환경변수 SIMPLERAG_SYNONYMS=0/1
# ─────────────────────────────────────────────────────────────────────
synonyms:
  # ── 가족관계 ──
  조부모: [할아버지, 할머니, 외할아버지, 외할머니, 조부, 조모]
  배우자: [와이프, 아내, 남편, 집사람, 신랑, 마누라]
  배우자의 부모: [장인, 장모, 시아버지, 시어머니, 시부모, 처가, 시댁]
  부모: [아버지, 어머니, 아빠, 엄마, 부친, 모친]
  자녀: [애기, 아기, 애가, 애들, 아이, 아들, 딸아이, 자식]
  # ── 경조사 ──
  사망: [돌아가시, 돌아가셨, 별세, 작고, 상을 당]
  출산: [애기 낳, 아기 낳, 애 낳, 아이 낳, 출산하]
  경조금: [부조금, 축의금, 조의금, 부의금]
  경조사 휴가: [경조 휴가, 결혼 휴가, 상 휴가, 장례 휴가]
  본인의 결혼: [내가 결혼, 제가 결혼, 나 결혼]
  입학: [초등학교 들어가, 중학교 들어가, 학교 들어가]
  # ── 휴가·근무 ──
  연차휴가: [연차, 월차]
  리프레시 휴가: [재충전 휴가, 안식 휴가, 장기근속 휴가]
  장기근속: [오래 다니, 오래 근무, 오래 일한]
  휴일: [주말, 빨간날]
  공휴일: [빨간날]
  연장근로: [야근, 초과근무, 잔업, 연장 근무]
  통상임금: [월급]
  복직원: [복귀 신청, 복직 신청]
  원격지 근무자: [지방 파견, 파견 근무, 파견자, 파견 나가]
  프로젝트 근무지: [현장 출근, 파견지]
  # ── 비용·지원 ──
  의료비: [병원비, 치료비, 진료비, 약값]
  학자금: [학비, 등록금, 교육비]
  유류비: [기름값, 주유비, 기름 값]
  통행료: [톨비, 고속도로 요금, 하이패스]
  숙박비: [호텔비, 숙소비, 모텔비, 방값]
  식비: [밥값, 식대]
  여비: [출장비]
  일비: [일당]
  기내박: [비행기에서 자, 비행기에서 잠, 기내에서 자, 비행기 안에서 자]
  운임: [차비]
  자차: [내 차, 자가용, 개인 차]
  주택자금: [집 대출, 집 살 때, 전세 대출, 주택 대출]
  침구류: [이불, 베개]
  # ── 조직·직급·결재 ──
  대표이사: [사장님, 사장, 대표님, CEO]
  승인: [허락, 허가]
  구매: [사고 싶, 사야 돼, 사야 해, 살 때]
  동호회: [동아리, 소모임]
  # ── 사건·보안·법 ──
  직장 내 괴롭힘: [갑질, 따돌림, 왕따]
  침해사고: [해킹 사고, 해킹당, 해킹]
  백신: [바이러스 검사, 안티바이러스, 바이러스 프로그램]
  공소시효: [처벌 못, 처벌 기한]
  청탁금지법: [김영란법]
  위반: [어긴, 어기면, 어겼]
